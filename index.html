 .tchat{inset:auto;right:26px;bottom:92px;width:400px;height:560px;max-height:calc(100vh - 120px);border-radius:22px;box-shadow:0 26px 60px -16px rgba(17,24,38,.4)}
 .toast2{bottom:30px}
 .hero h2{font-size:22px}
 .eg-chips{flex-wrap:wrap;overflow:visible}
 .eg-char{width:84px;height:84px;font-size:46px}
 .eg-nm{font-size:18px}
}
/* 초등 루틴 시작 버튼 */
.estart{font-size:13px;font-weight:900;color:#fff;background:var(--brand);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-family:inherit;flex:none;white-space:nowrap}
/* 초등 학습 오버레이 */
.eovl{position:fixed;inset:0;background:rgba(40,40,70,.5);z-index:300;display:none;align-items:flex-end;justify-content:center}
.eovl.show{display:flex}
.esheet{background:#fff;width:100%;max-width:440px;height:88vh;max-height:720px;border-radius:26px 26px 0 0;position:relative;overflow:hidden;animation:eup .25s ease}
@keyframes eup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ex2{position:absolute;top:14px;left:14px;z-index:2;border:0;background:#F0F1F7;width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;color:#888}
.ebody{height:100%;overflow-y:auto;padding:56px 26px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.eprog{display:flex;gap:6px;margin-bottom:20px}
.eprog span{width:26px;height:6px;border-radius:999px;background:#E6E8F0}
.eprog span.on{background:var(--brand)}.eprog span.cur{background:var(--sky)}
.ekind{font-size:13px;font-weight:900;color:var(--brand);background:var(--brand-s);padding:7px 16px;border-radius:999px;margin-bottom:20px}
.eemo{font-size:72px;line-height:1}.eemo.sm{font-size:52px}
.eword{font-size:42px;font-weight:900;color:#2A2D4A;margin-top:12px;letter-spacing:-.5px}
.ewko{font-size:22px;font-weight:800;color:var(--sky);margin-top:8px}
.ebig{margin-top:26px;background:var(--sky-s);color:var(--sky);border:0;border-radius:16px;padding:16px 28px;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit}
.ebtn{margin-top:14px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
.ebtn.sub{background:#F0F1F7;color:#888;margin-top:8px}
.elisten{margin-top:18px;background:var(--sky-s);color:var(--sky);border:0;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.emicwrap{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.emic{width:104px;height:104px;border-radius:50%;border:0;background:#FF5A7A;color:#fff;font-size:40px;cursor:pointer;box-shadow:0 12px 30px -8px #FF5A7A}
.emic.rec{animation:emicpulse 1s infinite}
@keyframes emicpulse{0%{box-shadow:0 0 0 0 rgba(255,90,122,.5)}100%{box-shadow:0 0 0 22px rgba(255,90,122,0)}}
.emichint{font-size:15px;font-weight:800;color:#555}
.estars{font-size:46px;margin:16px 0 6px;letter-spacing:4px}
.estars .estd{opacity:.3}
/* 초등 성장 리포트 */
.erpt{text-align:left}
.erpt-hero{text-align:center;background:var(--brand-s);border-radius:16px;padding:20px;margin-bottom:16px}
.erpt-emo{font-size:40px}
.erpt-hero h3{font-size:19px;font-weight:900;color:var(--brand-ink);margin:6px 0 4px}
.erpt-hero p{font-size:13px;color:var(--ink2);line-height:1.5}.erpt-hero b{color:var(--brand)}
.erpt-row{display:flex;gap:10px;margin-bottom:16px}
.erpt-card{flex:1;background:var(--bg);border-radius:14px;padding:16px;text-align:center}
.erc-v{font-size:22px;font-weight:900;color:var(--ink)}
.erc-l{font-size:12px;font-weight:800;color:var(--ink3);margin-top:3px}
.erpt-sec{margin-bottom:16px}
.erpt-h{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:10px}
.erpt-wk{display:flex;gap:7px;justify-content:space-between}
.erw{flex:1;text-align:center}
.erw-b{height:38px;border-radius:9px;background:var(--brand);margin-bottom:5px}
.erw-b.z{background:var(--line);opacity:.6}
.erw span{font-size:12px;font-weight:800;color:var(--ink3)}
.erpt-note{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:9px}
.erpt-star{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:7px}
.erpt-star span{font-size:14px;font-weight:800;color:var(--ink)}
.erpt-star b{font-size:15px;letter-spacing:1px}
.erpt-teacher{background:#FFF8E6;border:1px solid #F3E6BE;border-radius:14px;padding:15px;margin-bottom:14px}
.erpt-teacher b{font-size:13px;color:#8A6D1A}
.erpt-teacher p{font-size:13px;color:#6B5614;line-height:1.6;margin-top:6px}
.erpt-foot{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:12px}
.epraise{font-size:20px;font-weight:900;color:#2A2D4A}.epraise b{color:var(--brand)}
.ecmp,.edictshow{margin-top:20px}
.ecmp{display:flex;gap:12px;width:100%}
.ecmp button{flex:1;border:2px solid #E6E8F0;background:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;color:#555}
.ecmp button.mine{border-color:var(--sky);color:var(--sky);background:var(--sky-s)}
.edemo{font-size:11.5px;color:#999;line-height:1.6;margin-top:18px;background:#FAFAFC;border-radius:12px;padding:12px 14px}
.edone{display:flex;flex-direction:column;align-items:center;padding-top:40px}
.edone .ede{font-size:64px}.edone h3{font-size:24px;font-weight:900;margin:14px 0 8px}.edone p{font-size:15px;color:#666;line-height:1.6}
.edictbig{width:120px;height:120px;border-radius:50%;background:var(--sun-s);color:var(--sun);font-size:48px;display:grid;place-items:center;cursor:pointer;margin:10px 0}
.edicthint{font-size:14px;color:#666;font-weight:700}
.ehint{font-size:14px;color:var(--sky);font-weight:800;margin-top:18px;background:var(--sky-s);padding:9px 18px;border-radius:999px}
.edin{margin-top:20px;width:100%;border:2.5px solid #E6E8F0;border-radius:16px;padding:18px;font-size:22px;font-weight:800;text-align:center;font-family:inherit;outline:none}
.edin:focus{border-color:var(--brand)}
.edictshow{font-size:15px;color:#555;line-height:1.7}.edictshow b{color:#2A2D4A}
.eupz{margin-top:14px;width:100%;border:2.5px dashed #D8DAE8;border-radius:20px;padding:40px 20px;cursor:pointer;background:#FAFAFC}
.eupic{font-size:52px}.eupz b{display:block;font-size:17px;font-weight:900;color:#2A2D4A;margin-top:12px}.eupz p{font-size:13px;color:#999;margin-top:6px}

/* ===== 초등 게임판 — 내 버디 · 별 · 스티커판 · 보물상자 ===== */
.egame{display:flex;flex-direction:column;gap:11px;margin-bottom:12px}
.eg-c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 15px;box-shadow:0 2px 0 var(--line2)}
/* 버디 카드 */
.eg-buddy{display:flex;gap:13px;align-items:center;cursor:pointer;background:linear-gradient(135deg,#FFFCF2 0%,#F1FAF4 100%);border:1.5px solid #E6EFE8;position:relative;overflow:hidden}
.eg-buddy::after{content:&quot;&quot;;position:absolute;right:-30px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:rgba(46,158,91,.06)}
.eg-buddy:active{transform:scale(.995)}
.eg-char{width:72px;height:72px;border-radius:24px;background:#fff;border:2px solid #E6EFE8;display:grid;place-items:center;font-size:40px;flex:none;position:relative;box-shadow:0 6px 0 #EDF3EE}
.eg-char .eg-lvb{position:absolute;right:-6px;bottom:-6px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 8px;border:2.5px solid #fff;white-space:nowrap}
.eg-bd{flex:1;min-width:0;position:relative;z-index:1}
.eg-nm{font-size:16.5px;font-weight:900;letter-spacing:-.02em}
.eg-nm em{font-style:normal;color:var(--brand);font-size:13px;margin-left:5px}
.eg-nx{font-size:11.5px;font-weight:800;color:var(--ink3);margin-top:1px}
.eg-nx b{color:var(--sun-ink)}
.eg-sbar{height:14px;border-radius:999px;background:#EDF1F5;margin-top:9px;overflow:hidden;position:relative}
.eg-sbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC95C,#FFB63C);transition:.5s cubic-bezier(.2,.9,.3,1.2)}
.eg-sbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:900;color:#7A5300;letter-spacing:.02em}
.eg-more{font-size:11px;font-weight:900;color:var(--brand);margin-top:7px}
/* 미션 칩 */
.eg-mh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:900;margin-bottom:9px}
.eg-mh .eg-cnt{font-size:11px;font-weight:900;color:#fff;background:var(--brand);border-radius:999px;padding:2px 9px}
.eg-mh .eg-rest{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink3)}
.eg-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.eg-chips::-webkit-scrollbar{display:none}
.eg-chip{flex:none;display:flex;align-items:center;gap:6px;background:#F7F9FB;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}
.eg-chip .ck{width:17px;height:17px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:9px;color:var(--faint);font-weight:900}
.eg-chip .st{font-size:10.5px;font-weight:900;color:var(--sun-ink);background:var(--sun-s);border-radius:999px;padding:1px 6px}
.eg-chip.done{background:var(--brand-s);border-color:#BFE6CE;color:var(--brand-ink)}
.eg-chip.done .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.eg-chip.done .st{background:#fff;color:var(--brand)}
/* 스티커판 */
.eg-stk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.eg-day{border:2px dashed #DFE4EC;border-radius:16px;padding:8px 2px 7px;text-align:center;background:#FBFCFD}
.eg-day .dl{font-size:10.5px;font-weight:900;color:var(--faint)}
.eg-day .ds{font-size:21px;line-height:1.25;min-height:27px;display:grid;place-items:center}
.eg-day.on{border-style:solid;border-color:#BFE6CE;background:var(--brand-s)}
.eg-day.on .dl{color:var(--brand-ink)}
.eg-day.today{border-color:var(--sun);background:var(--sun-s);box-shadow:0 0 0 3px rgba(255,182,60,.16)}
.eg-day.today .dl{color:var(--sun-ink)}
/* 보물상자 */
.eg-chest{margin-top:11px;display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#FFF6E2,#FFEFD0);border:1.5px solid #F2DDAE;border-radius:18px;padding:11px 12px}
.eg-cic{font-size:34px;flex:none;filter:drop-shadow(0 3px 0 rgba(138,90,0,.12))}
.eg-cb{flex:1;min-width:0}
.eg-cb b{display:block;font-size:13.5px;font-weight:900;color:#6B4600}
.eg-cb span{font-size:11.5px;font-weight:800;color:#A07A2E}
.eg-cbtn{flex:none;border:0;border-radius:999px;padding:10px 15px;font-size:12.5px;font-weight:900;background:var(--sun);color:#53350B;box-shadow:0 3px 0 #D9931F}
.eg-cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #D9931F}
.eg-cbtn.off{background:#EDEFF3;color:var(--faint);box-shadow:0 3px 0 #DFE3EA}
.eg-coll{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.eg-coll span{width:30px;height:30px;border-radius:11px;background:#F7F9FB;border:1.5px solid var(--line);display:grid;place-items:center;font-size:16px}
.eg-coll span.e{opacity:.45;font-size:11px;color:var(--faint);font-weight:900}
/* 별 획득 팝업 */
.egpop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:420;pointer-events:none;background:rgba(255,255,255,.97);border:2px solid #F2DDAE;border-radius:22px;padding:15px 22px;text-align:center;box-shadow:0 22px 48px -14px rgba(138,90,0,.4);animation:egp .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes egp{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
.egpop .v{font-size:30px;font-weight:900;color:var(--sun-ink);letter-spacing:-.02em}
.egpop .m{font-size:12.5px;font-weight:900;color:var(--ink2);margin-top:3px}
.egpop .big{font-size:62px;line-height:1.1;animation:egb .6s cubic-bezier(.2,.9,.3,1.5)}
@keyframes egb{0%{transform:scale(.3) rotate(-18deg)}60%{transform:scale(1.22) rotate(6deg)}100%{transform:scale(1)}}
/* 진화·보상 모달 본문 */
.etr-now{text-align:center;padding:6px 0 14px;border-bottom:1.5px dashed var(--line);margin-bottom:13px}
.etr-ic{font-size:70px;line-height:1.1}
.etr-n{font-size:21px;font-weight:900;margin-top:5px;letter-spacing:-.02em}
.etr-d{font-size:13px;font-weight:800;color:var(--ink3);margin-top:3px}
.etr-s{font-size:12.5px;font-weight:900;color:var(--sun-ink);background:var(--sun-s);border-radius:999px;padding:6px 14px;display:inline-block;margin-top:10px}
.etr-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);margin-bottom:7px;background:#FBFCFD}
.etr-row.got{border-color:#BFE6CE;background:var(--brand-s)}
.etr-row.now{border-color:var(--sun);background:var(--sun-s);box-shadow:0 0 0 3px rgba(255,182,60,.15)}
.etr-row .ri{font-size:30px;flex:none;width:40px;text-align:center}
.etr-row.lock .ri{filter:grayscale(1);opacity:.4}
.etr-row .rm{flex:1;min-width:0}
.etr-row .rm b{display:block;font-size:14px;font-weight:900}
.etr-row .rm span{font-size:11.5px;font-weight:800;color:var(--ink3)}
.etr-row .rv{font-size:11px;font-weight:900;color:var(--faint);flex:none}
.etr-row.now .rv{color:var(--sun-ink)}
.etr-note{margin-top:12px;background:var(--brand-s);border:1.5px solid #BFE6CE;border-radius:16px;padding:11px 13px;font-size:12.5px;font-weight:800;color:var(--brand-ink);line-height:1.6}


/* 받아쓰기 — 학년 분기 */
.edgrade{font-size:11.5px;font-weight:800;color:var(--ink3);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.edsw{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;color:var(--ink3);font-family:inherit;cursor:pointer}
.edsw:hover{border-color:var(--brand);color:var(--brand)}
.edin.en{font-size:18px;text-align:left;letter-spacing:0}
.ehsub{font-size:11.5px;color:var(--ink3);font-weight:700}
.edwords{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px}
.edw{font-size:14px;font-weight:900;border-radius:9px;padding:6px 11px}
.edw.ok{background:var(--brand-s);color:var(--brand-ink)}
.edw.ng{background:#FDEBEB;color:#C23B3B;text-decoration:underline wavy #E85050}


/* ===== 초등 특강 — 저학년은 흥미 위주, 고학년은 학습 연결 ===== */
.etk-tabs{display:flex;gap:6px;margin-bottom:10px}
.etk-tab{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:9px 8px;font-size:12px;font-weight:900;color:var(--ink3);font-family:inherit;cursor:pointer;line-height:1.3}
.etk-tab em{display:block;font-style:normal;font-size:10px;font-weight:700;margin-top:2px}
.etk-tab.on{border-color:var(--brand);background:var(--brand-s);color:var(--brand-ink)}
.etk-item{display:flex;gap:11px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;background:#FBFCFD;cursor:pointer;transition:.13s}
.etk-item:hover{border-color:var(--brand);background:#F6FBF8}
.etk-item.added{border-color:#BFE6CE;background:var(--brand-s)}
.etk-th{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.etk-b{flex:1;min-width:0}
.etk-cat{font-size:10px;font-weight:900;border-radius:999px;padding:2px 8px;display:inline-block}
.etk-b b{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin-top:3px}
.etk-b p{font-size:11.5px;font-weight:700;color:var(--ink3);line-height:1.45;margin-top:1px}
.etk-when{font-size:10.5px;font-weight:800;color:var(--ink3);margin-top:4px}
.etk-when em{font-style:normal;color:var(--brand);font-weight:900}
.etk-join{flex:none;border:0;border-radius:11px;padding:9px 13px;font-size:11.5px;font-weight:900;font-family:inherit;background:var(--brand);color:#fff;cursor:pointer}
.etk-join.done{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px #BFE6CE;cursor:default}
.etk-note{margin-top:4px;background:var(--sun-s);border:1px solid #F0D9B0;border-radius:13px;padding:10px 12px;font-size:11.5px;font-weight:800;color:var(--sun-ink);line-height:1.6}


.etk-slot{display:block;margin-top:5px;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 9px;width:fit-content}
.etk-slot.free{background:#F0F9F4;color:#1E7A45}
.etk-slot.warn{background:#FDEBEB;color:#C23B3B}
.etk-slot.done{background:var(--brand-s);color:var(--brand-ink)}
/* 겹침 확인 모달 (초등) */
.etkm-ic{font-size:46px;text-align:center;line-height:1.1}
.etkm-h{font-size:20px;font-weight:900;text-align:center;margin-top:6px;letter-spacing:-.02em}
.etkm-d{font-size:13.5px;font-weight:800;color:var(--ink2);text-align:center;line-height:1.7;margin-top:8px}
.etkm-cmp{margin-top:14px;border:1.5px solid var(--line);border-radius:15px;overflow:hidden}
.etkm-row{display:flex;gap:9px;align-items:center;padding:11px 13px;font-size:12.5px;font-weight:800;background:#FBFCFD;border-bottom:1px solid var(--line)}
.etkm-row:last-child{border:0}
.etkm-row.new{background:var(--sun-s)}
.etkm-l{flex:none;font-size:10px;font-weight:900;border-radius:999px;padding:3px 9px;background:#fff;color:var(--ink3)}
.etkm-row.new .etkm-l{background:var(--sun);color:#53350B}
.etkm-note{margin-top:12px;background:var(--line2);border-radius:13px;padding:11px 13px;font-size:12px;font-weight:800;color:var(--ink2);line-height:1.6}
.etkm-sug{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.etkm-sb{display:flex;align-items:center;gap:10px;border:1.5px solid #BFE6CE;background:var(--brand-s);border-radius:14px;padding:11px 12px;font-family:inherit;cursor:pointer;text-align:left}
.etkm-sb .sbi{font-size:21px;flex:none}
.etkm-sb .sbb b{display:block;font-size:13px;font-weight:900;color:var(--brand-ink)}
.etkm-sb .sbb em{font-style:normal;font-size:11px;font-weight:800;color:var(--brand)}
.ebtn.sub2{background:var(--line2);color:var(--ink2);margin-top:7px}


/* 특강 카드 — 참여 방식 / 준비물 */
.etk-mode{margin-top:6px;background:#EEF4FE;border:1px solid #D3E0F8;border-radius:11px;padding:7px 10px;font-size:10.5px;font-weight:700;color:#2B4A82;line-height:1.5;cursor:pointer}
.etk-mode:hover{border-color:#2E7CF0}
.etk-mode span{display:block;font-size:11.5px;font-weight:900;color:#2E7CF0}
.etk-mode em{font-style:normal;font-weight:900;color:#2E7CF0}
.etk-prep{margin-top:5px;font-size:10.5px;font-weight:800;color:var(--sun-ink);background:var(--sun-s);border-radius:9px;padding:4px 9px;display:inline-block}

/* ===== 대규모 라이브 화면 ===== */
.lv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1.5px solid var(--line)}

.lv-ttl{font-size:14.5px;font-weight:900;letter-spacing:-.02em;flex:1;min-width:0}
.lv-cnt{font-size:11.5px;font-weight:800;color:var(--ink3)}
.lv-cnt b{color:var(--ink);font-variant-numeric:tabular-nums}
.lv-stage{display:flex;gap:11px;align-items:center;background:linear-gradient(135deg,#2E9E5B,#4CC27E);border-radius:16px;padding:13px 15px;color:#fff;margin:12px 0}
.lv-tea{font-size:30px;flex:none}
.lv-sb b{display:block;font-size:14px;font-weight:900}
.lv-sb span{font-size:11px;font-weight:700;opacity:.85}
.lv-sec{border:1px solid var(--line);border-radius:17px;padding:14px 15px;margin-bottom:11px;background:var(--card)}
.lv-sh{display:flex;align-items:center;font-size:13px;font-weight:900;margin-bottom:10px}
.lv-sh span{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ink3)}
.lv-q{font-size:16px;font-weight:900;letter-spacing:-.02em;line-height:1.5}
.lv-qs{font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:4px;margin-bottom:11px;line-height:1.6}
.lv-opt{position:relative;display:flex;align-items:center;width:100%;border:1.5px solid var(--line);background:#FBFCFD;border-radius:13px;padding:12px 13px;margin-bottom:6px;font-family:inherit;cursor:pointer;overflow:hidden;text-align:left}
.lv-opt:hover{border-color:var(--brand)}
.lv-ob{position:absolute;left:0;top:0;bottom:0;background:rgba(46,158,91,.14);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.lv-ot{position:relative;flex:1;min-width:0;font-size:13.5px;font-weight:800;color:var(--ink2)}
.lv-op{position:relative;flex:none;font-size:12.5px;font-weight:900;color:var(--ink3);font-variant-numeric:tabular-nums}
.lv-opt.ans{border-color:var(--brand);background:var(--brand-s)}
.lv-opt.ans .lv-ot,.lv-opt.ans .lv-op{color:var(--brand-ink)}
.lv-opt.ans .lv-ob{background:rgba(46,158,91,.22)}
.lv-opt.mine{border-color:#E8A0A0}
.lv-opt.mine .lv-ob{background:rgba(226,59,59,.12)}
.lv-res{margin-top:9px;border-radius:13px;padding:11px 13px;font-size:13px;font-weight:900;text-align:center}

.lv-res.ng{background:var(--sun-s);color:var(--sun-ink)}
.lv-exp{margin-top:8px;background:#FBFCFD;border:1px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.7}
.lv-hint{margin-top:9px;font-size:11px;font-weight:800;color:var(--ink3);line-height:1.6}
.lv-ta{width:100%;min-height:110px;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:14px;font-weight:600;font-family:inherit;line-height:1.7;outline:none;resize:vertical}
.lv-ta:focus{border-color:var(--brand)}
.lv-myrank{background:linear-gradient(135deg,#C28A1E,#E0A93A);border-radius:16px;padding:16px;text-align:center;color:#fff;margin-bottom:11px}
.lv-mrv{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1}
.lv-mrv span{font-size:16px;margin-left:2px}
.lv-mrl{font-size:12.5px;font-weight:800;margin-top:4px;opacity:.95}
.lv-board{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.lv-br{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:800}
.lv-br:last-child{border:0}
.lv-br.me{background:var(--brand-s)}
.lv-brk{width:22px;text-align:center;flex:none;font-weight:900;color:var(--ink3)}
.lv-brn{flex:1;min-width:0}
.lv-brv{flex:none;font-weight:900;font-variant-numeric:tabular-nums}
.lv-read{font-size:21px;font-weight:900;text-align:center;background:#FBFCFD;border:1.5px dashed var(--line);border-radius:14px;padding:18px 14px;letter-spacing:-.01em;line-height:1.6}
.lv-private{margin-top:11px;background:#F0EBFC;border:1px solid #DED5F5;border-radius:13px;padding:11px 13px;font-size:12px;font-weight:800;color:#5B3F94;line-height:1.65}
.lv-micres{margin-top:12px;background:var(--brand-s);border:1.5px solid #BFE6CE;border-radius:16px;padding:16px;text-align:center}
.lv-mv{font-size:38px;font-weight:900;color:var(--brand);letter-spacing:-.04em;line-height:1}
.lv-mv span{font-size:15px;margin-left:2px}
.lv-ml{font-size:12.5px;font-weight:800;color:var(--brand-ink);margin-top:4px}
.lv-rbtns{display:flex;gap:7px}
.lv-rb{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:11px;font-size:13px;font-weight:900;font-family:inherit;cursor:pointer;color:var(--ink2)}
.lv-rb.ok.on{border-color:var(--brand);background:var(--brand-s);color:var(--brand-ink)}
.lv-rb.no.on{border-color:#E8A33C;background:var(--sun-s);color:var(--sun-ink)}
.lv-rbar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--line2);margin-top:9px}
.lv-rbar i{display:block;height:100%;transition:width .5s}
.lv-rbar i.ok{background:var(--brand)}
.lv-rbar i.no{background:var(--sun)}
.lv-chat{min-height:96px;display:flex;flex-direction:column-reverse;gap:5px;justify-content:flex-end}
.lv-cm{font-size:12px;font-weight:700;color:var(--ink2);background:#FBFCFD;border-radius:10px;padding:7px 10px;animation:lvin .3s}
@keyframes lvin{from{opacity:0;transform:translateY(5px)}}
.lv-cm b{font-weight:900;color:var(--brand);margin-right:6px}
.lv-aiq{margin-top:9px;background:#EEF4FE;border:1px solid #D3E0F8;border-radius:12px;padding:11px 13px;font-size:12px;font-weight:700;color:#2B4A82;line-height:1.65}
.lv-cin{display:flex;gap:6px;margin-top:9px}
.lv-cin input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700;font-family:inherit;outline:none}
.lv-cin input:focus{border-color:var(--brand)}
.lv-cin button{flex:none;border:0;border-radius:11px;width:44px;background:var(--brand);color:#fff;font-weight:900;cursor:pointer}


/* 라이브 — 채널 / 규모 전환 */
.lv-chs{display:flex;gap:6px;margin-top:11px}
.lv-ch{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:9px 7px;font-size:12px;font-weight:900;color:var(--ink3);font-family:inherit;cursor:pointer;line-height:1.3}
.lv-ch em{display:block;font-style:normal;font-size:9.5px;font-weight:700;margin-top:2px}
.lv-ch.on{border-color:var(--brand);background:var(--brand-s);color:var(--brand-ink)}
.lv-scale{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.lv-sl{font-size:10.5px;font-weight:800;color:var(--ink3);flex:none}
.lv-sc{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:900;color:var(--ink3);font-family:inherit;cursor:pointer}
.lv-sc.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lv-roombar{margin-top:9px;background:#F7F9FC;border:1px dashed var(--line);border-radius:13px;padding:10px 12px}
.lv-rb2{display:block;font-size:12px;font-weight:900;color:var(--ink)}
.lv-rd{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.6;margin-top:3px}
.lv-cheerb{margin-left:auto;flex:none;border:0;border-radius:999px;padding:8px 13px;font-size:11.5px;font-weight:900;font-family:inherit;background:rgba(255,255,255,.22);color:#fff;cursor:pointer}
.lv-pin{margin-top:11px;background:var(--sun-s);border:1px solid #F0D9B0;border-radius:13px;padding:10px 12px;font-size:12px;font-weight:800;color:var(--sun-ink)}
.lv-callout{margin-top:9px;background:#EFE9FB;border:1px solid #DED5F5;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:800;color:#5B3F94}
.lv-mrs{font-size:11px;font-weight:800;opacity:.95}
.lv-handb{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:12px;font-size:13px;font-weight:900;font-family:inherit;cursor:pointer;color:var(--ink2);margin-bottom:8px}
.lv-handb.up{border-color:var(--sun);background:var(--sun-s);color:var(--sun-ink)}
.lv-handb.live{border-color:#E23B3B;background:#FDEBEB;color:#C23B3B;animation:lvpulse 1.4s infinite}
.lv-emos{display:flex;gap:6px;margin-top:9px}
.lv-emo{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px;font-size:17px;cursor:pointer;font-family:inherit}
.lv-emo:hover{border-color:var(--brand);background:var(--brand-s)}
.lv-cm.me{background:var(--brand-s);color:var(--brand-ink)}
.lv-cm.me b{color:var(--brand-ink)}
.lv-cm.tea{background:#EFE9FB}
.lv-cm.tea b{color:#6B4FA0}
/* 떠오르는 이모지 */
.lv-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lv-fxe{position:absolute;bottom:14%;font-size:26px;animation:lvup 1.8s ease-out forwards;opacity:0}
@keyframes lvup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-260px) scale(1.25)}}
.esheet{position:relative}

/* ===== 초등 학부모(엄마) 화면 ===== */
.pm-hero{background:linear-gradient(140deg,#E5B800,#FFCE3A);border-radius:20px;padding:18px;color:#53350B;margin-bottom:12px}
.pm-hero .ph{font-size:11.5px;font-weight:900;opacity:.75}
.pm-hero h3{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:3px}
.pm-hero .pd{font-size:12.5px;font-weight:800;margin-top:4px;opacity:.85;line-height:1.55}
.pm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.pm-st{background:rgba(255,255,255,.55);border-radius:13px;padding:10px;text-align:center}
.pm-st b{display:block;font-size:19px;font-weight:900;letter-spacing:-.03em}
.pm-st span{font-size:10.5px;font-weight:800;opacity:.75}
.pm-sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px;margin-bottom:11px}
.pm-sh{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.pm-sh span{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ink3)}
.pm-todo{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:7px;background:#FBFCFD}
.pm-todo.hot{border-color:#F2C94C;background:#FFFBF0}
.pm-todo .pi{font-size:19px;flex:none}
.pm-todo .pb{flex:1;min-width:0}
.pm-todo .pb b{display:block;font-size:13px;font-weight:900}
.pm-todo .pb span{font-size:11.5px;font-weight:700;color:var(--ink3);line-height:1.5;display:block;margin-top:1px}
.pm-todo button{flex:none;border:0;border-radius:10px;padding:8px 13px;font-size:11.5px;font-weight:900;font-family:inherit;background:var(--brand);color:#fff;cursor:pointer}
.pm-todo button.sub{background:var(--line2);color:var(--ink2)}
.pm-rt{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pm-rt:last-child{border:0}
.pm-rt .ri2{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none}
.pm-rt .rb2{flex:1;min-width:0;font-size:12.5px;font-weight:800}
.pm-rt .rb2 span{display:block;font-size:11px;font-weight:700;color:var(--ink3)}
.pm-rt .rv2{flex:none;font-size:11.5px;font-weight:900}
.pm-rt .rv2.ok{color:var(--brand)}.pm-rt .rv2.ng{color:var(--faint)}
.pm-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.pm-wd{text-align:center;border-radius:11px;padding:7px 2px;background:#F4F6F9}
.pm-wd b{display:block;font-size:10.5px;font-weight:900;color:var(--faint)}
.pm-wd i{font-style:normal;font-size:16px;line-height:1.3}
.pm-wd.ok{background:var(--brand-s)}.pm-wd.ok b{color:var(--brand-ink)}
.pm-teach{background:var(--brand-s);border:1px solid #BFE6CE;border-radius:16px;padding:13px 15px;font-size:12.5px;font-weight:800;color:var(--brand-ink);line-height:1.7}
.pm-teach b{display:block;font-size:11.5px;margin-bottom:5px;opacity:.75}
.pm-kakao{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pm-kakao:last-child{border:0}
.pm-kakao .ki{width:28px;height:28px;border-radius:9px;background:#FEE500;color:#3C1E1E;display:grid;place-items:center;font-size:9.5px;font-weight:900;flex:none}
.pm-kakao b{display:block;font-size:12.5px;font-weight:900}
.pm-kakao p{font-size:11.5px;font-weight:700;color:var(--ink3);line-height:1.5;margin-top:1px}
.pm-kakao .kt{margin-left:auto;flex:none;font-size:10.5px;font-weight:700;color:var(--faint)}
.pm-note{background:var(--line2);border-radius:14px;padding:12px 14px;font-size:11.5px;font-weight:800;color:var(--ink2);line-height:1.7}
.pm-note b{color:var(--ink)}
.pm-setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pm-setrow:last-child{border:0}
.pm-setrow .sb{flex:1;min-width:0;font-size:12.5px;font-weight:800}
.pm-setrow .sb span{display:block;font-size:11px;font-weight:700;color:var(--ink3)}
.pm-tg{flex:none;width:42px;height:24px;border-radius:999px;border:0;background:var(--brand);position:relative;cursor:pointer;transition:.15s}
.pm-tg::after{content:&quot;&quot;;position:absolute;top:3px;left:21px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.pm-tg.off{background:#D8DEE7}
.pm-tg.off::after{left:3px}

/* ===== PC 좌측 네비 (넓은 화면에서만) ===== */
.enav{display:none;position:fixed;left:0;top:0;bottom:0;width:220px;z-index:60;
 background:linear-gradient(175deg,#2E9E5B,#1C7A42);color:#fff;flex-direction:column;padding:20px 12px 16px}
.enav .elogo{display:flex;align-items:center;gap:9px;padding:0 8px;font-weight:900;font-size:18px;letter-spacing:-.02em}
.enav .elogo .mk2{width:31px;height:31px;border-radius:10px;background:#B6E34A;display:grid;place-items:center;flex:none}
.enav .elogo .mk2 svg{width:21px;height:21px}
.enav .eroom{font-size:10.5px;color:rgba(255,255,255,.55);font-weight:700;padding:3px 8px 0 48px}
.enav .emenu{margin-top:22px;display:flex;flex-direction:column;gap:3px}
.enav .emi{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;border:0;background:none;color:rgba(255,255,255,.74);font-weight:800;font-size:13px;text-align:left;font-family:inherit;transition:.12s}
.enav .emi .ei{font-size:15px;width:19px;text-align:center;flex:none}
.enav .emi:hover{background:rgba(255,255,255,.09);color:#fff}
.enav .emi.on{background:rgba(255,255,255,.15);color:#fff}
.enav .emi .lvb2{margin-left:auto;font-size:8.5px;font-weight:900;background:#F0663B;color:#fff;border-radius:999px;padding:1px 6px}
.enav .emi .stb2{margin-left:auto;font-size:9px;font-weight:900;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 6px}
.enav .ediv{font-size:9.5px;font-weight:800;color:rgba(255,255,255,.4);padding:14px 10px 5px;letter-spacing:.02em}
.enav .esp{flex:1}
.enav .eprof{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 11px}
.enav .eprof .av2{width:32px;height:32px;border-radius:11px;background:#B6E34A;color:#14532D;display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.enav .eprof b{font-size:12.5px;display:block}
.enav .eprof .g2{font-size:10px;color:rgba(255,255,255,.58);font-weight:700}

/* ===== 주간 루틴표 (PC에서 가로폭을 쓰는 카드) ===== */
.ewk-wrap{overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.ewk-wrap::-webkit-scrollbar{display:none}
.ewk{width:100%;min-width:470px;border-collapse:separate;border-spacing:0 5px}
.ewk th{font-size:11px;font-weight:900;color:var(--ink3);padding:0 0 4px;text-align:center}
.ewk th.rh{text-align:left;padding-left:4px;width:132px}
.ewk th.td2{color:var(--sun-ink)}
.ewk td{text-align:center;padding:0 2px}
.ewk td.rl{text-align:left;font-size:12.5px;font-weight:800;color:var(--ink2);padding-left:4px;white-space:nowrap}
.ewk td.rl span{margin-right:5px}
.ewk .cel{width:34px;height:34px;margin:0 auto;border-radius:11px;display:grid;place-items:center;font-size:14px;background:#F4F6F9;border:1.5px solid transparent;color:var(--faint);font-weight:900;cursor:pointer}
.ewk .cel.ok{background:var(--brand-s);border-color:#BFE6CE}
.ewk .cel.todo{background:#fff;border:1.5px dashed #D8DEE7;font-size:11px}
.ewk .cel.none{background:transparent;color:#DCE1E8;font-size:11px;cursor:default}
.ewk tr.tdcol td:nth-child(5) .cel{box-shadow:0 0 0 3px rgba(255,182,60,.2)}
.ewk tfoot td{padding-top:7px}
.ewk tfoot .st2{font-size:10.5px;font-weight:900;color:var(--sun-ink);background:var(--sun-s);border-radius:999px;padding:2px 0;display:block}
.ewk tfoot td.rl{font-size:11px;color:var(--ink3);font-weight:900}
.ewk-lg{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;font-weight:800;color:var(--ink3)}
.ewk-lg i{display:inline-block;width:12px;height:12px;border-radius:5px;vertical-align:-2px;margin-right:4px}

 body{padding-left:220px}

}

.wkline{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.wkline .wkbar{flex:1;height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.wkline .wkbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-d));transition:.3s}
.wkline span{font-size:10.5px;font-weight:800;color:var(--ink3);white-space:nowrap}
.autonote{display:flex;align-items:center;gap:7px;margin:0 20px 13px;font-size:11px;font-weight:700;color:#B5491F;background:var(--s-livet);border-radius:9px;padding:7px 12px}
.odbar{display:flex;align-items:center;gap:11px;margin:0 20px 13px;background:#FFF1F1;border:1px solid #F7C9C9;border-radius:11px;padding:11px 15px}
.odbar .odic{width:28px;height:28px;border-radius:8px;background:#E23B3B;display:grid;place-items:center;flex:none}
.odbar .odic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5;fill:none}
.odbar .odtx{flex:1;font-size:12.5px;color:#9A1B22;line-height:1.4}
.odbar .odtx b{font-weight:900}
.odbar .odbtn{background:#E23B3B;color:#fff;border:0;font-size:12px;font-weight:900;padding:8px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.odbar .odbtn:hover{background:#C92F38}
.an-dot{width:7px;height:7px;border-radius:50%;background:var(--s-live);flex:none}
.lg{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:3px}
.grid{overflow-x:auto}
.gtbl{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.gtbl th{font-size:12px;font-weight:800;color:var(--ink2);padding:0 0 9px;background:var(--card)}
.gtbl th.today{color:var(--brand)}
.gtbl th .tdd{font-size:10.5px;color:var(--faint);font-weight:700;margin-top:1px}
.gtbl th.today .tdd{color:var(--brand-d)}
.gtbl th.wkd,.gtbl td.wkd{opacity:.82}
.gtbl td{border-top:1px solid var(--line2);border-left:1px solid var(--line2);height:42px;vertical-align:top;padding:0;position:relative}
.gtbl td.timecol,.gtbl th.timecol{width:58px}
.gtbl td.timecol{border-left:0;text-align:right;padding:4px 10px 0 0;font-size:10.5px;color:var(--ink3);font-weight:800;position:sticky;left:0;background:var(--card);z-index:2;white-space:nowrap}
.gtbl th.timecol{position:sticky;left:0;background:var(--card);z-index:3}
.gtbl td.todaycol{background:var(--brand-s2)}
.blk{position:absolute;left:3px;right:3px;top:2px;bottom:2px;border-radius:8px;padding:6px 8px 6px 11px;overflow:hidden;line-height:1.25;cursor:pointer;transition:.1s}
/* 과목 컬러바 — 색으로 한눈에 구분 */
.blk::before{content:&#x27;&#x27;;position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor;opacity:.75;border-radius:8px 0 0 8px}
/* 외부 일정(학원·하교) — 내 공부 아님을 시각 구분 */
.blk.ext{background:repeating-linear-gradient(135deg,rgba(140,146,166,.1) 0 7px,rgba(140,146,166,.03) 7px 14px) !important;color:var(--ink3) !important;box-shadow:inset 0 0 0 1px var(--line)}
.blk.ext::before{opacity:.35}
.blk.ext .bt{font-weight:700;color:var(--ink2)}
.blk:hover{filter:brightness(.97);box-shadow:0 2px 8px -2px rgba(25,30,46,.18)}
.blk .bt{font-size:11.5px;font-weight:700;letter-spacing:-.02em}
.blk .bs{font-size:9.5px;opacity:.8;margin-top:1px;font-weight:600}
.blk.islive{box-shadow:inset 0 0 0 1.5px var(--s-live)}
.blk.auto{border-left:3px solid var(--s-live)}
.blk .atag{display:inline-block;font-size:7.5px;font-weight:900;color:var(--s-live);background:#fff;border-radius:4px;padding:0 4px;margin-top:3px;letter-spacing:.02em}
.blk .aitag{display:inline-block;font-size:7.5px;font-weight:900;color:#fff;background:#7B61F2;border-radius:4px;padding:0 4px;margin-top:3px}
.blk .ltag{position:absolute;top:4px;right:4px;font-size:8px;font-weight:900;color:#fff;background:var(--s-live);padding:1px 4px;border-radius:4px}
.blk .chk{position:absolute;bottom:5px;right:5px;width:15px;height:15px;border-radius:5px;background:var(--ok);display:none;place-items:center}
.blk.done{opacity:.55}
.blk.done .chk{display:grid}
.blk .chk svg{width:9px;height:9px;stroke:#fff;stroke-width:3.5}
/* 미완료 — 경고판처럼 안 보이게 절제 (좌측 바 + 작은 점만) */
.blk.overdue{box-shadow:inset 0 0 0 1px rgba(226,59,59,.28)}
.blk.overdue::before{background:#E23B3B;opacity:1}
.blk .odtag{position:absolute;bottom:5px;right:5px;width:6px;height:6px;padding:0;border-radius:50%;background:#E23B3B;font-size:0;overflow:hidden}

/* ===== 우측 레일 ===== */
.rail{width:316px;flex:none;display:flex;flex-direction:column;gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px}
.now{background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff;border:0;position:relative;overflow:hidden}
.now::after{content:&quot;&quot;;position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(182,227,74,.16)}
.now .nk{font-size:11.5px;font-weight:800;color:var(--lime);display:flex;align-items:center;gap:7px;position:relative}
.now .ld{width:8px;height:8px;border-radius:50%;background:var(--s-live);position:relative}
.now .ld::after{content:&quot;&quot;;position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--s-live);opacity:.5;animation:rip 1.8s infinite}
@keyframes rip{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.now h3{font-size:18px;font-weight:800;margin-top:9px;position:relative;letter-spacing:-.01em}
.now .ns{font-size:12px;color:rgba(255,255,255,.75);margin-top:3px;position:relative}
.now .nbtn{margin-top:13px;width:100%;background:var(--lime);color:var(--lime-ink);border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;position:relative}
.now .nbtn:active{transform:translateY(1px)}

.rc .rh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.rc .rh b{font-size:15px;font-weight:800}
.rc .rh .sub{font-size:11px;color:var(--ink3);font-weight:700}
.todo{list-style:none}
.todo li{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line2)}
.todo li:first-child{border-top:0}
.todo .tic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:900}
.todo .tb{flex:1;min-width:0}
.todo .tb b{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.todo .tb .ts{font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.todo li.ext .tb b{color:var(--ink2);font-weight:700}
.todo .cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;cursor:pointer;transition:.12s}
.todo .cb svg{width:12px;height:12px;stroke:#fff;stroke-width:3.5;opacity:0}
.todo .cb.lock{border:0;background:none;cursor:default}
.todo .cb.lock svg{width:15px;height:15px;stroke:var(--faint);opacity:1;stroke-width:2}
.todo .cb[disabled]{background:var(--ok);border-color:var(--ok);cursor:default}
.todo .cb[disabled] svg{opacity:1}
.todo li.done .cb{background:var(--ok);border-color:var(--ok)}
.todo li.done .cb svg{opacity:1}
.todo li.done .tb b{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--ink3)}
.todo .lvb{font-size:9px;font-weight:900;color:#fff;background:var(--s-live);border-radius:999px;padding:2px 7px;flex:none}
.todo .stb{font-size:12px;font-weight:900;color:#fff;background:var(--brand);border:0;border-radius:9px;padding:7px 13px;flex:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.todo .stb.live{background:var(--s-live)}
.todo .stb:hover{filter:brightness(1.08)}
.todo li.tap{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.todo li.tap:hover{background:var(--brand-s)}
.todo li.tap:hover+li{border-top-color:transparent}

.schooltag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ok);background:var(--s-matht);border-radius:999px;padding:5px 11px;cursor:pointer}
.gtbl tr.allday td{height:auto;border-top:0;padding:2px 3px 7px;vertical-align:middle}
.gtbl tr.allday td.timecol{font-size:9px;line-height:1.3;padding-top:4px}
.schip{display:block;font-size:9.5px;font-weight:800;border-radius:7px;padding:5px 7px;line-height:1.3;cursor:pointer;color:#fff}
.schip.perf{background:var(--s-prob)}
.schip.test{background:var(--s-exam)}
.schip:hover{filter:brightness(1.06)}
.srcb{margin-left:auto;margin-right:36px;font-size:10px;font-weight:800;color:var(--ok);background:var(--s-matht);border-radius:6px;padding:3px 8px;white-space:nowrap}
.upsch{list-style:none;margin-top:12px;border-top:1px solid var(--line2);padding-top:4px}
.upsch li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12px;font-weight:700}
.upsch li .ud{font-size:10.5px;font-weight:800;color:var(--ink3);width:52px;flex:none}
.upsch li .ui{width:7px;height:7px;border-radius:3px;flex:none}
.upsch li .dd2{margin-left:auto;font-size:10px;font-weight:900;color:var(--s-exam)}
.srcline{margin-top:9px;font-size:10px;color:var(--faint);font-weight:600}

.exam .rh .dday{font-size:13px;font-weight:900;color:#fff;background:var(--s-exam);border-radius:999px;padding:3px 11px}
.goalrow{display:flex;gap:9px;margin-top:10px}
.goal{flex:1;background:var(--bg);border-radius:11px;padding:9px 11px}
.goal .gl{font-size:10.5px;color:var(--ink3);font-weight:700}
.goal .gv{font-size:14.5px;font-weight:800;margin-top:1px}
.gbar-w{margin-top:12px}
.gbars{display:flex;gap:12px;align-items:flex-end;height:86px;padding:0 4px}
.gb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.gb i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:#CBD2E0}
.gb.on i{background:var(--brand-d)}
.gb.tgt i{background:var(--lime);outline:2px dashed var(--lime-d);outline-offset:-2px}
.gb em{font-style:normal;font-size:9px;font-weight:700;color:var(--ink3);margin-top:5px;text-align:center;line-height:1.25}
.gb.tgt em{color:var(--lime-d);font-weight:800}
.exbtns{display:flex;gap:8px;margin-top:13px}
.exb{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px;font-weight:800;font-size:12px;color:var(--ink2)}
.exb.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.exb.ex{border-color:#F2C6C8;color:var(--s-exam);background:#FFF6F6}
.addtodo{width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:11px;padding:10px;font-weight:800;font-size:12px;color:var(--ink3)}
.addtodo:hover{border-color:var(--brand-d);color:var(--brand)}

.tray{background:var(--lime-s);border-color:#E2EFC2}
.tray .rh b{color:var(--lime-ink)}
.ti{margin-top:9px;background:var(--card);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.ti .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ti .tic svg{width:17px;height:17px}
.ti .tib{flex:1;min-width:0}
.ti .tib b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .tib .tis{font-size:10.5px;color:var(--ink3)}
.ti .split{display:flex;gap:5px;flex:none}
.ti .split button{font-weight:800;font-size:10.5px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;color:var(--ink2);white-space:nowrap}
.ti .split button.p{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== 모달 ===== */
.ovl{position:fixed;inset:0;background:rgba(25,30,46,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.ovl.show{display:flex}
/* === 영단어 학습 모듈 === */
.wordovl{position:fixed;inset:0;background:rgba(25,30,46,.55);z-index:140;display:none;align-items:center;justify-content:center;padding:20px}
.wordovl.show{display:flex}
.wordsheet{background:var(--card);width:100%;max-width:440px;height:auto;max-height:88vh;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;animation:winup .22s ease}
/* 모바일 실기기(좁은 폭): bottom-sheet 유지가 자연스러움 */
@media(max-width:560px){
 .wordovl{align-items:flex-end;padding:0}
 .wordsheet{max-width:100%;height:92vh;max-height:760px;border-radius:24px 24px 0 0}
}
.wtop{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.wx{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--ink2);flex:none}
.wprog{flex:1;height:7px;background:var(--line2);border-radius:999px;overflow:hidden}
.wpbar{height:100%;background:var(--s-word);border-radius:999px;transition:width .3s;width:0}
.wcount{font-size:12px;font-weight:800;color:var(--ink3);flex:none}
.wbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.wsrs{font-size:11px;font-weight:900;color:var(--s-word);background:var(--s-wordt);padding:5px 12px;border-radius:999px;margin:8px 0 18px}
.wword{font-size:38px;font-weight:900;color:var(--ink);letter-spacing:-.5px}
.wword.sm{font-size:30px;margin-top:10px}
.wipa{font-size:15px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:8px;justify-content:center}
.wplay{border:0;background:var(--s-wordt);color:var(--s-word);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.wplay.sm{padding:3px 8px;font-size:12px;vertical-align:middle}
.wcompare{display:flex;gap:10px;margin:10px 0 2px;width:100%}
.wcompare .wcmp{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.wcompare .wcmp.mine{border-color:var(--s-word);color:var(--s-word);background:var(--s-wordt)}
.wdemo{font-size:11.5px;color:var(--ink3);line-height:1.6;background:#FFF8EC;border-radius:10px;padding:11px 14px;width:100%;margin-top:6px}
.wdemo b{color:var(--s-exam)}
.wko{font-size:20px;font-weight:800;color:var(--brand);margin-top:18px}
.wex{margin-top:20px;background:var(--bg);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--ink);line-height:1.6;width:100%}
.wex b{color:var(--s-word);font-weight:900}
.wexko{font-size:13px;color:var(--ink3);margin-top:6px}
.wbtn{margin-top:26px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.wbtn.sub{background:var(--bg);color:var(--ink2)}
.wmicwrap{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.wmic{width:96px;height:96px;border-radius:50%;border:0;background:var(--s-word);color:#fff;font-size:36px;cursor:pointer;position:relative;display:grid;place-items:center;box-shadow:0 12px 30px -8px var(--s-word)}
.wmic .micdot{position:absolute;inset:0;border-radius:50%;border:3px solid var(--s-word);opacity:0}
.wmic.rec .micdot{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.wmichint{font-size:14px;color:var(--ink2);font-weight:700}
.wscore{margin:14px 0 8px;display:flex;flex-direction:column;align-items:center}
.wscore .wsc-n{font-size:52px;font-weight:900;line-height:1}.wscore .wsc-n span{font-size:20px;margin-left:2px}
.wscore.good .wsc-n{color:var(--ok)}.wscore.mid .wsc-n{color:var(--s-exam)}
.wscore .wsc-l{font-size:14px;font-weight:800;color:var(--ink3);margin-top:4px}
.wphonrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.phon{font-size:17px;font-weight:800;padding:8px 14px;border-radius:10px}
.phon.ok{background:var(--ok-s);color:var(--ok)}
.phon.ng{background:#FDECEC;color:#D64545}
.wtip{font-size:14px;color:var(--ink);line-height:1.6;background:var(--bg);border-radius:12px;padding:14px 16px;width:100%}
.wtip b{color:var(--s-word)}
.wresbtns{display:flex;gap:10px;width:100%;margin-top:4px}.wresbtns .wbtn{margin-top:20px;flex:1}
.wsrsnote{font-size:12.5px;color:var(--ink3);margin-top:16px;background:#FFF8EC;border-radius:10px;padding:10px 14px;width:100%}
.wsrsnote.ok{background:var(--ok-s);color:var(--ok)}
.wdone{display:flex;flex-direction:column;align-items:center;padding-top:30px;width:100%}
.wdemoji{font-size:56px}.wdone h3{font-size:22px;font-weight:900;margin:12px 0 22px}
.wdstats{display:flex;gap:10px;width:100%}
.wds{flex:1;background:var(--bg);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;gap:4px}
.wds b{font-size:22px;font-weight:900;color:var(--brand)}.wds span{font-size:11.5px;color:var(--ink3);font-weight:700}
.wdnote{font-size:13px;color:var(--ink2);line-height:1.6;margin:20px 0 8px;background:var(--brand-s);border-radius:12px;padding:14px 16px}
/* === 개념 체크 모듈 === */
.cqintro{font-size:13px;color:var(--ink3);font-weight:700;margin-bottom:16px}
.cqq{font-size:19px;font-weight:800;color:var(--ink);line-height:1.5;width:100%;text-align:left}
.cqq b{color:var(--s-check)}
.cqopts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:22px}
.cqopt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:.12s}
.cqopt:hover:not(:disabled){border-color:var(--s-check)}
.cqopt.ok{border-color:var(--ok);background:var(--ok-s);color:var(--ok)}
.cqopt.ng{border-color:#D64545;background:#FDECEC;color:#D64545}
.cqopt:disabled{cursor:default}
.cqfb{width:100%;text-align:left;margin-top:20px;font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg);border-radius:14px;padding:16px 18px}
.cqfb.ok{background:var(--ok-s)}.cqfb.ng{background:#FFF8EC}
.cqfb b{display:inline}
.cqhelp{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.cqhelp button{flex:1;min-width:140px;font-size:13px;font-weight:800;border:0;border-radius:11px;padding:12px;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit}
.cqhelp button.sub{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.cqwnote{font-size:12.5px;color:var(--ink3);margin-top:16px;background:#FFF8EC;border-radius:10px;padding:11px 14px;width:100%;text-align:left}
.cqlogged{font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-s);border-radius:10px;padding:10px 14px;width:100%;text-align:left;margin-top:12px}
.cqlogged b{color:var(--ok)}
/* === 리포트 모듈 === */
.wordsheet.rpt{max-width:460px;height:94vh}
.rpttab{font-size:13px;font-weight:900;color:var(--brand);flex:1;text-align:center}
.rptbody{padding:0 0 30px;align-items:stretch;text-align:left}
.rpt-hd{background:linear-gradient(135deg,#3A3D8F,#5457B5);color:#fff;padding:22px 24px 20px}
.rpt-hd.season{background:linear-gradient(135deg,#B5731A,#D4902E)}
.rpt-kick{font-size:11px;font-weight:800;opacity:.85;margin-bottom:6px}
.rpt-hd h2{font-size:20px;font-weight:900;line-height:1.3}
.rpt-sub{font-size:12px;opacity:.9;margin-top:8px;line-height:1.5}
.rpt-sub b{font-weight:900}
.rpt-sec{padding:18px 24px;border-bottom:1px solid var(--line2)}
.rpt-sec.next{background:var(--brand-s)}
.rpt-st{font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:12px}
.rpt-facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.rf{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
.rf-v{font-size:17px;font-weight:900;color:var(--brand)}
.rf-l{font-size:10.5px;color:var(--ink3);font-weight:700;margin-top:3px}
.rpt-mastery{display:flex;flex-direction:column;gap:12px}
.rm-row{display:flex;align-items:center;gap:10px}
.rm-u{flex:0 0 92px}.rm-u b{font-size:12.5px;font-weight:800;display:block}.rm-u span{font-size:10px;color:var(--ink3)}
.rm-bar{flex:1;height:9px;background:var(--line2);border-radius:999px;overflow:hidden}
.rm-fill{height:100%;background:var(--brand);border-radius:999px}
.rm-n{flex:0 0 58px;text-align:right;font-size:13px;font-weight:900;color:var(--ink)}
.rm-n .up{font-size:10.5px;color:var(--ok);margin-left:2px}
.rm-n .dn{font-size:10.5px;color:#D64545;margin-left:2px}
.rpt-note{font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.5}
.rpt-p{font-size:13.5px;color:var(--ink2);line-height:1.7}.rpt-p b{color:var(--ink);font-weight:800}
.rpt-foot{font-size:11px;color:var(--ink3);line-height:1.6;padding:16px 24px;background:var(--bg)}
/* ===== 리포트 심화 섹션 ===== */
/* 요일별 순공부시간 막대 */
.rpt-wk{display:flex;gap:6px;align-items:flex-end;height:110px}
.rwk{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.rwk-bt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.rwk-b{width:72%;max-width:26px;background:linear-gradient(180deg,var(--brand),#9FD13A);border-radius:6px 6px 3px 3px;min-height:4px}
.rwk-b.z{background:var(--line2)}
.rwk-v{font-size:10px;font-weight:800;color:var(--ink3)}
.rwk-d{font-size:11px;font-weight:800;color:var(--ink2)}
/* 과목별 학습시간 */
.rpt-subj{display:flex;flex-direction:column;gap:9px}
.rsj{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:var(--ink)}
.rsj-n{flex:none;width:44px}
.rsj-bar{flex:1;height:9px;background:var(--line2);border-radius:999px;overflow:hidden}
.rsj-bar i{display:block;height:100%;border-radius:999px}
.rsj b{flex:none;width:34px;text-align:right;color:var(--ink2)}
/* 미니 카드 2열 */
.rpt-grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.rmc{background:var(--bg);border-radius:13px;padding:13px}
.rmc-t{font-size:12px;font-weight:800;color:var(--ink2)}
.rmc-v{font-size:17px;font-weight:900;color:var(--ink);margin:3px 0}
.rmc-d{font-size:11px;color:var(--ink3);line-height:1.5}
/* 과목별 오답 */
.rpt-wrong{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:13px;padding:13px}
.rw-row{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;color:var(--ink)}
.rw-s{flex:none;width:40px}
.rw-bar{flex:1;height:8px;background:var(--line2);border-radius:999px;overflow:hidden}
.rw-bar i{display:block;height:100%;background:var(--s-prob,#E89A3C);border-radius:999px}
.rw-row b{flex:none;width:44px;text-align:right;color:var(--ink2)}
/* 종이교재 자기보고 */
.rpt-self{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.rpt-self span{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink3);background:var(--card);padding:3px 9px;border-radius:999px}
/* 부분별 이행률 */
.rpt-prog{display:flex;flex-direction:column;gap:9px}
.rp-row{display:flex;align-items:center;gap:9px}
.rp-ic{flex:none;font-size:14px;width:18px;text-align:center}
.rp-k{flex:none;width:82px;font-size:12.5px;font-weight:800;color:var(--ink)}
.rp-bar{flex:1;height:9px;background:var(--line2);border-radius:999px;overflow:hidden}
.rp-bar i{display:block;height:100%;border-radius:999px}
.rp-bar i.ok{background:#2FA84F}.rp-bar i.warn{background:#E0A94B}.rp-bar i.low{background:#E23B3B}
.rp-v{flex:none;width:42px;text-align:right;font-size:12px;font-weight:900}
.rp-v.ok{color:#2FA84F}.rp-v.warn{color:#C78A22}.rp-v.low{color:#E23B3B}
/* 시험 계획 이행 */
.rpt-ep{background:var(--bg);border-radius:13px;padding:14px}
.rep-h{font-size:13px;font-weight:900;color:var(--ink);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.rep-h span{margin-left:auto;font-size:11px;font-weight:800;color:var(--brand);background:var(--card);padding:3px 10px;border-radius:999px}
.rep-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.rep-row:first-of-type{border-top:0}
.rep-chk{flex:none;width:18px;height:18px;border-radius:6px;background:var(--line2);color:var(--ink3);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rep-row.done .rep-chk{background:#2FA84F;color:#fff}
.rep-sub{flex:none;width:44px;font-weight:800;color:var(--ink2)}
.rep-what{flex:1;color:var(--ink);font-weight:700}
.rep-row.done .rep-what{color:var(--ink3);text-decoration:line-through}
.rep-day{flex:none;font-size:11px;font-weight:700;color:var(--ink3)}
/* 수행평가 준비 */
.rpt-perf{background:var(--bg);border-radius:13px;padding:14px;margin-bottom:9px}
.rpf-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.rpf-top b{font-size:13.5px;font-weight:900;color:var(--ink)}
.rpf-top span{font-size:11px;font-weight:800;color:var(--ink3)}
.rpf-bar{height:7px;background:var(--line2);border-radius:999px;overflow:hidden;margin-bottom:10px}
.rpf-bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.rpf-steps{display:flex;flex-wrap:wrap;gap:6px}
.rpf-step{font-size:11px;font-weight:700;color:var(--ink3);background:var(--card);padding:5px 9px;border-radius:999px}
.rpf-step.done{color:#2FA84F;background:var(--ok-s,#E6F6EA)}
/* 상세 학습 로그 타임라인 */
.rpt-log{display:flex;flex-direction:column}
.rl-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.rl-row:first-child{border-top:0}
.rl-row.off{opacity:.55}
.rl-day{flex:none;width:34px;font-size:12px;font-weight:900;color:var(--ink);text-align:center}
.rl-day span{display:block;font-size:9.5px;font-weight:700;color:var(--ink3)}
.rl-ic{flex:none;font-size:15px;width:20px;text-align:center}
.rl-mid{flex:1;min-width:0}
.rl-mid b{font-size:12.5px;font-weight:700;color:var(--ink)}
.rl-r{flex:none;font-size:11px;font-weight:800;color:var(--ink2);background:var(--bg);padding:3px 9px;border-radius:999px}
.rl-row.off .rl-r{background:#FBE9E9;color:#C25}
/* ===== NEIS 성적표 테이블 ===== */
.neis{border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.neis-hd{background:var(--ink);color:#fff;padding:12px 14px}
.neis-hd b{font-size:14px;font-weight:900;display:block}
.neis-hd span{font-size:11px;opacity:.85;display:block;margin-top:2px}
.neis-wrap{overflow-x:auto}
.neis-t{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
.neis-t td{border:1px solid var(--line2);padding:9px 8px;text-align:center;color:var(--ink);white-space:nowrap}
.neis-t tr.nh td{background:var(--bg);font-weight:900;font-size:11px;color:var(--ink2)}
.neis-t tr.wk{background:#FFF3F3}
.neis-t td:nth-child(2){text-align:left}
.nsd{font-size:10px;color:var(--ink3);margin-left:1px}
.nts{font-weight:900;color:var(--brand)}
.nach{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:6px;font-weight:900;font-size:11px;color:#fff}
.nach.a-A{background:#2FA84F}.nach.a-B{background:#4A90D9}.nach.a-C{background:#E0A93A}.nach.a-D{background:#E8803C}.nach.a-E{background:#D04545}
.neis-t .up{color:#2FA84F;font-weight:900;font-size:10px}
.neis-t .dn{color:#E23B3B;font-weight:900;font-size:10px}
.neis-ft{font-size:10px;color:var(--ink3);line-height:1.6;padding:10px 14px;background:var(--bg)}
.rpt-hd.low{background:linear-gradient(135deg,#9A3B3B,#C25454)}
.rpt-demotog{padding:12px 16px;background:var(--ink);color:#fff}
.rpt-demotog .rdt-lbl{font-size:10.5px;opacity:.8;display:block;margin-bottom:7px}
.rpt-demotog .rdt-btns{display:flex;gap:6px}
.rpt-demotog .rdt-btns button{flex:1;font-size:11.5px;font-weight:800;border:0;border-radius:8px;padding:8px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-family:inherit}
.rpt-demotog .rdt-btns button.on{background:var(--lime);color:var(--ink)}
.rpt-tier{display:flex;align-items:center;justify-content:space-between;margin:14px 20px 0;padding:12px 16px;border-radius:14px}
.rpt-tier.good{background:var(--ok-s)}.rpt-tier.mid{background:#FFF8EC}.rpt-tier.low{background:#FDECEC}
.rt-score{font-size:16px;font-weight:900;color:var(--ink)}
.rt-sub{font-size:10.5px;color:var(--ink3);margin-top:2px}
.rt-grade{font-size:12px;font-weight:900;text-align:right}
.rpt-tier.good .rt-grade{color:var(--ok)}.rpt-tier.mid .rt-grade{color:#B5731A}.rpt-tier.low .rt-grade{color:#C25454}
.rpt-less{font-size:12.5px;color:var(--ink2);line-height:1.6;background:#FFF8EC;border-radius:10px;padding:11px 14px;margin-top:10px}
.rpt-less b{color:#B5731A}
.rpt-held{font-size:12.5px;color:var(--ink2);line-height:1.6;background:#FDECEC;border-radius:10px;padding:12px 14px}
.rpt-held b{color:#C25454}
.rpt-willsend{margin-top:11px;background:var(--ok-s);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.6;font-style:italic}
.rpt-willsend .rw-h{font-size:10.5px;font-weight:900;color:var(--ok);margin-bottom:5px;font-style:normal}
/* === 문제풀이 모듈 === */
.wordsheet.sp{max-width:460px;height:94vh}
.sp-title{font-size:13px;font-weight:900;color:var(--ink);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbody{padding:16px 20px 28px;align-items:stretch;text-align:left}
.sp-hist{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sp-hist .sh-h{font-size:11px;font-weight:900;color:var(--ink3);margin-bottom:8px}
.sp-hist .sh-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:5px 0;border-top:1px solid var(--line2)}
.sp-hist .sh-row:first-of-type{border-top:0}
.sp-hist .sh-no{font-weight:800;color:var(--ink2);flex:0 0 76px}
.sp-hist .sh-ans{flex:1;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-hist .sh-r{font-weight:800;font-size:10.5px}
.sp-hist .sh-row.ok .sh-r{color:var(--ok)}.sp-hist .sh-row.ng .sh-r{color:#D64545}
.sp-qbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.sp-badge{display:inline-block;font-size:10.5px;font-weight:900;background:var(--s-probt);color:#9A4A8C;padding:4px 11px;border-radius:999px;margin-bottom:10px}
.sp-badge.sa{background:#EAF3FF;color:#3E63A8}
.sp-q{font-size:16px;font-weight:700;color:var(--ink);line-height:1.6}
.sp-opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.sp-opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:15px 16px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:.12s}
.sp-opt:hover{border-color:var(--s-prob)}
.sp-ta{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;font-family:inherit;line-height:1.6;margin-top:16px;resize:vertical;outline:none}
.sp-reviewnote{font-size:12px;color:var(--ink2);background:#FFF8EC;border-radius:10px;padding:11px 14px;margin:14px 0 2px;line-height:1.55}
.sp-reviewnote b{color:#B5731A}
.sp-res{display:flex;align-items:center;gap:12px;padding:14px 0 4px}
.sp-res .sr-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;flex:none}
.sp-res.ok .sr-ic{background:var(--ok)}.sp-res.ng .sr-ic{background:#D64545}
.sp-res .sr-t{font-size:17px;font-weight:900;color:var(--ink)}
.sp-trap{font-size:13px;color:var(--ink);background:#FDECEC;border-radius:12px;padding:13px 15px;line-height:1.6;margin-top:12px}
.sp-trap b{color:#D64545}
.sp-flag{font-size:12px;color:#B5731A;background:#FFF3E0;border-radius:10px;padding:11px 14px;line-height:1.55;margin-top:10px}
.sp-exp{background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.65}
.sp-exp .se-h{font-size:11px;font-weight:900;color:var(--ink3);margin-bottom:6px}
.sp-why{background:var(--brand-s);border-radius:12px;padding:14px;margin-top:12px}
.sp-why .sw-h{font-size:11.5px;font-weight:900;color:var(--brand);margin-bottom:9px;line-height:1.4}
.sp-why input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;font-family:inherit;outline:none}
.sp-why button{width:100%;margin-top:9px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px;font-size:13.5px;font-weight:900;cursor:pointer;font-family:inherit}
.sp-review1{font-size:12.5px;color:var(--ink2);background:#EAF3FF;border-radius:10px;padding:12px 14px;margin-top:12px;line-height:1.6}
.sp-review1 b{color:#3E63A8}
.sp-done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.sp-done h3{font-size:21px;font-weight:900;margin:10px 0 18px}
.sp-donestats{display:flex;gap:12px;width:100%}
.sp-donestats .sd{flex:1;background:var(--bg);border-radius:14px;padding:16px 8px}
.sp-donestats .sd b{font-size:22px;font-weight:900;color:var(--brand);display:block}
.sp-donestats .sd span{font-size:11px;color:var(--ink3);font-weight:700}
.sp-donenote{font-size:12.5px;color:var(--ink2);line-height:1.6;background:var(--brand-s);border-radius:12px;padding:14px;margin-top:18px;text-align:left}
.sp-donenote b{color:var(--brand)}
.sp-donenote2{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:10px;text-align:left}
.sp-donenote2 b{color:var(--ink2)}
/* === 강의 재생 모듈 === */
.wordsheet.lec,.wordsheet.ex{max-width:460px;height:auto;max-height:90vh}
.lecbody,.exbody{padding:18px 20px 26px;align-items:stretch;text-align:left}
.lec-player{background:#1A1D33;border-radius:16px;padding:28px 20px;text-align:center;position:relative}
.lec-play{width:64px;height:64px;border-radius:50%;background:var(--lime);color:#1A1D33;display:grid;place-items:center;margin:0 auto 18px;cursor:pointer;font-size:22px;font-weight:900}
.lec-play .lp-ic{line-height:1}
.lec-bar{height:5px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-bottom:9px}
.lec-bar i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .18s linear}
.lec-t{font-size:12px;color:rgba(255,255,255,.75);font-weight:700}
.lec-meta{font-size:12.5px;color:var(--ink2);line-height:1.6;background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:14px}
.lec-after{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.lec-after .wbtn{margin-top:0}
.lec-after .wbtn.locked{background:var(--line2);color:var(--ink3);cursor:not-allowed}
.lec-play.on{animation:lecpulse 1.2s infinite}
@keyframes lecpulse{0%,100%{box-shadow:0 0 0 0 rgba(182,227,74,.5)}50%{box-shadow:0 0 0 10px rgba(182,227,74,0)}}
/* === 시험공부 스텝 모듈 === */
.ex-hd h3{font-size:18px;font-weight:900;margin:10px 0 6px}
.ex-hd p{font-size:13px;color:var(--ink2);line-height:1.6}
.ex-steps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ex-step{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.ex-step.done{background:var(--ok-s);border-color:transparent}
.ex-step .es-n{width:26px;height:26px;border-radius:50%;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.ex-step.done .es-n{background:var(--ok);color:#fff}
.ex-step .es-b{flex:1;min-width:0}.ex-step .es-b b{font-size:14px;font-weight:800;display:block}.ex-step .es-b span{font-size:11.5px;color:var(--ink3)}
.ex-step .es-c{color:var(--ok);font-weight:900}
.ex-step .es-lock{opacity:.4}
.ex-step button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;flex:none}
.ex-foot{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:16px;background:var(--bg);border-radius:10px;padding:12px 14px}
/* === 종이 교재 &quot;다 풀었어요&quot; 모달 === */
.wordsheet.pp2{max-width:440px;height:auto;max-height:88vh}
.ppbody{padding:20px 22px 28px;align-items:stretch;text-align:left}
.pp-ic{font-size:44px;text-align:center}
.pp-h{font-size:19px;font-weight:900;text-align:center;margin:8px 0 4px}
.pp-d{font-size:13px;color:var(--ink2);line-height:1.6;text-align:center;margin-bottom:18px}
.pp-d b{color:var(--ink)}
.pp-q{font-size:12.5px;font-weight:900;color:var(--ink2);margin-bottom:8px}
.pp-ta{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:14px;font-family:inherit;line-height:1.6;resize:vertical;outline:none}
.pp-ta:focus{border-color:var(--brand)}
.pp-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pp-chips button{font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:8px 14px;cursor:pointer;font-family:inherit}
.pp-chips button:hover{border-color:var(--brand);color:var(--brand)}
.ppbody .wbtn{margin-top:18px}
/* === 특강 담기 모달 === */
.wordsheet.tk2{max-width:440px;height:auto;max-height:86vh}
.tk2body{padding:22px 24px 28px;align-items:stretch;text-align:center}
.tk2-ic{font-size:48px}.tk2-ic.warn{font-size:44px}
.tk2-h{font-size:20px;font-weight:900;margin:10px 0 8px}
.tk2-d{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:18px}
.tk2-d b{color:var(--ink);font-weight:800}
.tk2-cmp{background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:18px;text-align:left}
.tk2-row{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink2);padding:6px 0}
.tk2-row.new{border-top:1px solid var(--line2);color:var(--ink);font-weight:700}
.tk2-lbl{flex:0 0 42px;font-size:11px;font-weight:900;color:var(--ink3)}
.tk2-row.new .tk2-lbl{color:var(--s-teuk,#C28A1E)}
