/* ===== 공통 리스트 카드 문법 (레퍼런스: [아이콘]·[제목1줄+서브1줄]·[우측메타]) ===== */
.lcard{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer;transition:.12s}
.lcard:hover{box-shadow:0 6px 18px -10px rgba(25,30,46,.22)}
.lcard .lic{width:44px;height:44px;border-radius:13px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:900}
.lcard .lic .d{font-size:8px;font-weight:800;opacity:.7;margin-bottom:1px}
.lcard .lic .n{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.lcard .lic svg{width:21px;height:21px}
.lcard .lmd{flex:1;min-width:0}
.lcard .lmd .lt{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.lcard .lmd .lsb{font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lcard .lrt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.lcard .lrt .pill{font-size:11px;font-weight:900;border-radius:999px;padding:3px 10px;white-space:nowrap}
.lcard .lrt .tm{font-size:11px;font-weight:800;color:var(--faint);white-space:nowrap}
/* 아이콘 색 토큰 */
.ic-exam{background:var(--s-examt);color:var(--s-exam)}
.ic-perf{background:var(--s-probt);color:#9A6310}
.ic-live{background:var(--s-livet);color:var(--s-live)}
.ic-ins{background:var(--brand-s);color:var(--brand)}
.ic-ok{background:var(--ok-s);color:var(--ok)}
.ic-dim{background:var(--line2);color:var(--ink3)}
.pill-exam{background:var(--s-examt);color:var(--s-exam)}
.pill-perf{background:var(--s-probt);color:#9A6310}
.pill-ok{background:var(--ok-s);color:var(--ok)}
.pill-dim{background:var(--line2);color:var(--ink3)}
/* 섹션 헤더 */
.lsec{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 10px}
.lsec b{font-size:15px;font-weight:900;letter-spacing:-.02em}
.lsec .more{font-size:12px;font-weight:700;color:var(--ink3);cursor:pointer}
.lsec .more:hover{color:var(--brand)}

/* 이번 달 레이더 = 공통 카드 가로 스크롤 */
.radar{display:flex;gap:10px;overflow-x:auto;padding:0 20px 14px;-ms-overflow-style:none;scrollbar-width:none}
.radar::-webkit-scrollbar{display:none}
.radar .lcard{flex:0 0 268px;width:268px;padding:12px 14px}
.radar .lcard .lrt .pill{padding:3px 9px;font-size:10.5px}
.wkline{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.wkline .wkbar{flex:1;height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.wkline .wkbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-d));transition:.3s}
.wkline span{font-size:10.5px;font-weight:800;color:var(--ink3);white-space:nowrap}
.autonote{display:flex;align-items:center;gap:7px;margin:0 20px 13px;font-size:11px;font-weight:700;color:#B5491F;background:var(--s-livet);border-radius:9px;padding:7px 12px}
.odbar{display:flex;align-items:center;gap:11px;margin:0 20px 13px;background:#FFF1F1;border:1px solid #F7C9C9;border-radius:11px;padding:11px 15px}
.odbar .odic{width:28px;height:28px;border-radius:8px;background:#E23B3B;display:grid;place-items:center;flex:none}
.odbar .odic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5;fill:none}
.odbar .odtx{flex:1;font-size:12.5px;color:#9A1B22;line-height:1.4}
.odbar .odtx b{font-weight:900}
.odbar .odbtn{background:#E23B3B;color:#fff;border:0;font-size:12px;font-weight:900;padding:8px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.odbar .odbtn:hover{background:#C92F38}
.an-dot{width:7px;height:7px;border-radius:50%;background:var(--s-live);flex:none}
.lg{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:3px}
.grid{overflow-x:auto}
.gtbl{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.gtbl th{font-size:12px;font-weight:800;color:var(--ink2);padding:0 0 9px;background:var(--card)}
.gtbl th.today{color:var(--brand)}
.gtbl th .tdd{font-size:10.5px;color:var(--faint);font-weight:700;margin-top:1px}
.gtbl th.today .tdd{color:var(--brand-d)}
.gtbl th.wkd,.gtbl td.wkd{opacity:.82}
.gtbl td{border-top:1px solid var(--line2);border-left:1px solid var(--line2);height:42px;vertical-align:top;padding:0;position:relative}
.gtbl td.timecol,.gtbl th.timecol{width:46px}
.gtbl td.timecol{border-left:0;text-align:right;padding:4px 8px 0 0;font-size:10px;color:var(--faint);font-weight:700}
.gtbl td.todaycol{background:var(--brand-s2)}
.blk{position:absolute;left:3px;right:3px;top:2px;bottom:2px;border-radius:8px;padding:6px 8px;overflow:hidden;line-height:1.25;cursor:pointer;transition:.1s}
.blk:hover{filter:brightness(.97);box-shadow:0 2px 8px -2px rgba(25,30,46,.18)}
.blk .bt{font-size:11.5px;font-weight:700;letter-spacing:-.02em}
.blk .bs{font-size:9.5px;opacity:.8;margin-top:1px;font-weight:600}
.blk.islive{box-shadow:inset 0 0 0 1.5px var(--s-live)}
.blk.auto{border-left:3px solid var(--s-live)}
.blk .atag{display:inline-block;font-size:7.5px;font-weight:900;color:var(--s-live);background:#fff;border-radius:4px;padding:0 4px;margin-top:3px;letter-spacing:.02em}
.blk .aitag{display:inline-block;font-size:7.5px;font-weight:900;color:#fff;background:#7B61F2;border-radius:4px;padding:0 4px;margin-top:3px}
.blk .ltag{position:absolute;top:4px;right:4px;font-size:8px;font-weight:900;color:#fff;background:var(--s-live);padding:1px 4px;border-radius:4px}
.blk .chk{position:absolute;bottom:5px;right:5px;width:15px;height:15px;border-radius:5px;background:var(--ok);display:none;place-items:center}
.blk.done{opacity:.55}
.blk.done .chk{display:grid}
.blk .chk svg{width:9px;height:9px;stroke:#fff;stroke-width:3.5}
.blk.overdue{box-shadow:inset 0 0 0 1.6px #E23B3B;background:#FFF4F4 !important;animation:odp 2.4s ease-in-out infinite}
@keyframes odp{0%,100%{box-shadow:inset 0 0 0 1.6px #E23B3B}50%{box-shadow:inset 0 0 0 1.6px #E23B3B,0 0 0 2px rgba(226,59,59,.18)}}
.blk.overdue .bt{color:#C0202A}
.blk .odtag{position:absolute;bottom:4px;right:4px;font-size:8px;font-weight:900;color:#fff;background:#E23B3B;padding:1px 5px;border-radius:5px;letter-spacing:-.02em}

/* ===== 우측 레일 ===== */
.rail{width:316px;flex:none;display:flex;flex-direction:column;gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px}
.now{background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff;border:0;position:relative;overflow:hidden}
.now::after{content:&quot;&quot;;position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(182,227,74,.16)}
.now .nk{font-size:11.5px;font-weight:800;color:var(--lime);display:flex;align-items:center;gap:7px;position:relative}
.now .ld{width:8px;height:8px;border-radius:50%;background:var(--s-live);position:relative}
.now .ld::after{content:&quot;&quot;;position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--s-live);opacity:.5;animation:rip 1.8s infinite}
@keyframes rip{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.now h3{font-size:18px;font-weight:800;margin-top:9px;position:relative;letter-spacing:-.01em}
.now .ns{font-size:12px;color:rgba(255,255,255,.75);margin-top:3px;position:relative}
.now .nbtn{margin-top:13px;width:100%;background:var(--lime);color:var(--lime-ink);border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;position:relative}
.now .nbtn:active{transform:translateY(1px)}

.rc .rh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.rc .rh b{font-size:15px;font-weight:800}
.rc .rh .sub{font-size:11px;color:var(--ink3);font-weight:700}
.todo{list-style:none}
.todo li{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line2)}
.todo li:first-child{border-top:0}
.todo .tic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:900}
.todo .tb{flex:1;min-width:0}
.todo .tb b{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.todo .tb .ts{font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.todo li.ext .tb b{color:var(--ink2);font-weight:700}
.todo .cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;cursor:pointer;transition:.12s}
.todo .cb svg{width:12px;height:12px;stroke:#fff;stroke-width:3.5;opacity:0}
.todo li.done .cb{background:var(--ok);border-color:var(--ok)}
.todo li.done .cb svg{opacity:1}
.todo li.done .tb b{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--ink3)}
.todo .lvb{font-size:9px;font-weight:900;color:#fff;background:var(--s-live);border-radius:999px;padding:2px 7px;flex:none}
.todo .stb{font-size:12px;font-weight:900;color:#fff;background:var(--brand);border:0;border-radius:9px;padding:7px 13px;flex:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.todo .stb.live{background:var(--s-live)}
.todo .stb:hover{filter:brightness(1.08)}
.todo li.tap{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.todo li.tap:hover{background:var(--brand-s)}
.todo li.tap:hover+li{border-top-color:transparent}

.schooltag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ok);background:var(--s-matht);border-radius:999px;padding:5px 11px;cursor:pointer}
.gtbl tr.allday td{height:auto;border-top:0;padding:2px 3px 7px;vertical-align:middle}
.gtbl tr.allday td.timecol{font-size:9px;line-height:1.3;padding-top:4px}
.schip{display:block;font-size:9.5px;font-weight:800;border-radius:7px;padding:5px 7px;line-height:1.3;cursor:pointer;color:#fff}
.schip.perf{background:var(--s-prob)}
.schip.test{background:var(--s-exam)}
.schip:hover{filter:brightness(1.06)}
.srcb{margin-left:auto;margin-right:36px;font-size:10px;font-weight:800;color:var(--ok);background:var(--s-matht);border-radius:6px;padding:3px 8px;white-space:nowrap}
.upsch{list-style:none;margin-top:12px;border-top:1px solid var(--line2);padding-top:4px}
.upsch li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12px;font-weight:700}
.upsch li .ud{font-size:10.5px;font-weight:800;color:var(--ink3);width:52px;flex:none}
.upsch li .ui{width:7px;height:7px;border-radius:3px;flex:none}
.upsch li .dd2{margin-left:auto;font-size:10px;font-weight:900;color:var(--s-exam)}
.srcline{margin-top:9px;font-size:10px;color:var(--faint);font-weight:600}

.exam .rh .dday{font-size:13px;font-weight:900;color:#fff;background:var(--s-exam);border-radius:999px;padding:3px 11px}
.goalrow{display:flex;gap:9px;margin-top:10px}
.goal{flex:1;background:var(--bg);border-radius:11px;padding:9px 11px}
.goal .gl{font-size:10.5px;color:var(--ink3);font-weight:700}
.goal .gv{font-size:14.5px;font-weight:800;margin-top:1px}
.gbar-w{margin-top:12px}
.gbars{display:flex;gap:12px;align-items:flex-end;height:86px;padding:0 4px}
.gb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.gb i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:#CBD2E0}
.gb.on i{background:var(--brand-d)}
.gb.tgt i{background:var(--lime);outline:2px dashed var(--lime-d);outline-offset:-2px}
.gb em{font-style:normal;font-size:9px;font-weight:700;color:var(--ink3);margin-top:5px;text-align:center;line-height:1.25}
.gb.tgt em{color:var(--lime-d);font-weight:800}
.exbtns{display:flex;gap:8px;margin-top:13px}
.exb{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px;font-weight:800;font-size:12px;color:var(--ink2)}
.exb.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.exb.ex{border-color:#F2C6C8;color:var(--s-exam);background:#FFF6F6}
.addtodo{width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:11px;padding:10px;font-weight:800;font-size:12px;color:var(--ink3)}
.addtodo:hover{border-color:var(--brand-d);color:var(--brand)}

.tray{background:var(--lime-s);border-color:#E2EFC2}
.tray .rh b{color:var(--lime-ink)}
.ti{margin-top:9px;background:var(--card);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.ti .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ti .tic svg{width:17px;height:17px}
.ti .tib{flex:1;min-width:0}
.ti .tib b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .tib .tis{font-size:10.5px;color:var(--ink3)}
.ti .split{display:flex;gap:5px;flex:none}
.ti .split button{font-weight:800;font-size:10.5px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;color:var(--ink2);white-space:nowrap}
.ti .split button.p{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== 모달 ===== */
.ovl{position:fixed;inset:0;background:rgba(25,30,46,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}

.wtop{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}

.wprog{flex:1;height:7px;background:var(--line2);border-radius:999px;overflow:hidden}
.wpbar{height:100%;background:var(--s-word);border-radius:999px;transition:width .3s;width:0}
.wcount{font-size:12px;font-weight:800;color:var(--ink3);flex:none}
.wbody{flex:1;overflow-y:auto;padding:14px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}

.wword{font-size:38px;font-weight:900;color:var(--ink);letter-spacing:-.5px}
.wword.sm{font-size:30px;margin-top:10px}
.wipa{font-size:15px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:8px;justify-content:center}
.wplay{border:0;background:var(--s-wordt);color:var(--s-word);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}

.wcompare{display:flex;gap:10px;margin:10px 0 2px;width:100%}

.wdemo{font-size:11.5px;color:var(--ink3);line-height:1.6;background:#FFF8EC;border-radius:10px;padding:11px 14px;width:100%;margin-top:6px}
.wdemo b{color:var(--s-exam)}
.wko{font-size:20px;font-weight:800;color:var(--brand);margin-top:18px}
.wex{margin-top:20px;background:var(--bg);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--ink);line-height:1.6;width:100%}
.wex b{color:var(--s-word);font-weight:900}
.wexko{font-size:13px;color:var(--ink3);margin-top:6px}
.wbtn{margin-top:26px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.wbtn.sub{background:var(--bg);color:var(--ink2)}
.wmicwrap{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.wmic{width:96px;height:96px;border-radius:50%;border:0;background:var(--s-word);color:#fff;font-size:36px;cursor:pointer;position:relative;display:grid;place-items:center;box-shadow:0 12px 30px -8px var(--s-word)}
.wmic .micdot{position:absolute;inset:0;border-radius:50%;border:3px solid var(--s-word);opacity:0}
.wmic.rec .micdot{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.wmichint{font-size:14px;color:var(--ink2);font-weight:700}
.wscore{margin:14px 0 8px;display:flex;flex-direction:column;align-items:center}

.wscore .wsc-l{font-size:14px;font-weight:800;color:var(--ink3);margin-top:4px}
.wphonrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.phon{font-size:17px;font-weight:800;padding:8px 14px;border-radius:10px}
.phon.ok{background:var(--ok-s);color:var(--ok)}
.phon.ng{background:#FDECEC;color:#D64545}
.wtip{font-size:14px;color:var(--ink);line-height:1.6;background:var(--bg);border-radius:12px;padding:14px 16px;width:100%}
.wtip b{color:var(--s-word)}
.wresbtns{display:flex;gap:10px;width:100%;margin-top:4px}.wresbtns .wbtn{margin-top:20px;flex:1}
.wsrsnote{font-size:12.5px;color:var(--ink3);margin-top:16px;background:#FFF8EC;border-radius:10px;padding:10px 14px;width:100%}
.wsrsnote.ok{background:var(--ok-s);color:var(--ok)}
.wdone{display:flex;flex-direction:column;align-items:center;padding-top:30px;width:100%}

.wdstats{display:flex;gap:10px;width:100%}
.wds{flex:1;background:var(--bg);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;gap:4px}
.wds b{font-size:22px;font-weight:900;color:var(--brand)}.wds span{font-size:11.5px;color:var(--ink3);font-weight:700}
.wdnote{font-size:13px;color:var(--ink2);line-height:1.6;margin:20px 0 8px;background:var(--brand-s);border-radius:12px;padding:14px 16px}
/* === 개념 체크 모듈 === */
.cqintro{font-size:13px;color:var(--ink3);font-weight:700;margin-bottom:16px}
.cqq{font-size:19px;font-weight:800;color:var(--ink);line-height:1.5;width:100%;text-align:left}
.cqq b{color:var(--s-check)}
.cqopts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:22px}
.cqopt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:.12s}
.cqopt:hover:not(:disabled){border-color:var(--s-check)}
.cqopt.ok{border-color:var(--ok);background:var(--ok-s);color:var(--ok)}
.cqopt.ng{border-color:#D64545;background:#FDECEC;color:#D64545}
.cqopt:disabled{cursor:default}
.cqfb{width:100%;text-align:left;margin-top:20px;font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg);border-radius:14px;padding:16px 18px}
.cqfb.ok{background:var(--ok-s)}.cqfb.ng{background:#FFF8EC}
.cqfb b{display:inline}
.cqhelp{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.cqhelp button{flex:1;min-width:140px;font-size:13px;font-weight:800;border:0;border-radius:11px;padding:12px;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit}
.cqhelp button.sub{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.cqwnote{font-size:12.5px;color:var(--ink3);margin-top:16px;background:#FFF8EC;border-radius:10px;padding:11px 14px;width:100%;text-align:left}
.cqlogged{font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-s);border-radius:10px;padding:10px 14px;width:100%;text-align:left;margin-top:12px}
.cqlogged b{color:var(--ok)}
/* === 리포트 모듈 === */
.wordsheet.rpt{max-width:460px;height:94vh}
.rpttab{font-size:13px;font-weight:900;color:var(--brand);flex:1;text-align:center}
.rptbody{padding:0 0 30px;align-items:stretch;text-align:left}
.rpt-hd{background:linear-gradient(135deg,#3A3D8F,#5457B5);color:#fff;padding:22px 24px 20px}
.rpt-hd.season{background:linear-gradient(135deg,#B5731A,#D4902E)}
.rpt-kick{font-size:11px;font-weight:800;opacity:.85;margin-bottom:6px}
.rpt-hd h2{font-size:20px;font-weight:900;line-height:1.3}
.rpt-sub{font-size:12px;opacity:.9;margin-top:8px;line-height:1.5}
.rpt-sub b{font-weight:900}
.rpt-sec{padding:18px 24px;border-bottom:1px solid var(--line2)}
.rpt-sec.next{background:var(--brand-s)}
.rpt-st{font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:12px}
.rpt-facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.rf{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
.rf-v{font-size:17px;font-weight:900;color:var(--brand)}
.rf-l{font-size:10.5px;color:var(--ink3);font-weight:700;margin-top:3px}
.rpt-mastery{display:flex;flex-direction:column;gap:12px}
.rm-row{display:flex;align-items:center;gap:10px}
.rm-u{flex:0 0 92px}.rm-u b{font-size:12.5px;font-weight:800;display:block}.rm-u span{font-size:10px;color:var(--ink3)}
.rm-bar{flex:1;height:9px;background:var(--line2);border-radius:999px;overflow:hidden}
.rm-fill{height:100%;background:var(--brand);border-radius:999px}
.rm-n{flex:0 0 58px;text-align:right;font-size:13px;font-weight:900;color:var(--ink)}
.rm-n .up{font-size:10.5px;color:var(--ok);margin-left:2px}
.rm-n .dn{font-size:10.5px;color:#D64545;margin-left:2px}
.rpt-note{font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.5}
.rpt-p{font-size:13.5px;color:var(--ink2);line-height:1.7}.rpt-p b{color:var(--ink);font-weight:800}
.rpt-foot{font-size:11px;color:var(--ink3);line-height:1.6;padding:16px 24px;background:var(--bg)}
.rpt-hd.low{background:linear-gradient(135deg,#9A3B3B,#C25454)}
.rpt-demotog{padding:12px 16px;background:var(--ink);color:#fff}
.rpt-demotog .rdt-lbl{font-size:10.5px;opacity:.8;display:block;margin-bottom:7px}
.rpt-demotog .rdt-btns{display:flex;gap:6px}
.rpt-demotog .rdt-btns button{flex:1;font-size:11.5px;font-weight:800;border:0;border-radius:8px;padding:8px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-family:inherit}
.rpt-demotog .rdt-btns button.on{background:var(--lime);color:var(--ink)}
.rpt-tier{display:flex;align-items:center;justify-content:space-between;margin:14px 20px 0;padding:12px 16px;border-radius:14px}
.rpt-tier.good{background:var(--ok-s)}.rpt-tier.mid{background:#FFF8EC}.rpt-tier.low{background:#FDECEC}
.rt-score{font-size:16px;font-weight:900;color:var(--ink)}
.rt-sub{font-size:10.5px;color:var(--ink3);margin-top:2px}
.rt-grade{font-size:12px;font-weight:900;text-align:right}
.rpt-tier.good .rt-grade{color:var(--ok)}.rpt-tier.mid .rt-grade{color:#B5731A}.rpt-tier.low .rt-grade{color:#C25454}
.rpt-less{font-size:12.5px;color:var(--ink2);line-height:1.6;background:#FFF8EC;border-radius:10px;padding:11px 14px;margin-top:10px}
.rpt-less b{color:#B5731A}
.rpt-held{font-size:12.5px;color:var(--ink2);line-height:1.6;background:#FDECEC;border-radius:10px;padding:12px 14px}
.rpt-held b{color:#C25454}
.rpt-willsend{margin-top:11px;background:var(--ok-s);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.6;font-style:italic}
.rpt-willsend .rw-h{font-size:10.5px;font-weight:900;color:var(--ok);margin-bottom:5px;font-style:normal}
/* === 문제풀이 모듈 === */
.wordsheet.sp{max-width:460px;height:94vh}
.sp-title{font-size:13px;font-weight:900;color:var(--ink);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbody{padding:16px 20px 28px;align-items:stretch;text-align:left}
.sp-hist{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sp-hist .sh-h{font-size:11px;font-weight:900;color:var(--ink3);margin-bottom:8px}
.sp-hist .sh-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:5px 0;border-top:1px solid var(--line2)}
.sp-hist .sh-row:first-of-type{border-top:0}
.sp-hist .sh-no{font-weight:800;color:var(--ink2);flex:0 0 76px}
.sp-hist .sh-ans{flex:1;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-hist .sh-r{font-weight:800;font-size:10.5px}
.sp-hist .sh-row.ok .sh-r{color:var(--ok)}.sp-hist .sh-row.ng .sh-r{color:#D64545}
.sp-qbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.sp-badge{display:inline-block;font-size:10.5px;font-weight:900;background:var(--s-probt);color:#9A4A8C;padding:4px 11px;border-radius:999px;margin-bottom:10px}
.sp-badge.sa{background:#EAF3FF;color:#3E63A8}
.sp-q{font-size:16px;font-weight:700;color:var(--ink);line-height:1.6}
.sp-opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.sp-opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:15px 16px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:.12s}
.sp-opt:hover{border-color:var(--s-prob)}
.sp-ta{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;font-family:inherit;line-height:1.6;margin-top:16px;resize:vertical;outline:none}
.sp-reviewnote{font-size:12px;color:var(--ink2);background:#FFF8EC;border-radius:10px;padding:11px 14px;margin:14px 0 2px;line-height:1.55}
.sp-reviewnote b{color:#B5731A}
.sp-res{display:flex;align-items:center;gap:12px;padding:14px 0 4px}
.sp-res .sr-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;flex:none}
.sp-res.ok .sr-ic{background:var(--ok)}.sp-res.ng .sr-ic{background:#D64545}
.sp-res .sr-t{font-size:17px;font-weight:900;color:var(--ink)}
.sp-trap{font-size:13px;color:var(--ink);background:#FDECEC;border-radius:12px;padding:13px 15px;line-height:1.6;margin-top:12px}
.sp-trap b{color:#D64545}
.sp-flag{font-size:12px;color:#B5731A;background:#FFF3E0;border-radius:10px;padding:11px 14px;line-height:1.55;margin-top:10px}
.sp-exp{background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.65}
.sp-exp .se-h{font-size:11px;font-weight:900;color:var(--ink3);margin-bottom:6px}
.sp-why{background:var(--brand-s);border-radius:12px;padding:14px;margin-top:12px}
.sp-why .sw-h{font-size:11.5px;font-weight:900;color:var(--brand);margin-bottom:9px;line-height:1.4}
.sp-why input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;font-family:inherit;outline:none}
.sp-why button{width:100%;margin-top:9px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px;font-size:13.5px;font-weight:900;cursor:pointer;font-family:inherit}
.sp-review1{font-size:12.5px;color:var(--ink2);background:#EAF3FF;border-radius:10px;padding:12px 14px;margin-top:12px;line-height:1.6}
.sp-review1 b{color:#3E63A8}
.sp-done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.sp-done h3{font-size:21px;font-weight:900;margin:10px 0 18px}
.sp-donestats{display:flex;gap:12px;width:100%}
.sp-donestats .sd{flex:1;background:var(--bg);border-radius:14px;padding:16px 8px}
.sp-donestats .sd b{font-size:22px;font-weight:900;color:var(--brand);display:block}
.sp-donestats .sd span{font-size:11px;color:var(--ink3);font-weight:700}
.sp-donenote{font-size:12.5px;color:var(--ink2);line-height:1.6;background:var(--brand-s);border-radius:12px;padding:14px;margin-top:18px;text-align:left}
.sp-donenote b{color:var(--brand)}
.sp-donenote2{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:10px;text-align:left}
.sp-donenote2 b{color:var(--ink2)}
/* === 강의 재생 모듈 === */
.wordsheet.lec,.wordsheet.ex{max-width:460px;height:auto;max-height:90vh}
.lecbody,.exbody{padding:18px 20px 26px;align-items:stretch;text-align:left}
.lec-player{background:#1A1D33;border-radius:16px;padding:28px 20px;text-align:center;position:relative}
.lec-play{width:64px;height:64px;border-radius:50%;background:var(--lime);color:#1A1D33;display:grid;place-items:center;margin:0 auto 18px;cursor:pointer;font-size:22px;font-weight:900}
.lec-play .lp-ic{line-height:1}
.lec-bar{height:5px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin-bottom:9px}
.lec-bar i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .18s linear}
.lec-t{font-size:12px;color:rgba(255,255,255,.75);font-weight:700}
.lec-meta{font-size:12.5px;color:var(--ink2);line-height:1.6;background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:14px}
.lec-after{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.lec-after .wbtn{margin-top:0}
.lec-after .wbtn.locked{background:var(--line2);color:var(--ink3);cursor:not-allowed}
.lec-play.on{animation:lecpulse 1.2s infinite}
@keyframes lecpulse{0%,100%{box-shadow:0 0 0 0 rgba(182,227,74,.5)}50%{box-shadow:0 0 0 10px rgba(182,227,74,0)}}
/* === 시험공부 스텝 모듈 === */
.ex-hd h3{font-size:18px;font-weight:900;margin:10px 0 6px}
.ex-hd p{font-size:13px;color:var(--ink2);line-height:1.6}
.ex-steps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ex-step{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.ex-step.done{background:var(--ok-s);border-color:transparent}
.ex-step .es-n{width:26px;height:26px;border-radius:50%;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.ex-step.done .es-n{background:var(--ok);color:#fff}
.ex-step .es-b{flex:1;min-width:0}.ex-step .es-b b{font-size:14px;font-weight:800;display:block}.ex-step .es-b span{font-size:11.5px;color:var(--ink3)}
.ex-step .es-c{color:var(--ok);font-weight:900}
.ex-step .es-lock{opacity:.4}
.ex-step button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;flex:none}
.ex-foot{font-size:11.5px;color:var(--ink3);line-height:1.6;margin-top:16px;background:var(--bg);border-radius:10px;padding:12px 14px}
.dlg{background:var(--card);width:100%;max-width:440px;border-radius:22px;padding:24px;animation:pop .18s ease;position:relative;max-height:92vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dlg .x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;border:0;background:var(--line2);color:var(--ink3);font-size:15px;font-weight:800}
.dlg .shd{display:flex;align-items:center;gap:9px}
.dlg .sdot{width:11px;height:11px;border-radius:4px;flex:none}
.dlg .scat{font-size:12.5px;font-weight:800}
.dlg .slive{font-size:10px;font-weight:900;color:#fff;background:var(--s-live);padding:3px 8px;border-radius:6px}
.dlg h3{font-size:22px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.dlg .smeta{font-size:13px;color:var(--ink3);margin-top:4px}
.dlg .sinfo{margin-top:16px;background:var(--bg);border-radius:14px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.dlg .si .sl{font-size:11px;color:var(--ink3);font-weight:700}
.dlg .si .sv{font-size:14px;font-weight:800;margin-top:2px}
.dlg .sact{margin-top:17px;display:flex;gap:9px}
.dlg .sact button{flex:1;font-weight:800;font-size:14px;border:0;border-radius:13px;padding:14px}
.dlg .sact .pri{background:var(--brand);color:#fff}
.dlg .sact .sub{background:var(--brand-s);color:var(--brand);flex:none;padding:14px 18px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:200;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px -6px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.24s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 반응형 (패드·노트북·모바일) ===== */
@media (max-width:1240px){
  .nav{width:72px;padding:22px 10px 16px}
  .logo{justify-content:center;padding:0}.logo span.wd{display:none}
  .nav .room,.devrow{display:none}
  .mi{justify-content:center;padding:12px 0}.mi .lb,.mi .lvb{display:none}
  .prof{justify-content:center;padding:8px}.prof .pb{display:none}
}
@media (max-width:1060px){
  .content{flex-direction:column}
  .rail{width:100%;flex-direction:row;flex-wrap:wrap;align-items:stretch}
  .rail .rc{flex:1 1 280px}
}
@media (max-width:720px){
  .shell{flex-direction:column}
  .nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:12px 16px}
  .menu{flex-direction:row;margin:0 0 0 14px;overflow-x:auto}
  .mi{padding:9px 10px}
  .nav .sp,.prof{display:none}
  .mh{flex-wrap:wrap;gap:10px;padding:16px 16px 0}
  .content{padding:14px 16px 22px}
  .aiwin{right:10px;left:10px;width:auto;bottom:10px;height:70vh}
  .fab{right:14px;bottom:14px}
  .bellpanel{left:10px;right:10px;width:auto;top:120px}
  .flywrap{right:12px;left:12px;bottom:84px;align-items:stretch}
  .fly{max-width:none}
  .mh .hi b{font-size:18px}
  .wknav{order:5}
  .pl-hd{flex-wrap:wrap;gap:8px}
  .exbtns{flex-wrap:wrap}
  .now h3{font-size:16px}
}

/* ===== 알림 센터 ===== */
.bell .nd{transition:.15s}
.bellpanel{position:fixed;top:66px;right:26px;width:340px;max-height:72vh;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 24px 60px -18px rgba(25,30,46,.4);z-index:90;overflow:hidden;display:none;flex-direction:column}
.bellpanel.show{display:flex;animation:bpin .18s ease}
@keyframes bpin{from{transform:translateY(-8px);opacity:0}}
.bp-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2)}
.bp-hd b{font-size:15px;font-weight:800}
.bp-tog{font-size:11px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:5px;cursor:pointer}
.bp-list{overflow-y:auto;padding:8px}
.bp-empty{text-align:center;color:var(--faint);font-size:12px;font-weight:600;padding:34px 20px;line-height:1.6}
.ni{border-radius:12px;padding:11px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.ni.stu{background:var(--push-s)}.ni.par{background:var(--kakao-s)}.ni.ops{background:#F0EBFC}
.ni .nic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:#fff}
.ni.stu .nic{background:var(--push)}.ni.par .nic{background:#E5B800}.ni.ops .nic{background:#8B5CF6}
.ni .nb{flex:1;min-width:0}
.ni .nb .ntt{font-size:12.5px;font-weight:800}
.ni .nb .nmm{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.ni .nb .nwhy{font-size:10.5px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.08);line-height:1.4;display:none}
.ni .nb .nwhy .gb{font-weight:900;border-radius:4px;padding:1px 5px;margin-right:4px}
.gb.a{background:#E5F4EC;color:#14683f}.gb.c{background:#FFF4E0;color:#8A6310}.gb.h{background:#EEF0F6;color:#5A6377}
.bp-list.showwhy .nwhy{display:block}
.ni .nx{font-size:9px;font-weight:800;color:var(--ink3);background:rgba(0,0,0,.05);border-radius:5px;padding:2px 6px;flex:none;white-space:nowrap}

.flywrap{position:fixed;bottom:26px;right:96px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fly{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 14px 34px -12px rgba(25,30,46,.4);
  display:flex;gap:10px;align-items:center;max-width:320px;transform:translateX(30px);opacity:0;animation:flyin .3s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes flyin{to{transform:none;opacity:1}}
.fly .fc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:#fff}
.fly.stu .fc{background:var(--push)}.fly.par .fc{background:#E5B800}.fly.ops .fc{background:#8B5CF6}.fly.block .fc{background:#8792A5}
.fly .ft{font-size:11px;font-weight:800;color:var(--ink3)}
.fly .fm{font-size:12.5px;font-weight:700;margin-top:1px;line-height:1.3}

/* ===== 입력 모달 (폼) ===== */
.dlg.wide{max-width:560px}
.dlg h3.fh{font-size:20px;margin-top:4px}
.dlg .fdesc{font-size:12.5px;color:var(--ink3);margin-top:4px;margin-bottom:16px;line-height:1.5}
.frow{margin-bottom:13px}
.frow .fl2{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:block}
.fin{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--bg);color:var(--ink)}
.fin:focus{outline:0;border-color:var(--brand-d);background:#fff}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip2{font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink2)}

.dv-ch{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin:1px 2px 1px 0;white-space:nowrap}
.dv-ch.stu{background:#EEF0FF;color:#3A3D8F}
.dv-ch.par{background:#E9F6EF;color:#1F9D64}
.dv-ch.mgr{background:#FFF1E6;color:#C97A1E}
.dv-sd{display:inline-block;font-size:10px;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap}

.dv-sd.coach{background:#FFECEC;color:#E23B3B}

/* 상품 구조 */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:18px}
.pr-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
.pr-card.base{background:linear-gradient(145deg,var(--brand),var(--brand-d));color:#fff;border:0}
.pr-card .prt{font-size:12px;font-weight:900;opacity:.8}
.pr-card .prp{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:5px 0 10px}
.pr-card .prp em{font-style:normal;font-size:12px;font-weight:700;opacity:.7}
.pr-card ul{list-style:none;font-size:11.5px;line-height:1.9;font-weight:600}
.pr-card.base ul{color:rgba(255,255,255,.9)}
.pr-card:not(.base) ul{color:var(--ink2)}
.pr-card .prb{position:absolute;top:16px;right:16px;font-size:9.5px;font-weight:900;background:var(--lime);color:var(--lime-ink);padding:3px 9px;border-radius:999px}
.pr-note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:12.5px;color:var(--ink2);line-height:1.8}
.pr-note b{color:var(--brand)}

/* ===== AI 어시스턴트 (학생 챗봇) ===== */
.fab{position:fixed;right:26px;bottom:26px;z-index:94;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fabbtn{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#3A3D8F,#6B4FD0);box-shadow:0 10px 30px -6px rgba(58,61,143,.55);border:0;cursor:pointer;display:grid;place-items:center;position:relative;transition:.18s}
.fabbtn:hover{transform:scale(1.05)}
.fabbtn svg{width:27px;height:27px;stroke:#fff;fill:none;stroke-width:2}
.fabbtn .fbdg{position:absolute;top:-2px;right:-2px;background:var(--lime);color:#20233F;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;border:2px solid var(--bg)}
.fabtip{position:absolute;right:70px;bottom:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:12px 12px 2px 12px;white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.3);opacity:0;transform:translateX(8px);pointer-events:none;transition:.2s}
.fab:hover .fabtip{opacity:1;transform:translateX(0)}
.aiwin{position:fixed;right:26px;bottom:26px;z-index:95;width:375px;max-width:calc(100vw - 40px);height:560px;max-height:calc(100vh - 52px);background:var(--card);border-radius:20px;box-shadow:0 24px 60px -12px rgba(25,30,46,.45);display:none;flex-direction:column;overflow:hidden;animation:winup .22s ease}
.aiwin.show{display:flex}
@keyframes winup{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.aiwhd{background:linear-gradient(120deg,#2A2D6B,#3A3D8F);color:#fff;padding:15px 18px;display:flex;align-items:center;gap:11px}
.aiwhd .aiic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.aiwhd .aiic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.aiwhd b{font-size:14.5px;font-weight:900}.aiwhd .d{font-size:11px;opacity:.85}
.aiwhd .wx{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:900}
.chatw{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-weight:600}
.msg.a{align-self:flex-start}
.msg.a .ab{background:var(--bg);border-radius:14px 14px 14px 4px;padding:11px 13px;color:var(--ink2)}
.msg.a .ab b{color:var(--ink);font-weight:800}
.rec{border:1.5px solid var(--brand);border-radius:14px;overflow:hidden;margin-top:9px;background:#fff}
.rec .rh2{background:var(--brand-s);padding:9px 12px;font-size:12px;font-weight:900;color:var(--brand)}
.rec .ri{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2)}
.rec .ri .rtag{font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:5px;white-space:nowrap;flex:none}
.rec .ri .rn{flex:1;min-width:0}.rec .ri .rn b{font-size:12px;font-weight:800;display:block}.rec .ri .rn .rm{font-size:10px;color:var(--ink3)}
.rec .rwhy{font-size:11px;color:var(--ink3);padding:9px 12px;background:#FAFBFF;border-top:1px solid var(--line2);line-height:1.45}
.rec .rwhy b{color:var(--s-exam)}
.rec .slotq{padding:10px 12px;border-top:1px solid var(--line2);background:var(--lime-s)}
.rec .slotq .sqt{font-size:11px;font-weight:900;color:var(--lime-ink);margin-bottom:7px}
.rec .slotq .chips{gap:6px}
.rec .slotq .chip2{font-size:11px;padding:7px 12px}
.chipsrow{display:flex;gap:7px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid var(--line)}
.qchip{font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--ink2);cursor:pointer;border:1px solid var(--line)}
.qchip:hover{background:var(--brand-s);color:var(--brand);border-color:var(--brand-d)}
.inbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.inbar input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13px;font-family:inherit;outline:none;min-width:0}
.inbar input:focus{border-color:var(--brand-d)}
.inbar button{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:0 16px;font-weight:900;cursor:pointer}

.aimtabs .on{background:var(--brand);border-color:var(--brand);color:#fff}
.aimtabs #am-hu.on{background:#C97A1E;border-color:#C97A1E}

/* ===== 할 일 → 실제 화면 라우팅 (모든 종류가 실제로 열림) ===== */
function todoSubj(title){ /* 제목에서 과목 추출 */
 if(/수학|쎈|함수|방정식|도형/.test(title))return &#x27;수학&#x27;;
 if(/영어|영독해|영문법|Reading|단어|영단어/.test(title))return &#x27;영어&#x27;;
 if(/국어|문해력|문법|독해/.test(title))return &#x27;국어&#x27;;
 if(/과학|물리|화학/.test(title))return &#x27;과학&#x27;;
 if(/사회|경제|역사/.test(title))return &#x27;사회&#x27;;
 return &#x27;수학&#x27;;
}
function todoOpen(b,i){
 var t=b[3], sub=todoSubj(t);
 switch(b[5]){
   case &#x27;word&#x27;:  return &#x27;openWord()&#x27;;
   case &#x27;check&#x27;: return &quot;openCheck(&#x27;&quot;+sub+&quot;&#x27;)&quot;;
   case &#x27;prob&#x27;:  return &quot;openSolve(&#x27;&quot;+sub+&quot;&#x27;,&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;)&quot;;
   case &#x27;live&#x27;:  return (b[6]&amp;&amp;b[6].live)? &#x27;openDlg(&#x27;+i+&#x27;)&#x27; : &quot;openLec(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;,&#x27;live&#x27;)&quot;;
   case &#x27;lec&#x27;:   return &quot;openLec(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;,&#x27;lec&#x27;)&quot;;
   case &#x27;exam&#x27;:  return &quot;openExam(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;)&quot;;
   default:      return &#x27;openDlg(&#x27;+i+&#x27;)&#x27;;
 }
}

function renderLec(){
 var b=document.getElementById(&#x27;lecBody&#x27;);var s=lecState;

 b.innerHTML=&#x27;&lt;div class=&quot;lec-player&quot;&gt;&lt;div class=&quot;lec-play&#x27;+(s.playing?&#x27; on&#x27;:&#x27;&#x27;)+&#x27;&quot; onclick=&quot;toggleLec()&quot;&gt;&lt;span class=&quot;lp-ic&quot;&gt;&#x27;+(s.done?&#x27;↺&#x27;:(s.playing?&#x27;❚❚&#x27;:&#x27;▶&#x27;))+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;+

   &#x27;&lt;div class=&quot;lec-meta&quot;&gt;&lt;span class=&quot;sp-badge&quot;&gt;&#x27;+(lecKind===&#x27;live&#x27;?&#x27;개념특강&#x27;:&#x27;다시보기&#x27;)+&#x27;&lt;/span&gt; &#x27;+
     (s.done?&#x27;끝까지 들었어요! 진도에 기록됐고, 이제 개념체크로 이해했는지 확인해요.&#x27;:(s.playing?&#x27;재생 중… 끝까지 들으면 개념체크가 열려요.&#x27;:&#x27;▶ 버튼을 눌러 강의를 들어보세요. 교안·필기 노트가 함께 열려요.&#x27;))+&#x27;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;lec-after&quot;&gt;&#x27;+
     (s.done
       ? &#x27;&lt;button class=&quot;wbtn&quot; onclick=&quot;closeLec();openCheck(lecSubj)&quot;&gt;✅ 강의 다 들음 — 개념체크 하기 →&lt;/button&gt;&#x27;
       : &#x27;&lt;button class=&quot;wbtn locked&quot; disabled&gt;🔒 개념체크 — 강의를 다 들어야 열려요 (&#x27;+pct+&#x27;%)&lt;/button&gt;&#x27;)+
     &#x27;&lt;button class=&quot;wbtn sub&quot; onclick=&quot;closeLec()&quot;&gt;닫기&lt;/button&gt;&lt;/div&gt;&#x27;;
}
function toggleLec(){var s=lecState;if(s.done){s.prog=0;s.done=false;s.playing=false;renderLec();return;}
 s.playing=!s.playing;
 if(s.playing){ s.iv=setInterval(function(){
     if(!document.getElementById(&#x27;lecOvl&#x27;).classList.contains(&#x27;show&#x27;)){clearInterval(s.iv);return;}
     s.prog+=5; /* 데모 속도 — 재생 눌러야만 차오름 */
     if(s.prog&gt;=100){s.prog=100;s.done=true;s.playing=false;clearInterval(s.iv);}
     var pb=document.getElementById(&#x27;lecProg&#x27;);if(pb)pb.style.width=Math.round(s.prog)+&#x27;%&#x27;;
     if(s.done)renderLec(); else { var tt=document.querySelector(&#x27;.lec-t&#x27;);var bt=document.querySelector(&#x27;.wbtn.locked&#x27;);
       if(bt)bt.textContent=&#x27;🔒 개념체크 — 강의를 다 들어야 열려요 (&#x27;+Math.round(s.prog)+&#x27;%)&#x27;; }
   },400);
 } else { clearInterval(s.iv); }
 renderLec();
}
function closeLec(){if(lecState.iv)clearInterval(lecState.iv);document.getElementById(&#x27;lecOvl&#x27;).classList.remove(&#x27;show&#x27;);}

.aipanel .apinput input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 15px;font-size:13.5px;font-family:inherit;outline:none}
.aipanel .apinput button{background:var(--lime);color:#20233F;border:0;border-radius:12px;padding:0 20px;font-weight:900;font-size:14px;cursor:pointer;white-space:nowrap}
.aires{margin:0 22px 8px}
.aires .arcard{background:var(--card);border:1.5px solid var(--brand);border-radius:16px;overflow:hidden;margin-bottom:12px;animation:arin .25s ease}
@keyframes arin{from{opacity:0;transform:translateY(8px)}}
.aires .arh{background:var(--brand-s);padding:12px 16px;font-size:13px;font-weight:900;color:var(--brand);display:flex;align-items:center;gap:8px}
.aires .arwhy{font-size:12px;color:var(--ink2);padding:11px 16px;background:#FAFBFF;border-bottom:1px solid var(--line2);line-height:1.5}
.aires .arwhy b{color:var(--s-exam)}
.aires .ari{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line2)}
.aires .ari .artag{font-size:10px;font-weight:900;padding:3px 9px;border-radius:6px;white-space:nowrap;flex:none}
.aires .ari .arn{flex:1;min-width:0}
.aires .ari .arn b{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aires .arfoot{display:flex;gap:9px;padding:13px 16px;background:#FBFBFE;border-top:1px solid var(--line2)}
.aires .arfoot button{flex:1;border:0;font-size:13.5px;font-weight:900;padding:12px;border-radius:12px;cursor:pointer}
.aires .arfoot .send{background:var(--brand);color:#fff}
.aires .arfoot .sub{background:var(--bg);color:var(--ink2)}
.aires .arslot{padding:12px 16px;background:var(--lime-s);border-top:1px solid var(--line2)}
.aires .arslot .asq{font-size:12px;font-weight:900;color:var(--lime-ink);margin-bottom:9px}
.aires .arslot .asc{display:flex;gap:8px;flex-wrap:wrap}
.aires .arslot .asc button{font-size:12.5px;font-weight:800;border:1px solid #CBE0A8;background:#fff;color:var(--lime-ink);border-radius:999px;padding:9px 14px;cursor:pointer}
.aires .arslot .asnote{font-size:11px;color:var(--ink3);margin-top:8px}
/* 되묻기 단계 폼 */
.aires .arstep{padding:14px 16px;border-top:1px solid var(--line2)}
.aires .arstep .sql{font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:4px}
.aires .arstep .sqd{font-size:11px;color:var(--ink3);margin-bottom:10px;line-height:1.5}
.aires .arstep .sqopts{display:flex;gap:7px;flex-wrap:wrap}
.aires .arstep .sqopts button{font-size:12.5px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;transition:.12s}
.aires .arstep .sqopts button:hover{border-color:var(--brand);color:var(--brand)}
.aires .arstep .sqopts button.gsel{background:var(--brand);color:#fff;border-color:var(--brand)}
.aires .arstep .sqrow{display:flex;gap:8px;margin-top:10px}
.aires .arstep .sqrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;font-family:inherit;outline:none}
.aires .arstep .sqrow button{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:900;font-size:13.5px;cursor:pointer;white-space:nowrap}
.aires .arstep .sqback{font-size:11px;color:var(--ink3);background:none;border:0;cursor:pointer;margin-top:9px;padding:0;font-family:inherit}
.aires .arcrumb{font-size:11px;color:var(--brand);font-weight:800;padding:9px 16px;background:var(--brand-s);border-bottom:1px solid var(--line2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.aires .arcrumb .cb{background:#fff;border-radius:6px;padding:2px 8px}

.aires .arpair .pph{font-size:11px;font-weight:900;color:var(--ink3);padding:8px 13px;background:#FAFBFF}
.aires .arpair .ari{border-top:1px solid var(--line2)}
.aires .arpair .arlink{text-align:center;font-size:10.5px;color:var(--brand);padding:3px 0;font-weight:800;background:#FAFBFF}
@media(max-width:860px){.aipanel,.aires{margin-left:16px;margin-right:16px}}
/* 리드·온보딩 */
.funnel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.fstep{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;position:relative}
.fstep .fv{font-size:24px;font-weight:900;color:var(--brand)}
.fstep .fl{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:1px}
.fstep::after{content:&quot;→&quot;;position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--faint);font-weight:900;z-index:1}
.fstep:last-child::after{display:none}
.fstep.gain .fv{color:var(--ok)}
.leadlist{display:flex;flex-direction:column;gap:10px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;display:flex;gap:14px;align-items:flex-start}
.lead .lav{width:40px;height:40px;border-radius:11px;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.lead .lmid{flex:1;min-width:0}
.lead .ln{font-size:14px;font-weight:900;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.lead .lsrc{font-size:10px;font-weight:800;color:var(--ink3);background:var(--bg);border-radius:5px;padding:2px 7px}
.lead .lst{font-size:10px;font-weight:900;border-radius:999px;padding:2px 9px}
.lead .lst.s1{background:#E8F1FE;color:#2E7CF0}
.lead .lst.s2{background:#FFF3E3;color:#C97A1E}
.lead .lst.s3{background:#EEE9FC;color:#7B61F2}
.lead .lst.s4{background:var(--ok-s);color:var(--ok)}
.lead .lp{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.lead .lp b{color:var(--s-exam)}
.lead .lbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.lead .lb2{font-size:11.5px;font-weight:900;padding:8px 13px;border-radius:9px;border:0;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.lead .lb2.g{background:var(--ok)}
.lead .lb2.s{background:var(--bg);color:var(--ink2)}
.leadnote{margin-top:16px;background:var(--brand-s);border-radius:14px;padding:14px 17px;font-size:12px;color:var(--ink2);line-height:1.65}
.leadnote b{color:var(--brand)}

  .dashhdr .dh-pills::-webkit-scrollbar{display:none}
  .dashhdr .dhp{flex:0 0 auto}

var UNITS={
 &#x27;수학&#x27;:{
   &#x27;중1&#x27;:[&#x27;소인수분해&#x27;,&#x27;정수와 유리수&#x27;,&#x27;일차방정식&#x27;,&#x27;좌표평면과 그래프&#x27;],

   &#x27;중3&#x27;:[&#x27;제곱근과 실수&#x27;,&#x27;인수분해&#x27;,&#x27;이차방정식&#x27;,&#x27;이차함수&#x27;]},
 &#x27;영어&#x27;:{&#x27;중1&#x27;:[&#x27;be동사·일반동사&#x27;,&#x27;현재시제&#x27;],&#x27;중2&#x27;:[&#x27;현재완료&#x27;,&#x27;수동태&#x27;,&#x27;to부정사&#x27;,&#x27;관계대명사&#x27;],&#x27;중3&#x27;:[&#x27;분사구문&#x27;,&#x27;가정법&#x27;]},
 &#x27;국어&#x27;:{&#x27;중2&#x27;:[&#x27;시의 심상&#x27;,&#x27;문법·품사&#x27;,&#x27;논설문 독해&#x27;],&#x27;중3&#x27;:[&#x27;고전시가&#x27;,&#x27;문장 성분&#x27;]}
};
/* 단원별 세트: [개념강의, 문제] 한 쌍이 기본. 강의 하나 들으면 바로 풀 문제가 따라옴 */
function unitSet(sub,unit){
 var book = sub===&#x27;수학&#x27;?&#x27;쎈&#x27;:(sub===&#x27;영어&#x27;?&#x27;능률&#x27;:&#x27;마더텅&#x27;);
 return [
   [&#x27;live&#x27;,&#x27;개념강의&#x27;, unit+&#x27; 개념특강 (다시보기)&#x27;],
   [&#x27;check&#x27;,&#x27;개념체크&#x27;, unit+&#x27; 개념 확인 3문항&#x27;],
   [&#x27;prob&#x27;,&#x27;문제&#x27;, book+&#x27; &#x27;+unit+&#x27; · 기본 20문항&#x27;],
   [&#x27;lec&#x27;,&#x27;해설강의&#x27;, unit+&#x27; 틀린문제 해설 (자동)&#x27;]
 ];
}

var ASK={sub:null,grade:&#x27;중2&#x27;,unit:null,amount:null};

function crumb(){

}
function aiShell(inner){document.getElementById(&#x27;aiRes&#x27;).innerHTML=&#x27;&lt;div class=&quot;arcard&quot;&gt;&#x27;+inner+&#x27;&lt;/div&gt;&#x27;;document.getElementById(&#x27;aiRes&#x27;).scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;nearest&#x27;});}

function aiAssign(hint){
 aiReset();
 var el=document.getElementById(&#x27;apq&#x27;);
 var t = hint || (el?el.value.trim():&#x27;&#x27;) || &#x27;개념&#x27;;
 if(el)el.value=&#x27;&#x27;;
 if(/영단어|단어|어휘|voca|보카/i.test(t)){ return wordStart(); }
 if(/시험|범위/.test(t)){ return aiRecommend(&#x27;시험&#x27;); }       /* 시험범위는 등록된 범위라 바로 세트 */
 if(/오답|틀린|복습/.test(t)){ return aiRecommend(&#x27;오답&#x27;); } /* 오답도 데이터 기반이라 바로 */
 /* 개념: 어떤 개념인지 되물음 → 과목부터 */
 ASK.sub = /수학|함수|방정식|도형/.test(t)?&#x27;수학&#x27; : (/영어|문법|독해/.test(t)?&#x27;영어&#x27; : (/국어|문해|시/.test(t)?&#x27;국어&#x27; : null));
 if(ASK.sub) return askUnit();
 return askSubject();
}

 if(ASK.grade &amp;&amp; grades.indexOf(ASK.grade)&lt;0) ASK.grade=grades[0];
 var gbtns=grades.map(function(g){return &#x27;&lt;button class=&quot;&#x27;+(g===ASK.grade?&#x27;gsel&#x27;:&#x27;&#x27;)+&#x27;&quot; onclick=&quot;pickGrade(\&#x27;&#x27;+g+&#x27;\&#x27;)&quot;&gt;&#x27;+g+&#x27;&lt;/button&gt;&#x27;;}).join(&#x27;&#x27;);
 var units=(UNITS[ASK.sub][ASK.grade]||[]).map(function(u){
   var weak = (ASK.sub===&#x27;수학&#x27;&amp;&amp;u===&#x27;일차함수&#x27;);
   return &#x27;&lt;button onclick=&quot;pickUnit(\&#x27;&#x27;+u+&#x27;\&#x27;)&quot;&gt;&#x27;+u+(weak?&#x27; &lt;span style=&quot;color:var(--s-exam)&quot;&gt;· 40%&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/button&gt;&#x27;;}).join(&#x27;&#x27;);
 aiShell(crumb()+&#x27;&lt;div class=&quot;arh&quot;&gt;✦ &#x27;+ASK.sub+&#x27; — 어느 범위예요?&lt;/div&gt;&#x27;+

  &#x27;&lt;button class=&quot;sqback&quot; onclick=&quot;askSubject()&quot;&gt;← 과목 다시&lt;/button&gt;&lt;/div&gt;&#x27;);
}

&lt;style&gt;
:root{color-scheme:light;
 --brand:#3A3D8F;--brand-d:#5558C8;--brand-s:#EEF0FF;--lime:#B6E34A;--lime-ink:#3E560A;
 --ink:#191E2E;--ink2:#454E65;--ink3:#7A8398;--faint:#AAB2C2;
 --line:#E7EAF1;--bg:#F2F4FA;--card:#fff;
 --ok:#1F9D64;--ok-s:#E5F4EC;--coach:#C97A1E;--coach-s:#FFF3E3;--hide:#5A6377;--hide-s:#EEF0F6;
 --red:#E23B3B;--red-s:#FDECEC;--vio:#7B61F2;--vio-s:#EEE9FC;--sky:#2E7CF0;--sky-s:#E8F1FE;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,&quot;Noto Sans KR&quot;,system-ui,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.01em;line-height:1.5;padding:74px 16px 60px;overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto}
.hd{text-align:center;margin-bottom:22px}

.fc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:16px}

.fc .fd{font-size:12px;color:var(--ink3);margin-bottom:15px;line-height:1.55}
.fc .fd b{color:var(--ink2)}

/* 흐름 행 */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.node{font-size:12px;font-weight:800;padding:9px 13px;border-radius:11px;background:var(--brand-s);color:var(--brand);white-space:nowrap}

.loopback{font-size:10.5px;font-weight:800;color:var(--vio);background:var(--vio-s);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;margin-top:2px}

/* 분기 */
.branch{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px 10px;padding-left:14px;border-left:2px dashed var(--line)}
.bline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bcase{font-size:9.5px;font-weight:900;border-radius:6px;padding:3px 8px;white-space:nowrap}
.bcase.g{background:var(--ok-s);color:var(--ok)}
.bcase.c{background:var(--coach-s);color:var(--coach)}
.bcase.h{background:var(--hide-s);color:var(--hide)}
.bcase.r{background:var(--red-s);color:var(--red)}
.note{margin-top:12px;background:var(--bg);border-radius:12px;padding:11px 14px;font-size:11.5px;color:var(--ink2);line-height:1.6}
.note b{color:var(--brand)}
.note.warn b{color:var(--red)}

/* 아키텍처 설명서 */
.arch{display:flex;flex-direction:column;gap:0;margin-top:4px}
.layer{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.layer+.layer{margin-top:0}
.ldown{text-align:center;color:var(--faint);font-weight:900;font-size:15px;line-height:1.9}
.lt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;margin-bottom:9px}
.lt .lic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;flex:none}
.lrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:800;border-radius:8px;padding:6px 10px;white-space:nowrap}
.pill small{display:block;font-size:8.5px;font-weight:700;opacity:.75;white-space:normal;line-height:1.25}
.layer.sec{background:linear-gradient(120deg,#20233F,#2A2D6B);border:0;color:#fff}
.layer.sec .lt{color:#fff}
.layer.sec .pill{background:rgba(255,255,255,.12);color:#fff}
.layer.sec .pill.key{background:var(--lime);color:#2A3A08}
.layer.db{background:var(--brand-s);border-color:#D8DCF5}
.layer.db .pill{background:#fff;color:var(--brand);border:1px solid #D8DCF5}
.dbg{margin-bottom:8px}
.dbg:last-child{margin-bottom:0}
.dbg .dbgt{font-size:10px;font-weight:900;color:var(--ink3);margin-bottom:5px}
.rlsnote{margin-top:10px;border-top:1px dashed #C9CEF0;padding-top:9px;font-size:10.5px;color:var(--ink2);line-height:1.6}
.rlsnote b{color:var(--brand)}
@media(max-width:640px){
 .flow{gap:6px}
 .node{font-size:11px;padding:8px 10px}
 .fc{padding:16px}
 .branch{margin-left:4px;padding-left:10px;flex-direction:column;gap:7px}
}

          &lt;span class=&quot;pill&quot; style=&quot;background:var(--ok-s);color:var(--ok)&quot;&gt;수행평가 허브&lt;small&gt;5,926개교 일정 → school_events&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--coach-s);color:var(--coach)&quot;&gt;업로드 + AI 파싱&lt;small&gt;알림장·시험범위·성적표·기출&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--vio-s);color:var(--vio)&quot;&gt;BODA 입퇴장 webhook&lt;small&gt;user_id 기준 출석&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;플레이어 이벤트&lt;small&gt;VOD 진도율 자체 기록&lt;/small&gt;&lt;/span&gt;

        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:#fff&quot;&gt;🗄&lt;/span&gt;Supabase DB — 역할별로 보이는 범위가 다르다 (RLS)&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;사람·조직&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;organizations (트리)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;profiles (역할)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;students (담임 연결)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;subscriptions (빌링키·애드온)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;div class=&quot;rlsnote&quot;&gt;&lt;b&gt;RLS 접근 범위&lt;/b&gt; — 학생: 자기 것만 · 학부모: 자녀 + hide 제외 알림 · 매니저: 담당 학생만 · &lt;b&gt;sales: leads만&lt;/b&gt; · 센터장: 자기 센터 트리 · 마스터: 전체(단, 집계 뷰/RPC 경유 + IP 게이트). 대시보드는 화면 하나에 범위만 축소.&lt;/div&gt;

      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer&quot;&gt;

        &lt;div class=&quot;lrow&quot;&gt;

  &lt;!-- 1. 코칭 루프 --&gt;

  &lt;!-- 2. 시험대비 배정 --&gt;

    &lt;div class=&quot;fd&quot;&gt;수행평가 허브가 시험일을 먼저 알고, 범위만 올리면 &lt;b&gt;단원×출판사×레벨×D-day 역산&lt;/b&gt;으로 세트가 나온다. 언제 할지는 아이가 정한다.&lt;/div&gt;

      &lt;span class=&quot;node&quot;&gt;배정 엔진&lt;small&gt;취약 단원 우선 · 하루 용량 상한&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;아이가 슬롯 확정&lt;small&gt;언제 할지 선택 → 플래너&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;다음 스텝 안내 + 엄마 알림&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;미완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;남은 D-day 안에서 재배치&lt;small&gt;&quot;이번 주에 몰아서 끝내기&quot;&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;일정 변동&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node sky&quot;&gt;수정 제안&lt;small&gt;나만 → 내 일정 수정 / 학교 전체 → 정정 제보·검수 후 반영(SCH-03)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;범위 안 올라옴&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;D-10 담임 알림 → 진도 추정 가배정&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;시험 끝 → 성적 입력 → &lt;b&gt;레벨 보정 + 시험 리포트(RPT-02)&lt;/b&gt; 자동. 개념특강(라이브)은 이 흐름과 무관 — 학년별 정해진 타임에 자동 편성, 듣든 안 듣든 자유.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 3. 알림 분기 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;3&lt;/span&gt;알림 분기 — 좋은 소식은 바로, 나쁜 소식은 담임 경유&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;모든 이벤트는 룰 엔진을 거쳐 &lt;b&gt;auto / coach / hide&lt;/b&gt; 셋 중 하나로 갈라진다. 엄마에게 나쁜 소식이 날것으로 꽂히는 일이 없다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;이벤트 발생&lt;small&gt;출석·완료·미이행·성적·일정&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;룰 엔진&lt;small&gt;rule_id + 구독 플래그 + 행동태그&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;auto&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;즉시 발송&lt;small&gt;학생 웹푸시 + 학부모 알림톡&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar lbl&quot;&gt;출석·완료·일정·리포트&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;coach&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;담임 콘솔에 카드&lt;small&gt;[발송/문구 수정/비공개]&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;검수 후 학부모 발송&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase h&quot;&gt;hide&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node hide&quot;&gt;학생에게만&lt;small&gt;사소한 넛지 — 학부모 미발송&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;매니저 홈에는 이 결과가 행동 기준으로 떨어진다: &lt;b&gt;📞 통화할 것 · 💬 응답할 것 · ✅ 처리할 것 · 👀 확인만&lt;/b&gt; — &quot;포스트잇에 붙이지 않아도 되는 세상.&quot;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 4. 문의 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;4&lt;/span&gt;문의 — 전화 인바운드 없음, 남기면 담임에게 간다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 통합 카톡 하나로 응대 → 누락·오배정. 마이튜터는 &lt;b&gt;수신 단일 창구(인앱) + 담임 자동 라우팅 + 에스컬레이션&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node x&quot;&gt;전화 문의&lt;/span&gt;
      &lt;span class=&quot;ar lbl&quot;&gt;채널 자체가 없음&lt;/span&gt;
      &lt;span class=&quot;node start&quot;&gt;학부모, 앱에서 문의 남김&lt;small&gt;&quot;전화 연락 원해요&quot; 체크 가능&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;담임에게 자동 배정&lt;small&gt;학생당 스레드 1개 · 히스토리 영구&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;답변&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;알림톡 &quot;답변 도착&quot; + 앱 링크&lt;small&gt;카톡은 벨만 울림&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;콜백 요청&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;📞 통화할 것에 통화 약속 적재&lt;small&gt;우리가 거는 전화만 존재&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;24h 무응답&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;센터장 에스컬레이션 + 🔴 최상단 고정&lt;small&gt;누락 구조적 차단&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;카카오 채널로 문의가 와도 자동응답으로 앱 창구에 깔때기. 전 대화가 DB에 남아 &lt;b&gt;담임 교체 시 통째 인수인계&lt;/b&gt; + 대시보드에 응답속도 집계.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 5. 온라인 온보딩 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;5&lt;/span&gt;온라인 온보딩 — 방문 없이, 보여주고, 자유 가입&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 수업을 안 보여주고 방문 결제(346만 선결제·수수료 30만) → 기대 불일치·민원. 마이튜터는 &lt;b&gt;가입 전에 화면을 그대로 공개&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;초대링크 발송&lt;small&gt;카톡 — 예약·미팅·가입 통합&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;온라인 미팅&lt;small&gt;페인포인트 청취 + 화면 시연&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;자유 가입&lt;small&gt;월 20만 · 기간 선택 · 락인 없음&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;온보딩&lt;small&gt;학교 검색 → 허브 연동&lt;br&gt;국·영 출판사 → 레벨 진단&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;플래너 자동 완성&lt;small&gt;학사일정·수행·시험 D-day + 개념특강&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;리드·상담·페인포인트는 전부 DB로 — 전환 퍼널이 대시보드에 집계. 영업 난이도가 낮아져 &lt;b&gt;수수료 30만 → 소액&lt;/b&gt;, 이게 월 20만에서 마진이 나오는 근거.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 6. 라이브 입장 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;6&lt;/span&gt;개념특강 입장 — 이름은 서버가 박는다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 아이들이 대화명을 바꿔 다른 학생 사칭. 마이튜터는 &lt;b&gt;입장 경로가 앱 버튼 하나&lt;/b&gt;고, 이름은 토큰에 바인딩된다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;앱 &quot;본방 입장&quot; 버튼&lt;small&gt;유일한 입장 경로&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;서명 토큰 발급&lt;small&gt;user_id + 표시명 &quot;김민준(반포중2)&quot;&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;BODA 입장&lt;small&gt;이름 입력창 없음 · 변경 불가&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;입퇴장 webhook&lt;small&gt;user_id 기준&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;출석 자동 체크&lt;small&gt;GOOD-01 엄마 알림&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;2회 연속 미입장&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;CHK-01 담임 검수 → 학부모 안내&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;녹화 종료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;VOD 자동 업로드&lt;small&gt;다시보기 — 진도율은 자체 기록&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note warn&quot;&gt;&lt;b&gt;BODA 계약 조건 4가지&lt;/b&gt;: ① 토큰 입장(이름 바인딩) ② 이름 변경 비활성 ③ 입퇴장 webhook ④ 녹화 수령 API — ①③ 미지원 시 API형 화상(LiveKit 등) 재검토.&lt;/div&gt;
  &lt;/div&gt;


  &lt;!-- 7. 구독·결제 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;7&lt;/span&gt;구독·결제 — &quot;잘하고 있다&quot;가 갱신 영업이다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;홈페이지에서 카드 등록 → &lt;b&gt;빌링키 발급 → 월 자동결제&lt;/b&gt; (넷플릭스식, 거부감 없음). 갱신 안내는 결제 요청이 아니라 &lt;b&gt;성과 리포트가 먼저&lt;/b&gt; 간다. 결제는 웹 — 인앱결제 수수료 회피.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;가입 시 카드 등록&lt;small&gt;홈페이지(웹) · KIS 빌링키&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;D-3 안내&lt;small&gt;&quot;이번 달 잘하고 있어요&quot; 리포트 + 결제 예고&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;자동결제 성공&lt;small&gt;영수증·다음 결제일 알림톡&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;실패 1회&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;자동 재시도 + 카드 변경 링크&lt;small&gt;사람 개입 없음&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;실패 2회&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;담임 확인 후 연락&lt;small&gt;독촉이 아니라 도움 톤 (coach)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;기간은 소비자 선택(월/3/6/12) · 위약금 락인 없음 · 해지는 웹 셀프서비스. &lt;b&gt;리텐션은 락인이 아니라 리포트(성과)가 만든다.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
<script>
var cur=1, dev='pc';
var isTouch=matchMedia('(max-width:760px)').matches;
function apply(){
  var devOk=!isTouch && (cur===0||cur===1||cur===3||cur===4);
  for(var j=0;j<5;j++){
    var f=document.getElementById('f'+j);
    f.classList.toggle('on', j===cur);
    f.classList.toggle('mobf', j===cur && devOk && dev==='mob');
    document.getElementById('b'+j).classList.toggle('on', j===cur);
  }
  document.getElementById('dev').classList.toggle('off', !devOk);
  document.getElementById('d0').classList.toggle('on', dev==='mob');
  document.getElementById('d1').classList.toggle('on', dev==='pc');
  document.body.classList.toggle('mob', devOk && dev==='mob');
}
function sw(i){cur=i;apply();}
function dv(m){dev=m;apply();}
window.addEventListener('resize',function(){var s=matchMedia('(max-width:760px)').matches;if(s!==isTouch){isTouch=s;apply();}});
apply();
</script>
</body></html>
