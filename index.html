<html lang=&quot;ko&quot;>
<head>
<meta charset=&quot;utf-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;>
<title>김튜터</title>
<link rel=&quot;icon&quot; href=&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Crect width='52' height='52' rx='12' fill='%233A3D8F'/%3E%3Cpath d='M14 15h24a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H24l-7 6v-6h-3a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3Cpath d='M20 25l4 4 9-9' stroke='%233A3D8F' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E&quot;>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin>
<link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<style>
:root{
  --brand:#3A3D8F; --brand2:#2B2E70; --brand3:#23265C; --brand-d:#5558C8; --brand-s:#ECEDF9; --brand-s2:#F5F6FC;
  --lime:#B6E34A; --lime-d:#8FBE22; --lime-ink:#3E560A; --lime-s:#F3FADF;
  --ink:#191E2E; --ink2:#454E65; --ink3:#7A8398; --faint:#AAB2C2;
  --line:#E7EAF1; --line2:#F1F3F8; --bg:#F2F4FA; --card:#fff;
  --s-school:#9AA3B5; --s-schoolt:#EEF0F4;
  --s-eng:#3B6FE6;    --s-engt:#E8F0FD;
  --s-math:#17A57E;   --s-matht:#E2F5EF;
  --s-live:#F0663B;   --s-livet:#FDEAE3;
  --s-lec:#2FA0B0;    --s-lect:#E3F4F7;
  --s-prob:#E0912A;   --s-probt:#FCF0DC;
  --s-word:#B3579E;   --s-wordt:#F8E8F3;
  --s-after:#E5607A;  --s-aftert:#FBE8EC;
  --s-teuk:#7B61F2;   --s-teukt:#EEE9FC;
  --s-exam:#D6484F;   --s-examt:#FBE9EA;
  --ok:#17A57E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,&quot;Noto Sans KR&quot;,&quot;Apple SD Gothic Neo&quot;,system-ui,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.01em;line-height:1.5}
button{font:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}

/* ===== 셸: 좌 네비 + 메인 ===== */
.shell{display:flex;min-height:100vh}

/* 사이드바 */
.nav{width:234px;flex:none;background:linear-gradient(175deg,var(--brand),var(--brand3));color:#fff;
  display:flex;flex-direction:column;padding:22px 14px 18px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;padding:0 10px;letter-spacing:-.02em}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--lime);display:grid;place-items:center;flex:none;overflow:hidden}
.logo .mk svg{width:32px;height:32px;display:block}
.nav .room{font-size:11px;color:rgba(255,255,255,.55);font-weight:700;padding:3px 10px 0 50px;letter-spacing:.02em}
.menu{margin-top:26px;display:flex;flex-direction:column;gap:3px}
.mi{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:0;background:none;color:rgba(255,255,255,.72);font-weight:700;font-size:13.5px;text-align:left;transition:.12s}
.mi svg{width:19px;height:19px;flex:none}
.mi:hover{background:rgba(255,255,255,.08);color:#fff}
.mi.on{background:rgba(255,255,255,.14);color:#fff}
.mi.on::before{content:&quot;&quot;;width:3px;height:16px;border-radius:2px;background:var(--lime);position:absolute;margin-left:-12px}
.mi .lb{white-space:nowrap}
.mi .lvb{margin-left:auto;font-size:9px;font-weight:900;background:var(--s-live);color:#fff;border-radius:999px;padding:1px 6px}
.nav .sp{flex:1}
.prof{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:11px 12px}
.prof .av{width:34px;height:34px;border-radius:11px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.prof b{font-size:13px;display:block}
.prof .g{font-size:10.5px;color:rgba(255,255,255,.55);font-weight:600}

/* 메인 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:16px;padding:20px 26px 0}
.mh .hi b{font-size:22px;font-weight:900;letter-spacing:-.03em}
.mh .hi .d{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.mh .sp{flex:1}
.wknav{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 7px}
.wknav button{width:28px;height:28px;border:0;background:none;border-radius:8px;color:var(--ink3);font-weight:800}
.wknav button:hover{background:var(--line2)}
.wknav b{font-size:12.5px;font-weight:800;padding:0 4px;white-space:nowrap}
.hbtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-weight:800;font-size:12.5px;color:var(--ink2)}
.hbtn svg{width:15px;height:15px}
.hbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.bell{position:relative}
.bell .nd{position:absolute;top:-5px;right:-5px;background:var(--s-live);color:#fff;font-size:9.5px;font-weight:900;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

.content{display:flex;gap:18px;padding:18px 26px 28px;align-items:flex-start}

/* ===== 플래너 ===== */
.planner{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pl-hd{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 10px}
.pl-hd b{font-size:16.5px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:5px 13px;padding:0 20px 9px}
.autonote{display:flex;align-items:center;gap:7px;margin:0 20px 13px;font-size:11px;font-weight:700;color:#B5491F;background:var(--s-livet);border-radius:9px;padding:7px 12px}
.odbar{display:flex;align-items:center;gap:11px;margin:0 20px 13px;background:#FFF1F1;border:1px solid #F7C9C9;border-radius:11px;padding:11px 15px}
.odbar .odic{width:28px;height:28px;border-radius:8px;background:#E23B3B;display:grid;place-items:center;flex:none}
.odbar .odic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5;fill:none}
.odbar .odtx{flex:1;font-size:12.5px;color:#9A1B22;line-height:1.4}
.odbar .odtx b{font-weight:900}
.odbar .odbtn{background:#E23B3B;color:#fff;border:0;font-size:12px;font-weight:900;padding:8px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.odbar .odbtn:hover{background:#C92F38}
.an-dot{width:7px;height:7px;border-radius:50%;background:var(--s-live);flex:none}
.lg{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:3px}
.grid{overflow-x:auto}
.gtbl{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.gtbl th{font-size:12px;font-weight:800;color:var(--ink2);padding:0 0 9px;background:var(--card)}
.gtbl th.today{color:var(--brand)}
.gtbl th .tdd{font-size:10.5px;color:var(--faint);font-weight:700;margin-top:1px}
.gtbl th.today .tdd{color:var(--brand-d)}
.gtbl th.wkd,.gtbl td.wkd{opacity:.82}
.gtbl td{border-top:1px solid var(--line2);border-left:1px solid var(--line2);height:42px;vertical-align:top;padding:0;position:relative}
.gtbl td.timecol,.gtbl th.timecol{width:46px}
.gtbl td.timecol{border-left:0;text-align:right;padding:4px 8px 0 0;font-size:10px;color:var(--faint);font-weight:700}
.gtbl td.todaycol{background:var(--brand-s2)}
.blk{position:absolute;left:3px;right:3px;top:2px;bottom:2px;border-radius:8px;padding:6px 8px;overflow:hidden;line-height:1.25;cursor:pointer;transition:.1s}
.blk:hover{filter:brightness(.97);box-shadow:0 2px 8px -2px rgba(25,30,46,.18)}
.blk .bt{font-size:11.5px;font-weight:700;letter-spacing:-.02em}
.blk .bs{font-size:9.5px;opacity:.8;margin-top:1px;font-weight:600}
.blk.islive{box-shadow:inset 0 0 0 1.5px var(--s-live)}
.blk.auto{border-left:3px solid var(--s-live)}
.blk .atag{display:inline-block;font-size:7.5px;font-weight:900;color:var(--s-live);background:#fff;border-radius:4px;padding:0 4px;margin-top:3px;letter-spacing:.02em}
.blk .ltag{position:absolute;top:4px;right:4px;font-size:8px;font-weight:900;color:#fff;background:var(--s-live);padding:1px 4px;border-radius:4px}
.blk .chk{position:absolute;bottom:5px;right:5px;width:15px;height:15px;border-radius:5px;background:var(--ok);display:none;place-items:center}
.blk.done{opacity:.55}
.blk.done .chk{display:grid}
.blk .chk svg{width:9px;height:9px;stroke:#fff;stroke-width:3.5}
.blk.overdue{box-shadow:inset 0 0 0 1.6px #E23B3B;background:#FFF4F4 !important;animation:odp 2.4s ease-in-out infinite}
@keyframes odp{0%,100%{box-shadow:inset 0 0 0 1.6px #E23B3B}50%{box-shadow:inset 0 0 0 1.6px #E23B3B,0 0 0 2px rgba(226,59,59,.18)}}
.blk.overdue .bt{color:#C0202A}
.blk .odtag{position:absolute;bottom:4px;right:4px;font-size:8px;font-weight:900;color:#fff;background:#E23B3B;padding:1px 5px;border-radius:5px;letter-spacing:-.02em}

/* ===== 우측 레일 ===== */
.rail{width:316px;flex:none;display:flex;flex-direction:column;gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px}

/* 지금 카드 */
.now{background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff;border:0;position:relative;overflow:hidden}
.now::after{content:&quot;&quot;;position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(182,227,74,.16)}
.now .nk{font-size:11.5px;font-weight:800;color:var(--lime);display:flex;align-items:center;gap:7px;position:relative}
.now .ld{width:8px;height:8px;border-radius:50%;background:var(--s-live);position:relative}
.now .ld::after{content:&quot;&quot;;position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--s-live);opacity:.5;animation:rip 1.8s infinite}
@keyframes rip{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.now h3{font-size:18px;font-weight:800;margin-top:9px;position:relative;letter-spacing:-.01em}
.now .ns{font-size:12px;color:rgba(255,255,255,.75);margin-top:3px;position:relative}
.now .nbtn{margin-top:13px;width:100%;background:var(--lime);color:var(--lime-ink);border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;position:relative}
.now .nbtn:active{transform:translateY(1px)}

/* 오늘 체크리스트 */
.rc .rh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.rc .rh b{font-size:15px;font-weight:800}
.rc .rh .sub{font-size:11px;color:var(--ink3);font-weight:700}
.todo{list-style:none}
.todo li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.todo li:first-child{border-top:0}
.todo .tt{font-size:11px;font-weight:800;color:var(--ink3);width:37px;flex:none}
.todo .tdot{width:8px;height:8px;border-radius:3px;flex:none}
.todo .tb{flex:1;min-width:0}
.todo .tb b{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .tb .ts{font-size:10.5px;color:var(--ink3)}
.todo li.ext .tb b{color:var(--ink3);font-weight:600}
.todo .cb{width:22px;height:22px;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;cursor:pointer;transition:.12s}
.todo .cb svg{width:11px;height:11px;stroke:#fff;stroke-width:3.5;opacity:0}
.todo li.done .cb{background:var(--ok);border-color:var(--ok)}
.todo li.done .cb svg{opacity:1}
.todo li.done .tb b{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--ink3)}
.todo .lvb{font-size:9px;font-weight:900;color:#fff;background:var(--s-live);border-radius:999px;padding:1px 6px;flex:none}

/* 학교 연동 */
.schooltag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ok);background:var(--s-matht);border-radius:999px;padding:5px 11px;cursor:pointer}
.gtbl tr.allday td{height:auto;border-top:0;padding:2px 3px 7px;vertical-align:middle}
.gtbl tr.allday td.timecol{font-size:9px;line-height:1.3;padding-top:4px}
.schip{display:block;font-size:9.5px;font-weight:800;border-radius:7px;padding:5px 7px;line-height:1.3;cursor:pointer;color:#fff}
.schip.perf{background:var(--s-prob)}
.schip.test{background:var(--s-exam)}
.schip:hover{filter:brightness(1.06)}
.srcb{margin-left:auto;margin-right:36px;font-size:10px;font-weight:800;color:var(--ok);background:var(--s-matht);border-radius:6px;padding:3px 8px;white-space:nowrap}
.upsch{list-style:none;margin-top:12px;border-top:1px solid var(--line2);padding-top:4px}
.upsch li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12px;font-weight:700}
.upsch li .ud{font-size:10.5px;font-weight:800;color:var(--ink3);width:52px;flex:none}
.upsch li .ui{width:7px;height:7px;border-radius:3px;flex:none}
.upsch li .dd2{margin-left:auto;font-size:10px;font-weight:900;color:var(--s-exam)}
.srcline{margin-top:9px;font-size:10px;color:var(--faint);font-weight:600}

/* 시험·성적 카드 */
.exam .rh .dday{font-size:13px;font-weight:900;color:#fff;background:var(--s-exam);border-radius:999px;padding:3px 11px}
.goalrow{display:flex;gap:9px;margin-top:10px}
.goal{flex:1;background:var(--bg);border-radius:11px;padding:9px 11px}
.goal .gl{font-size:10.5px;color:var(--ink3);font-weight:700}
.goal .gv{font-size:14.5px;font-weight:800;margin-top:1px}
.gbar-w{margin-top:12px}
.gbars{display:flex;gap:12px;align-items:flex-end;height:86px;padding:0 4px}
.gb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.gb i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:#CBD2E0}
.gb.on i{background:var(--brand-d)}
.gb.tgt i{background:var(--lime);outline:2px dashed var(--lime-d);outline-offset:-2px}
.gb em{font-style:normal;font-size:9px;font-weight:700;color:var(--ink3);margin-top:5px;text-align:center;line-height:1.25}
.gb.tgt em{color:var(--lime-d);font-weight:800}
.exbtns{display:flex;gap:8px;margin-top:13px}
.exb{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px;font-weight:800;font-size:12px;color:var(--ink2)}
.exb.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.exb.ex{border-color:#F2C6C8;color:var(--s-exam);background:#FFF6F6}
.addtodo{width:100%;margin-top:10px;border:1.5px dashed var(--line);background:none;border-radius:11px;padding:10px;font-weight:800;font-size:12px;color:var(--ink3)}
.addtodo:hover{border-color:var(--brand-d);color:var(--brand)}

/* 담아둔 공부 */
.tray{background:var(--lime-s);border-color:#E2EFC2}
.tray .rh b{color:var(--lime-ink)}
.ti{margin-top:9px;background:var(--card);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.ti .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ti .tic svg{width:17px;height:17px}
.ti .tib{flex:1;min-width:0}
.ti .tib b{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .tib .tis{font-size:10.5px;color:var(--ink3)}
.ti .split{display:flex;gap:5px;flex:none}
.ti .split button{font-weight:800;font-size:10.5px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;color:var(--ink2);white-space:nowrap}
.ti .split button.p{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 특강 */
.teuk{background:linear-gradient(130deg,var(--s-teuk),#9B86FF);border:0;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.teuk::after{content:&quot;&quot;;position:absolute;right:-18px;bottom:-26px;width:95px;height:95px;border-radius:50%;background:rgba(255,255,255,.12)}
.teuk .tk{font-size:11px;font-weight:800;opacity:.9;position:relative}
.teuk .tt{font-size:16.5px;font-weight:900;margin-top:3px;position:relative}
.teuk .td2{font-size:11.5px;opacity:.85;margin-top:4px;line-height:1.45;position:relative}
.teuk .tbtn{margin-top:11px;background:#fff;color:var(--s-teuk);border:0;font-weight:800;font-size:12px;padding:8px 14px;border-radius:10px;position:relative}

/* ===== 모달 (PC 중앙) ===== */
.ovl{position:fixed;inset:0;background:rgba(25,30,46,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.ovl.show{display:flex}
.dlg{background:var(--card);width:100%;max-width:440px;border-radius:22px;padding:24px;animation:pop .18s ease;position:relative}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dlg .x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;border:0;background:var(--line2);color:var(--ink3);font-size:15px;font-weight:800}
.dlg .shd{display:flex;align-items:center;gap:9px}
.dlg .sdot{width:11px;height:11px;border-radius:4px;flex:none}
.dlg .scat{font-size:12.5px;font-weight:800}
.dlg .slive{font-size:10px;font-weight:900;color:#fff;background:var(--s-live);padding:3px 8px;border-radius:6px}
.dlg h3{font-size:22px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.dlg .smeta{font-size:13px;color:var(--ink3);margin-top:4px}
.dlg .sinfo{margin-top:16px;background:var(--bg);border-radius:14px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.dlg .si .sl{font-size:11px;color:var(--ink3);font-weight:700}
.dlg .si .sv{font-size:14px;font-weight:800;margin-top:2px}
.dlg .sact{margin-top:17px;display:flex;gap:9px}

.dlg .sact .pri{background:var(--brand);color:#fff}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:200;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px -6px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.24s}

/* ===== 반응형 ===== */
@media (max-width:1240px){
  .nav{width:72px;padding:22px 10px 16px}
  .logo{justify-content:center;padding:0}.logo span.wd{display:none}
  .nav .room{display:none}

}

  .content{flex-direction:column}
  .rail{width:100%;flex-direction:row;flex-wrap:wrap;align-items:stretch}
  .rail .rc{flex:1 1 280px}
}
@media (max-width:720px){
  .shell{flex-direction:column}
  .nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:12px 16px}
  .menu{flex-direction:row;margin:0 0 0 14px;overflow-x:auto}
  .mi{padding:9px 10px}

/* ===== 알림 센터 ===== */
.bell .nd{transition:.15s}
.bellpanel{position:fixed;top:66px;right:26px;width:340px;max-height:72vh;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 24px 60px -18px rgba(25,30,46,.4);z-index:90;overflow:hidden;display:none;flex-direction:column}
.bellpanel.show{display:flex;animation:bpin .18s ease}
@keyframes bpin{from{transform:translateY(-8px);opacity:0}}
.bp-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2)}
.bp-hd b{font-size:15px;font-weight:800}
.bp-tog{font-size:11px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:5px;cursor:pointer}
.bp-list{overflow-y:auto;padding:8px}
.bp-empty{text-align:center;color:var(--faint);font-size:12px;font-weight:600;padding:34px 20px;line-height:1.6}
.ni{border-radius:12px;padding:11px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.ni.stu{background:var(--push-s)}.ni.par{background:var(--kakao-s,#FFF8DD)}.ni.ops{background:#F0EBFC}
.ni .nic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:#fff}
.ni.stu .nic{background:var(--push,#2E7CF0)}.ni.par .nic{background:#E5B800}.ni.ops .nic{background:#8B5CF6}
.ni .nb{flex:1;min-width:0}
.ni .nb .ntt{font-size:12.5px;font-weight:800}
.ni .nb .nmm{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.ni .nb .nwhy{font-size:10.5px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.08);line-height:1.4;display:none}
.ni .nb .nwhy .gb{font-weight:900;border-radius:4px;padding:1px 5px;margin-right:4px}
.gb.a{background:#E5F4EC;color:#14683f}.gb.c{background:#FFF4E0;color:#8A6310}.gb.h{background:#EEF0F6;color:#5A6377}
.bp-list.showwhy .nwhy{display:block}
.ni .nx{font-size:9px;font-weight:800;color:var(--ink3);background:rgba(0,0,0,.05);border-radius:5px;padding:2px 6px;flex:none;white-space:nowrap}

/* 날아가는 토스트 */
.flywrap{position:fixed;bottom:26px;right:26px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fly{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 14px 34px -12px rgba(25,30,46,.4);
  display:flex;gap:10px;align-items:center;max-width:320px;transform:translateX(30px);opacity:0;animation:flyin .3s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes flyin{to{transform:none;opacity:1}}
.fly .fc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:#fff}
.fly.stu .fc{background:var(--push,#2E7CF0)}.fly.par .fc{background:#E5B800}.fly.ops .fc{background:#8B5CF6}.fly.block .fc{background:#8792A5}
.fly .ft{font-size:11px;font-weight:800;color:var(--ink3)}
.fly .fm{font-size:12.5px;font-weight:700;margin-top:1px;line-height:1.3}

/* ===== 입력 모달 (폼) ===== */
.dlg.wide{max-width:560px}
.dlg h3.fh{font-size:20px;margin-top:4px}
.dlg .fdesc{font-size:12.5px;color:var(--ink3);margin-top:4px;margin-bottom:16px;line-height:1.5}
.frow{margin-bottom:13px}
.frow .fl2{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:block}
.fin{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--bg);color:var(--ink)}
.fin:focus{outline:0;border-color:var(--brand-d);background:#fff}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip2{font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink2)}
.chip2.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip2.sm{padding:6px 11px;font-size:11px}
/* 업로드 존 */
.upz{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
.upz:hover{border-color:var(--brand-d);background:var(--brand-s)}
.upz .ui2{width:46px;height:46px;border-radius:13px;background:var(--brand-s);display:grid;place-items:center;margin:0 auto 11px}
.upz .ui2 svg{width:23px;height:23px;stroke:var(--brand)}
.upz b{font-size:14px;font-weight:800;display:block}
.upz p{font-size:11.5px;color:var(--ink3);margin-top:4px}
.uptabs{display:flex;gap:7px;margin-bottom:14px}
.uptab{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:10px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2)}
.uptab.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 시험계획 과목 배분 */
.examplan{background:var(--bg);border-radius:12px;padding:13px;margin-bottom:10px}
.examplan .eph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.examplan .eph b{font-size:13px;font-weight:800}
.examplan .eph .dd3{font-size:11px;font-weight:800;color:var(--s-exam);background:#FBE9EA;border-radius:5px;padding:2px 8px}
.epline{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line2)}
.epline:first-of-type{border-top:0}
.epline .epsub{font-size:11.5px;font-weight:800;width:52px;flex:none}
.epline .epwhat{flex:1;font-size:12px;color:var(--ink2)}
.epline .epday{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--brand-s);border-radius:6px;padding:3px 8px;white-space:nowrap}
.fsub{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:4px}
.graderes{background:var(--ok-s,#E5F4EC);border-radius:12px;padding:13px;margin-top:4px}
.graderes .grh{font-size:12px;font-weight:800;color:#146844;margin-bottom:8px}
.graderes table{width:100%;border-collapse:collapse;font-size:12.5px}
.graderes td{padding:6px 4px;border-bottom:1px solid rgba(20,104,68,.12)}
.graderes td:last-child{text-align:right;font-weight:800}

/* ===== 전체 페이지 오버레이 ===== */
.page{position:fixed;inset:0;left:234px;background:var(--bg);z-index:80;overflow-y:auto;display:none}
.page.show{display:block}
@media(max-width:1240px){.page{left:72px}}
@media(max-width:720px){.page{left:0}}
.pg-hd{position:sticky;top:0;background:rgba(246,247,251,.92);backdrop-filter:blur(10px);z-index:2;display:flex;align-items:center;gap:14px;padding:18px 30px;border-bottom:1px solid var(--line)}
.pg-hd .back{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:18px}
.pg-hd b{font-size:20px;font-weight:900;letter-spacing:-.02em}
.pg-hd .pgsub{font-size:12.5px;color:var(--ink3);font-weight:600}
.pg-body{max-width:860px;margin:0 auto;padding:24px 30px 60px}
@media(max-width:720px){.pg-hd{padding:16px}.pg-body{padding:18px 16px 40px}}

/* 온보딩 — 학교 검색 */
.ob-sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.ob-sec h4{font-size:15px;font-weight:900;margin-bottom:4px}
.ob-sec .d{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.schbar{display:flex;gap:9px}
.schbar input{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:var(--bg)}
.schbar input:focus{outline:0;border-color:var(--brand-d);background:#fff}
.schbar .sbtn{background:var(--brand);color:#fff;border-radius:12px;padding:0 22px;font-weight:800;font-size:14px}
.schres{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.schitem{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.12s}
.schitem:hover{border-color:var(--brand-d);background:var(--brand-s)}
.schitem.sel{border-color:var(--brand);background:var(--brand-s);box-shadow:inset 0 0 0 1px var(--brand)}
.schitem .sn{font-size:14.5px;font-weight:800}
.schitem .sa{font-size:12px;color:var(--ink3);margin-top:2px}
.schitem .srg{margin-left:auto;font-size:11px;font-weight:800;color:var(--brand);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap}
.schitem.sel .srg{background:var(--brand);color:#fff;border-color:var(--brand)}
/* 불러오는 과정 */
.loadsteps{margin-top:14px;display:none}
.loadsteps.show{display:block}
.ls{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:13px;font-weight:700;color:var(--ink3)}
.ls .lsi{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.ls.done{color:var(--ink)}
.ls.done .lsi{background:var(--ok,#1F9D64);border-color:var(--ok,#1F9D64)}
.ls.done .lsi svg{width:11px;height:11px;stroke:#fff;stroke-width:3}
.ls.load .lsi{border-color:var(--brand);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ls .lsc{font-size:11px;font-weight:700;color:var(--brand);margin-left:auto}
.obres{margin-top:14px;background:var(--brand-s);border-radius:14px;padding:16px;display:none}
.obres.show{display:block}
.obres .orh{font-size:13px;font-weight:900;color:var(--brand);margin-bottom:10px}
.orline{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid rgba(58,61,143,.12);font-size:12.5px}
.orline:first-of-type{border-top:0}
.orline .od{font-size:11px;font-weight:800;color:var(--ink3);width:60px;flex:none}
.orline .ot{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap}
.ot.perf{background:#FCF0DC;color:#9A6310}.ot.test{background:#FBE9EA;color:#D6484F}.ot.etc{background:#EEF0F6;color:#5A6377}
.myrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.myrow{grid-template-columns:1fr}}

/* 성적 성장 대시보드 */
.gp-hero{background:linear-gradient(150deg,var(--brand),var(--brand-d));border-radius:20px;padding:24px;color:#fff;margin-bottom:16px}
.gp-hero .gt{font-size:13px;font-weight:700;opacity:.8}
.gp-hero .gv{font-size:36px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
.gp-hero .gc{font-size:13px;font-weight:800;color:var(--lime);margin-top:3px}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:620px){.gcards{grid-template-columns:1fr}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.gcard h4{font-size:14px;font-weight:900;margin-bottom:14px}
.gchart{display:flex;align-items:flex-end;gap:14px;height:120px}
.gbar2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.gbar2 .gnum{font-size:11px;font-weight:800;margin-bottom:5px}
.gbar2 i{display:block;width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:#CBD2E0}
.gbar2.on i{background:var(--brand-d)}.gbar2.tgt i{background:var(--lime);outline:2px dashed var(--lime-d);outline-offset:-2px}
.gbar2 em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink3);margin-top:6px;text-align:center;line-height:1.2}
.subtbl{width:100%;border-collapse:collapse;font-size:13px}
.subtbl td{padding:9px 4px;border-bottom:1px solid var(--line2)}
.subtbl td:nth-child(2),.subtbl td:nth-child(3){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.subtbl .up{color:var(--ok,#1F9D64);font-size:11px}
.subtbl .dn{color:var(--warn,#E5603A);font-size:11px}
.gp-upload{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink3)}
.gp-upload:hover{border-color:var(--brand-d);color:var(--brand);background:var(--brand-s)}

/* 학부모 뷰 */
.pv-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:14px}
.pv-top{background:linear-gradient(150deg,#2B2E70,#4B4FB0);border-radius:20px;padding:24px;color:#fff;margin-bottom:16px}
.pv-top .pt1{font-size:13px;opacity:.75;font-weight:600}
.pv-top .pt2{font-size:22px;font-weight:900;margin-top:3px}
.pv-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px}
.pv-stat .ps{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 10px;text-align:center}
.pv-stat .ps .pv{font-size:20px;font-weight:900}
.pv-stat .ps .pl{font-size:10.5px;opacity:.7;font-weight:600;margin-top:1px}
.pv-card h4{font-size:14.5px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pv-week{display:flex;gap:6px}
.pv-week .pw{flex:1;text-align:center;border-radius:10px;padding:10px 0;background:var(--bg)}
.pv-week .pw .pwd{font-size:10.5px;font-weight:800;color:var(--ink3)}
.pv-week .pw .pwi{width:22px;height:22px;border-radius:50%;margin:6px auto 0;display:grid;place-items:center}
.pv-week .pw.ok .pwi{background:var(--ok-s,#E5F4EC)}
.pv-week .pw.ok .pwi svg{width:12px;height:12px;stroke:var(--ok,#1F9D64);stroke-width:3}
.pv-week .pw.no .pwi{background:#FBE9EA}
.pv-week .pw.no .pwi::after{content:&quot;·&quot;;color:#D6484F;font-weight:900}
.pv-al{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line2)}
.pv-al:first-of-type{border-top:0}
.pv-al .pai{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.pv-al .pab b{font-size:13px;font-weight:800}
.pv-al .pab p{font-size:12px;color:var(--ink2);margin-top:1px}
.pv-al .patm{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:700;white-space:nowrap}
/* 라이브 */
.lv-hero{background:linear-gradient(120deg,var(--brand),var(--brand-d));color:#fff;border-radius:20px;padding:24px 26px;margin-bottom:18px;position:relative;overflow:hidden}
.lv-hero .lvtag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);font-size:11px;font-weight:900;padding:5px 11px;border-radius:999px;letter-spacing:.3px}
.lv-hero .lvtag .dot{width:7px;height:7px;border-radius:50%;background:#FF5A5A;box-shadow:0 0 0 3px rgba(255,90,90,.35);animation:bl 1.3s infinite}
@keyframes bl{50%{opacity:.35}}
.lv-hero h3{font-size:22px;font-weight:900;margin:12px 0 5px}
.lv-hero p{font-size:13px;opacity:.9;line-height:1.55}
.lv-hero .lvbtn{margin-top:16px;background:var(--lime);color:#1A1C3A;border:0;font-weight:900;font-size:14px;padding:12px 22px;border-radius:12px;cursor:pointer}
.lvlist{display:flex;flex-direction:column;gap:11px}
.lv-row{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:.15s}
.lv-row:hover{border-color:var(--brand-d);box-shadow:0 6px 18px -8px rgba(58,61,143,.3)}
.lv-row .lvw{width:52px;height:52px;border-radius:13px;background:var(--s-live,#EEF0FF);display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:var(--brand);text-align:center;line-height:1.2}
.lv-row .lvw.on{background:var(--brand);color:#fff}
.lv-row .lvmid{flex:1;min-width:0}
.lv-row .lvmid b{font-size:14.5px;font-weight:800;display:block}
.lv-row .lvmid .lvsub{font-size:12px;color:var(--ink3);margin-top:3px}
.lv-row .lvst{font-size:11px;font-weight:900;padding:5px 11px;border-radius:999px;white-space:nowrap}
.lv-row .lvst.now{background:#FFECEC;color:#E23B3B}
.lv-row .lvst.soon{background:var(--brand-s);color:var(--brand)}
.lv-row .lvst.rep{background:var(--bg);color:var(--ink3)}
.lv-row .lvst.done{background:var(--ok-s,#E5F4EC);color:var(--ok,#1F9D64)}
.lv-note{margin-top:16px;background:var(--brand-s);border-radius:14px;padding:15px 18px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.lv-note b{color:var(--brand)}

.pb-hero{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pb-stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.pb-stat .pbv{font-size:23px;font-weight:900;color:var(--brand)}
.pb-stat .pbl{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:2px}
.pb-sec h4{font-size:13.5px;font-weight:900;margin:4px 0 11px;color:var(--ink2)}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.pb-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;cursor:pointer;transition:.15s}
.pb-card:hover{border-color:var(--brand-d);transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(58,61,143,.3)}

.pb-card .pbm{font-size:11.5px;color:var(--ink3)}
.pb-card .pbbar{height:6px;border-radius:999px;background:var(--line);margin-top:11px;overflow:hidden}

 4:[{k:'perf',t:'국어 말하기 수행',subj:'국어',date:'10/23 금',topic:'설득하는 말하기 — 3분 스피치',pts:'20점',share:'수행평가 40% 중 20점',tip:'원고 제출 후 발표 순서 추첨'}]

    '<div class=&quot;shd&quot;><span class=&quot;sdot&quot; style=&quot;background:var(--s-prob)&quot;></span><span class=&quot;scat&quot; style=&quot;color:#9A6310&quot;>'+c.subj+' 수행평가</span><span class=&quot;srcb&quot;>반포중 평가계획</span></div>'+

    '<div class=&quot;si&quot;><div class=&quot;sl&quot;>반영</div><div class=&quot;sv&quot;>'+c.share+'</div></div>'+
    '<div class=&quot;si&quot; style=&quot;grid-column:1/3&quot;><div class=&quot;sl&quot;>참고</div><div class=&quot;sv&quot; style=&quot;font-size:13px&quot;>'+c.tip+'</div></div></div>'+
    '<div class=&quot;sact&quot;><button class=&quot;pri&quot; onclick=&quot;toast(\'시험 계획에 넣었어요 — 알림 가요\')&quot;>준비 계획 담기</button><button class=&quot;sub&quot; onclick=&quot;closeDlg()&quot;>닫기</button></div>';
  document.getElementById('ovl').classList.add('show');

// ★ 특강 롤링 배너 (무신사형) — 수행평가 공략·공부 기술 중심
var TKB=[
 {g:'linear-gradient(120deg,#E23B3B,#F2683C)',cat:'🔥 수행평가 공략',tit:'수행평가, 뭘 고를지부터',desc:'많은 수행 중 세팅에 유리한 하나를 골라 공략하는 법',when:'10/24 금 20:00'},
 {g:'linear-gradient(120deg,#3A3D8F,#6B4FD0)',cat:'✦ 공부 기술',tit:'시험 2주 전 역산 공부법',desc:'벼락치기 말고, D-14부터 거꾸로 짜는 시험 플랜',when:'매주 화 19:30'},
 {g:'linear-gradient(120deg,#1E8E7E,#2FB3A0)',cat:'∑ 서술형 대비',tit:'서술형 감점 안 당하는 법',desc:'채점 기준에 맞춰 쓰는 연습 — 태블릿 판서 첨삭',when:'매주 토 10:00'},
 {g:'linear-gradient(120deg,#C28A1E,#E0A93A)',cat:'🎓 입시 세미나',tit:'중2 외고·자사고 로드맵',desc:'내신·원서 일정 전략 — 학부모 동반 세미나',when:'11/15 토 19:00'},
 {g:'linear-gradient(120deg,#8C5BC2,#B07FE0)',cat:'📒 노트 기술',tit:'오답노트, 진짜 되는 방식',desc:'틀린 걸 다시 안 틀리게 만드는 정리법',when:'10/26 일 20:00'}
];
var tkIdx=0,tkTimer;
function renderTkb(){
  var rail=document.getElementById('tkRail'),dots=document.getElementById('tkDots'); if(!rail)return;
  rail.innerHTML=TKB.map(function(t,i){
    return '<div class=&quot;tkb&quot; style=&quot;background:'+t.g+'&quot; onclick=&quot;toast(\''+t.tit+' 신청\')&quot; data-i=&quot;'+i+'&quot;><div class=&quot;tkblob&quot;></div>'+
      '<div><div class=&quot;tkcat&quot;>'+t.cat+'</div><div class=&quot;tktit&quot;>'+t.tit+'</div><div class=&quot;tkdesc&quot;>'+t.desc+'</div></div>'+
      '<div class=&quot;tkfoot&quot;><span class=&quot;tkwhen&quot;>🗓 '+t.when+'</span><span class=&quot;tkcta&quot;>신청하기</span></div></div>';
  }).join('');
  dots.innerHTML=TKB.map(function(t,i){return '<i'+(i===0?' class=&quot;on&quot;':'')+' onclick=&quot;tkGo('+i+')&quot;></i>';}).join('');
  rail.addEventListener('scroll',function(){
    var w=rail.querySelector('.tkb'); if(!w)return;
    var gap=12, step=w.offsetWidth+gap;
    var idx=Math.round(rail.scrollLeft/step); tkMark(idx);
  });
  tkAuto();
}
function tkMark(i){tkIdx=i;var ds=document.querySelectorAll('#tkDots i');ds.forEach(function(d,j){d.classList.toggle('on',j===i);});}
function tkGo(i){var rail=document.getElementById('tkRail');var w=rail.querySelector('.tkb');var step=w.offsetWidth+12;rail.scrollTo({left:step*i,behavior:'smooth'});tkMark(i);tkAuto();}
function tkAuto(){clearInterval(tkTimer);tkTimer=setInterval(function(){var n=(tkIdx+1)%TKB.length;tkGo2(n);},4500);}
function tkGo2(i){var rail=document.getElementById('tkRail');if(!rail)return;var w=rail.querySelector('.tkb');if(!w)return;var step=w.offsetWidth+12;rail.scrollTo({left:step*i,behavior:'smooth'});tkMark(i);}
// 미완료(밀림) 판정: 과거 요일 + 미완료 + 외부일정(ext) 아님 + 시험계획(exam) 제외
function isOverdue(b){var st=b[6]||{};return b[0]<TODAY &amp;&amp; !st.done &amp;&amp; !st.ext &amp;&amp; b[5]!=='exam';}
function overdueList(){return BLK.filter(isOverdue);}
var DAYNM=['월','화','수','목','금','토','일'];
function renderOverdueBanner(){
  var el=document.getElementById('odBanner'); if(!el)return;
  var od=overdueList();
  if(!od.length){el.innerHTML='';return;}
  var names=od.slice(0,3).map(function(b){return DAYNM[b[0]]+' '+b[3];}).join(', ');
  var more=od.length>3?(' 외 '+(od.length-3)+'개'):'';
  el.innerHTML='<div class=&quot;odbar&quot;><div class=&quot;odic&quot;><svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z&quot;/></svg></div>'+
    '<div class=&quot;odtx&quot;>밀린 공부 <b>'+od.length+'개</b> — '+names+more+'. <b>이번 주 안에 끝내자!</b></div>'+
    '<button class=&quot;odbtn&quot; onclick=&quot;notify(\'overdue\');toast(\'밀린 공부 '+od.length+'개를 주말 전까지 다시 담았어요\')&quot;>이번 주에 몰아서 끝내기</button></div>';
}
function buildGrid(){
  renderOverdueBanner();
  var map={},spanned={};
  BLK.forEach(function(b,i){map[b[0]+'-'+b[1]]={b:b,i:i};for(var s=1;s<b[2];s++)spanned[b[0]+'-'+(b[1]+s)]=1;});
  var rows='';
  for(var r=0;r<TIMES.length;r++){
    var tds='<td class=&quot;timecol&quot;>'+TIMES[r]+'</td>';
    for(var d=0;d<7;d++){
      if(spanned[d+'-'+r])continue;
      var cell=map[d+'-'+r], cls=[];
      if(d===TODAY)cls.push('todaycol'); if(d>=5)cls.push('wkd');
      var cattr=cls.length?' class=&quot;'+cls.join(' ')+'&quot;':'';
      if(cell){
        var b=cell.b, sk=SUB[b[5]], st=b[6]||{};
        var over=isOverdue(b);
        var bstyle=(b[5]==='exam')?'background:var(--s-exam);color:#fff':'background:var('+sk[2]+');color:var('+sk[1]+')';
        tds+='<td'+(b[2]>1?' rowspan=&quot;'+b[2]+'&quot;':'')+cattr+'>'+
          '<div class=&quot;blk'+(st.live?' islive':'')+(st.done?' done':'')+(over?' overdue':'')+(b[5]==='live'?' auto':'')+'&quot; style=&quot;'+bstyle+'&quot; onclick=&quot;openDlg('+cell.i+')&quot;>'+
          (st.live?'<span class=&quot;ltag&quot;>LIVE</span>':'')+
          '<div class=&quot;bt&quot;>'+b[3]+'</div>'+(b[4]?'<div class=&quot;bs&quot;>'+b[4]+'</div>':'')+
          (b[5]==='live'?'<span class=&quot;atag&quot;>본방 사수</span>':'')+
          (over?'<span class=&quot;odtag&quot;>미완료</span>':'')+
          '<div class=&quot;chk&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;#fff&quot;><path d=&quot;M4 12l5 5L20 6&quot;/></svg></div></div></td>';
      } else tds+='<td'+cattr+'></td>';
    }
    rows+='<tr>'+tds+'</tr>';
  }
  var ths='<th class=&quot;timecol&quot;></th>'+DAYS.map(function(d,i){
    var c=[]; if(i===TODAY)c.push('today'); if(i>=5)c.push('wkd');
    return '<th'+(c.length?' class=&quot;'+c.join(' ')+'&quot;':'')+'>'+d[0]+'<div class=&quot;tdd&quot;>'+d[1]+(i===TODAY?' 오늘':'')+'</div></th>';}).join('');
  // 학교 일정(종일) — 수행평가 허브 엔진 데이터 (클릭 → 주제·배점 상세)
  var allday='<tr class=&quot;allday&quot;><td class=&quot;timecol&quot;>학교<br>일정</td>'+DAYS.map(function(d,i){
    var cls=[]; if(i===TODAY)cls.push('todaycol'); if(i>=5)cls.push('wkd');
    var chips=(SCH[i]||[]).map(function(c,j){return '<span class=&quot;schip '+c.k+'&quot; onclick=&quot;openSch('+i+','+j+')&quot;>'+c.t+'</span>';}).join('');
    return '<td'+(cls.length?' class=&quot;'+cls.join(' ')+'&quot;':'')+'>'+chips+'</td>';}).join('')+'</tr>';
  document.getElementById('grid').innerHTML='<table class=&quot;gtbl&quot;><thead><tr>'+ths+'</tr></thead><tbody>'+allday+rows+'</tbody></table>';
}

function buildTodo(){
  var items=BLK.map(function(b,i){return {b:b,i:i};}).filter(function(x){return x.b[0]===TODAY;})
    .sort(function(a,z){return a.b[1]-z.b[1];});
  var done=0,tot=0;
  var html=items.map(function(x){
    var b=x.b, sk=SUB[b[5]], st=b[6]||{};
    var ext=st.ext;
    if(!ext)tot++; if(!ext&amp;&amp;st.done)done++;
    return '<li class=&quot;'+(st.done?'done ':'')+(ext?'ext':'')+'&quot;>'+
      '<span class=&quot;tt tnum&quot;>'+b[4].split('–')[0].replace('~','')+'</span>'+
      '<span class=&quot;tdot&quot; style=&quot;background:var('+sk[1]+')&quot;></span>'+
      '<div class=&quot;tb&quot;><b>'+b[3]+'</b><div class=&quot;ts&quot;>'+sk[0]+(ext?' · 외부 일정':'')+'</div></div>'+
      (st.live?'<span class=&quot;lvb&quot;>LIVE</span>':'')+
      (ext?'':'<button class=&quot;cb&quot; onclick=&quot;tgl('+x.i+')&quot;><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;><path d=&quot;M4 12l5 5L20 6&quot;/></svg></button>')+
      '</li>';
  }).join('');
  document.getElementById('todo').innerHTML=html;
  document.getElementById('todoCnt').textContent=done+'/'+tot+' 완료';
}
function tgl(i){ var st=BLK[i][6]=BLK[i][6]||{}; st.done=st.done?0:1; buildGrid(); buildTodo();
  if(st.done){ // 오늘 할 일(ext 제외)이 전부 끝났는지 체크 → 완료면 알림 발사
    var items=BLK.filter(function(b){return b[0]===TODAY &amp;&amp; !(b[6]&amp;&amp;b[6].ext);});
    var allDone=items.length &amp;&amp; items.every(function(b){return b[6]&amp;&amp;b[6].done;});
    if(allDone) notify('done'); else toast('완료 체크!');
  } }

function openDlg(i){

  else if(st.order) act='<button class=&quot;pri&quot; onclick=&quot;toast(\'이번 주 오더 작성 화면\')&quot;>오더 작성하기</button><button class=&quot;sub&quot; onclick=&quot;toast(\'제출 완료\')&quot;>제출</button>';
  else if(b[5]==='prob') act='<button class=&quot;pri&quot; onclick=&quot;toast(\'풀이 시작 — 태블릿 필기로\')&quot;>풀기</button><button class=&quot;sub&quot; onclick=&quot;toast(\'내일로 옮김\')&quot;>내일로</button>';
  else if(b[5]==='word') act='<button class=&quot;pri&quot; onclick=&quot;toast(\'단어 암기 시작\')&quot;>외우기</button>';
  else if(b[5]==='teuk') act='<button class=&quot;pri&quot; onclick=&quot;toast(\'특강 신청\')&quot;>신청하기</button>';
  else if(b[5]==='exam') act='<button class=&quot;pri&quot; onclick=&quot;toast(\'완료 체크!\')&quot;>완료</button><button class=&quot;sub&quot; onclick=&quot;toast(\'내일로 옮김 — 알림도 옮겨요\')&quot;>내일로</button>';
  else act='<button class=&quot;pri&quot; onclick=&quot;closeDlg()&quot;>확인</button>';

function selSchool(el,real){
  Array.prototype.forEach.call(el.parentNode.children,function(c){c.classList.remove('sel');});
  el.classList.add('sel');
  // 선택 → 일정 불러오는 과정 애니메이션
  var ls=document.getElementById('loadSteps'); ls.classList.add('show');
  var steps=ls.querySelectorAll('.ls');
  steps.forEach(function(s){s.className='ls';});
  document.getElementById('obRes').classList.remove('show');
  var i=0;
  function next(){
    if(i>0) steps[i-1].className='ls done';
    if(i<steps.length){ steps[i].className='ls load'; i++; setTimeout(next,650); }
    else { document.getElementById('obRes').classList.add('show'); }
  }
  next();
}

   items:[['live','라이브','라이브 수학개념 · 일차함수편'],['lec','해설강의','일차함수 해설강의 3강'],['prob','문제','쎈 수학 p.52-59']],

function renderRec(key){var r=RECS[key];if(!r)return '다시 물어봐 주세요.';

 // 이번 주 담은 내역 집계
 var all=0,done=0,byType={live:0,lec:0,prob:0,exam:0};
 Object.keys(PLAN).forEach(function(d){(PLAN[d]||[]).forEach(function(b){if(b[2]==='ext')return;all++;if(byType[b[2]]!==undefined)byType[b[2]]++;if(b[1]==='완료'||b[1]==='담김'&amp;&amp;false)done++;});});
 var pct=all?Math.round((7/Math.max(all,1))*100):0; // 데모용 진행률
 pct=58;
 el.innerHTML=
   '<div class=&quot;dtstat&quot;><div class=&quot;dv&quot;>'+all+'</div><div class=&quot;dl&quot;>이번 주 담은 항목</div></div>'+
   '<div class=&quot;dtstat&quot;><div class=&quot;dv&quot;>'+(byType.live||0)+'·'+(byType.lec||0)+'</div><div class=&quot;dl&quot;>라이브·해설강의</div></div>'+
   '<div class=&quot;dtstat&quot;><div class=&quot;dv&quot;>'+(byType.prob||0)+'</div><div class=&quot;dl&quot;>문제 세트</div></div>'+
   '<div class=&quot;dtstat warn&quot;><div class=&quot;dv&quot;>2</div><div class=&quot;dl&quot;>미완료(밀림)</div></div>'+
   '<div class=&quot;dtbar&quot;><div class=&quot;dblbl&quot;><span>이번 주 진행률</span><span>'+pct+'%</span></div><div class=&quot;dbtrack&quot;><i style=&quot;width:'+pct+'%&quot;></i></div></div>'+
   '<div class=&quot;dtrecent&quot;><span class=&quot;rl&quot;>최근 담음:</span><span class=&quot;rtag&quot;>일차함수 해설 3강</span><span class=&quot;rtag&quot;>쎈 p.52-55</span><span class=&quot;rtag&quot;>시험 스텝업</span></div>';
}
/* ===== 뷰 전환 ===== */
function go(v){
 ['Home','Students','Assign'].forEach(function(n){document.getElementById('view'+n).style.display='none';});
 ['mHome','mStu'].forEach(function(m){document.getElementById(m).classList.remove('on');});
 if(v==='home'){document.getElementById('viewHome').style.display='block';document.getElementById('mHome').classList.add('on');renderHome();}
 if(v==='students'){document.getElementById('viewStudents').style.display='block';document.getElementById('mStu').classList.add('on');renderStudents();}
 if(v==='assign'||v==='detail'){document.getElementById('viewAssign').style.display='flex';document.getElementById('mStu').classList.add('on');renderDtDash();buildPlan();}
 window.scrollTo(0,0);}

renderHome();buildPlan();
</script>
