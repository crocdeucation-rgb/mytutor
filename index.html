.tk2body .wbtn{margin-top:0}
/* ===== 레벨 진단 모달 ===== */
/* 진단 모달 — bottom-sheet 대신 화면 중앙 카드로 */
.wordovl.dg-center{align-items:center}
.wordsheet.dg{max-width:440px;height:auto;max-height:88vh;border-radius:22px;margin:0 16px}
.wordsheet.dg .wtop{padding:18px 20px 14px;border-bottom:1px solid var(--line2)}
.wordsheet.dg .sp-title{font-size:16px}
.wordsheet.dg .dgbody{padding:20px}
#dgCnt{font-size:12px;font-weight:800;color:var(--ink3);flex:none;white-space:nowrap}
.dgbody{padding:4px 2px 2px}
.dg-intro,.dg-done{text-align:center;padding:8px 4px}
.dg-ic{font-size:40px;margin-bottom:6px}
.dg-h{font-size:17px;font-weight:900;color:var(--ink);margin-bottom:8px}
.dg-h b{color:var(--brand)}
.dg-d{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:14px}
.dg-d b{color:var(--ink)}
.dg-units{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.dg-ut{background:var(--bg);color:var(--ink2);font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px}
.dg-bar{height:6px;background:var(--line2);border-radius:999px;overflow:hidden;margin:2px 0 16px}
.dg-bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:.3s}
.dg-utag{display:inline-block;background:var(--lime-s);color:#5B7A1E;font-size:12px;font-weight:900;padding:5px 11px;border-radius:999px;margin-bottom:10px}
.dg-q{font-size:16px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:16px;min-height:44px}
.dg-opts{display:flex;flex-direction:column;gap:9px}
.dg-op{display:flex;align-items:center;gap:11px;text-align:left;background:var(--card);border:1.5px solid var(--line2);border-radius:13px;padding:14px 15px;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;transition:.12s}
.dg-op:hover{border-color:var(--brand)}
.dg-op.on{border-color:var(--brand);background:var(--lime-s)}
.dg-no{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line2);color:var(--ink3);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.dg-op.on .dg-no{background:var(--brand);color:#fff}
.dg-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.dg-nav .wbtn{margin-top:0;width:auto;padding:11px 16px;font-size:13px;flex:none}
.dg-score{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px;text-align:left}
.dg-sr{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--ink)}
.dg-sr&gt;span{flex:none;width:76px}
.dg-sr b{flex:none;width:40px;text-align:right}
.dg-sr.weak{color:#E23B3B}
.dg-sb{flex:1;height:8px;background:var(--line2);border-radius:999px;overflow:hidden}
.dg-sb i{display:block;height:100%;background:var(--brand);border-radius:999px}
.dg-sr.weak .dg-sb i{background:#E23B3B}
.dg-reco{background:var(--lime-s);border-radius:12px;padding:13px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.6;margin:14px 0 2px;text-align:left}
.dg-reco b{color:var(--brand)}
/* 적응형 진단 추가 요소 */
.dg-utag.pre{background:#EDE8FF;color:#6B4FD0}
.dg-presub{font-size:12.5px;color:var(--ink3);margin:-8px 0 14px;font-weight:600}
.dg-dlv{font-size:10px;font-weight:800;opacity:.7;margin-left:4px}
.dg-adapt{font-size:11px;color:var(--ink3);font-weight:700}
.dg-fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:800;line-height:1.5}
.dg-fb b{margin-right:4px}
.dg-fb.ok{background:var(--ok-s,#E6F6EA);color:#2FA84F}
.dg-fb.ng{background:#FFF0F0;color:#E23B3B}
.dg-fb.skip{background:var(--bg);color:var(--ink2)}
.dg-lvbar{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dg-lvp{width:34px;height:34px;border-radius:9px;background:var(--line2);color:var(--ink3);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.dg-lvp.on{background:var(--brand);color:#fff}
.dlg{background:var(--card);width:100%;max-width:440px;border-radius:22px;padding:24px;animation:pop .18s ease;position:relative;max-height:92vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dlg .x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;border:0;background:var(--line2);color:var(--ink3);font-size:15px;font-weight:800}
.dlg .shd{display:flex;align-items:center;gap:9px}
.dlg .sdot{width:11px;height:11px;border-radius:4px;flex:none}
.dlg .scat{font-size:12.5px;font-weight:800}
.dlg .slive{font-size:10px;font-weight:900;color:#fff;background:var(--s-live);padding:3px 8px;border-radius:6px}
.dlg h3{font-size:22px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.dlg .smeta{font-size:13px;color:var(--ink3);margin-top:4px}
.dlg .sinfo{margin-top:16px;background:var(--bg);border-radius:14px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.dlg .si .sl{font-size:11px;color:var(--ink3);font-weight:700}
.dlg .si .sv{font-size:14px;font-weight:800;margin-top:2px}
/* ===== 시험 계획표 직접 입력 ===== */
.epl-head{display:grid;grid-template-columns:58px 1fr 76px 28px;gap:6px;font-size:11px;font-weight:800;color:var(--ink3);padding:0 2px 6px}
.epl-list{display:flex;flex-direction:column;gap:7px}
.epl-row{display:grid;grid-template-columns:58px 1fr 76px 28px;gap:6px;align-items:center}
.epl-s,.epl-w,.epl-d{border:1.5px solid var(--line2);border-radius:10px;padding:10px 9px;font-size:12.5px;font-family:inherit;color:var(--ink);background:var(--card);min-width:0}
.epl-s:focus,.epl-w:focus,.epl-d:focus{outline:0;border-color:var(--brand)}
.epl-x{border:0;background:var(--bg);color:var(--ink3);border-radius:9px;width:28px;height:36px;font-size:13px;font-weight:800;cursor:pointer}
.epl-empty{background:var(--bg);border-radius:12px;padding:18px 14px;font-size:12.5px;color:var(--ink3);line-height:1.7;text-align:center}
.epl-empty b{color:var(--ink2)}
.epl-btns{display:flex;gap:8px;margin-top:9px}
.epl-add,.epl-sug{flex:1;border:1.5px dashed var(--line);background:none;border-radius:11px;padding:11px;font-size:12.5px;font-weight:800;color:var(--ink2);cursor:pointer;font-family:inherit}
.epl-sug{border-style:solid;border-color:var(--lime-s);background:var(--lime-s);color:#5B7A1E}
/* ===== 수행평가 자기주도 준비 패널 ===== */
.pf-note{background:#FFF6E6;border:1px solid #F3E2BC;border-radius:12px;padding:12px 13px;font-size:12.5px;color:#7A5A12;line-height:1.6;margin:14px 0 4px}
.pf-note b{color:#5C4208}
.pf-sec{margin-top:16px}
.pf-h{font-size:14px;font-weight:900;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.pf-cnt{background:var(--lime-s);color:#5B7A1E;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px}
.pf-ta{width:100%;min-height:72px;resize:vertical;border:1.5px solid var(--line2);border-radius:12px;padding:12px;font-size:13.5px;font-family:inherit;color:var(--ink);line-height:1.6;box-sizing:border-box}
.pf-ta:focus{outline:0;border-color:var(--brand)}
.pf-save{margin-top:8px;background:var(--bg);color:var(--ink2);border:0;border-radius:10px;padding:9px 16px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.pf-up{display:flex;align-items:center;gap:13px;border:1.5px dashed var(--line);border-radius:13px;padding:16px;cursor:pointer;font-size:12.5px;color:var(--ink2);line-height:1.55;transition:.12s}
.pf-up:hover{border-color:var(--brand);background:var(--lime-s)}
.pf-up b{color:var(--ink)}
.pf-upic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.pf-files{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pf-file{background:var(--lime-s);color:#5B7A1E;font-size:12px;font-weight:800;padding:6px 11px;border-radius:9px}
.pf-steps{display:flex;flex-direction:column;gap:7px}
.pf-step{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.pf-step input{display:none}
.pf-cb{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);position:relative}
.pf-step.done{color:var(--ink3)}
.pf-step.done .pf-cb{background:var(--brand);border-color:var(--brand)}
.pf-step.done .pf-cb::after{content:&#x27;&#x27;;position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pf-step.done&gt;span:last-child,.pf-step.done{text-decoration:none}
.pf-add{margin-top:3px;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:11px;font-size:12.5px;font-weight:800;color:var(--ink3);cursor:pointer;font-family:inherit}
.dlg .sact{margin-top:17px;display:flex;gap:9px}
.dlg .sact button{flex:1;font-weight:800;font-size:14px;border:0;border-radius:13px;padding:14px}
.dlg .sact .pri{background:var(--brand);color:#fff}
.dlg .sact .sub{background:var(--brand-s);color:var(--brand);flex:none;padding:14px 18px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:200;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px -6px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.24s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 반응형 (패드·노트북·모바일) ===== */
@media (max-width:1240px){
  .nav{width:72px;padding:22px 10px 16px}
  .logo{justify-content:center;padding:0}.logo span.wd{display:none}
  .nav .room,.devrow{display:none}

}

  .rail .rc{flex:1 1 280px}
}
@media (max-width:720px){
  .shell{flex-direction:column}
  .nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:12px 16px}

  .mi{padding:9px 10px}
  .nav .sp,.prof{display:none}
  .mh{flex-wrap:wrap;gap:10px;padding:16px 16px 0}
  .content{padding:14px 16px 22px}
  .aiwin{right:10px;left:10px;width:auto;bottom:10px;height:70vh}

  .bellpanel{left:10px;right:10px;width:auto;top:120px}
  .flywrap{right:12px;left:12px;bottom:84px;align-items:stretch}

  .mh .hi b{font-size:18px}
  .wknav{order:5}
  .pl-hd{flex-wrap:wrap;gap:8px}
  .exbtns{flex-wrap:wrap}
  .now h3{font-size:16px}
}

/* ===== 알림 센터 ===== */
.bell .nd{transition:.15s}
.bellpanel{position:fixed;top:66px;right:26px;width:340px;max-height:72vh;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:0 24px 60px -18px rgba(25,30,46,.4);z-index:90;overflow:hidden;display:none;flex-direction:column}
.bellpanel.show{display:flex;animation:bpin .18s ease}
@keyframes bpin{from{transform:translateY(-8px);opacity:0}}
.bp-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2)}
.bp-hd b{font-size:15px;font-weight:800}
.bp-tog{font-size:11px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:5px;cursor:pointer}
.bp-list{overflow-y:auto;padding:8px}
.bp-empty{text-align:center;color:var(--faint);font-size:12px;font-weight:600;padding:34px 20px;line-height:1.6}
.ni{border-radius:12px;padding:11px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.ni.stu{background:var(--push-s)}.ni.par{background:var(--kakao-s)}.ni.ops{background:#F0EBFC}
.ni .nic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:#fff}
.ni.stu .nic{background:var(--push)}.ni.par .nic{background:#E5B800}.ni.ops .nic{background:#8B5CF6}
.ni .nb{flex:1;min-width:0}
.ni .nb .ntt{font-size:12.5px;font-weight:800}
.ni .nb .nmm{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.ni .nb .nwhy{font-size:10.5px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.08);line-height:1.4;display:none}
.ni .nb .nwhy .gb{font-weight:900;border-radius:4px;padding:1px 5px;margin-right:4px}
.gb.a{background:#E5F4EC;color:#14683f}.gb.c{background:#FFF4E0;color:#8A6310}.gb.h{background:#EEF0F6;color:#5A6377}
.bp-list.showwhy .nwhy{display:block}
.ni .nx{font-size:9px;font-weight:800;color:var(--ink3);background:rgba(0,0,0,.05);border-radius:5px;padding:2px 6px;flex:none;white-space:nowrap}

.flywrap{position:fixed;bottom:26px;right:96px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fly{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 14px 34px -12px rgba(25,30,46,.4);
  display:flex;gap:10px;align-items:center;max-width:320px;transform:translateX(30px);opacity:0;animation:flyin .3s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes flyin{to{transform:none;opacity:1}}
.fly .fc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:900;color:#fff}
.fly.stu .fc{background:var(--push)}.fly.par .fc{background:#E5B800}.fly.ops .fc{background:#8B5CF6}.fly.block .fc{background:#8792A5}
.fly .ft{font-size:11px;font-weight:800;color:var(--ink3)}
.fly .fm{font-size:12.5px;font-weight:700;margin-top:1px;line-height:1.3}

/* ===== 입력 모달 (폼) ===== */
.dlg.wide{max-width:560px}
.dlg h3.fh{font-size:20px;margin-top:4px}
.dlg .fdesc{font-size:12.5px;color:var(--ink3);margin-top:4px;margin-bottom:16px;line-height:1.5}
.frow{margin-bottom:13px}
.frow .fl2{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:block}
.fin{width:100%;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--bg);color:var(--ink)}
.fin:focus{outline:0;border-color:var(--brand-d);background:#fff}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip2{font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink2)}

.chip2.sm{padding:6px 11px;font-size:11px}
.upz{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
.upz:hover{border-color:var(--brand-d);background:var(--brand-s)}

.upz b{font-size:14px;font-weight:800;display:block}
.upz p{font-size:11.5px;color:var(--ink3);margin-top:4px}
.uptabs{display:flex;gap:7px;margin-bottom:14px}
.uptab{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:10px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2)}
.uptab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.examplan{background:var(--bg);border-radius:12px;padding:13px;margin-bottom:10px}
.examplan .eph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.examplan .eph b{font-size:13px;font-weight:800}
.examplan .eph .dd3{font-size:11px;font-weight:800;color:var(--s-exam);background:#FBE9EA;border-radius:5px;padding:2px 8px}
.epline{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line2)}
.epline:first-of-type{border-top:0}
.epline .epsub{font-size:11.5px;font-weight:800;width:52px;flex:none}
.epline .epwhat{flex:1;font-size:12px;color:var(--ink2)}
.epline .epday{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--brand-s);border-radius:6px;padding:3px 8px;white-space:nowrap}
.fsub{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:4px}
.graderes{background:var(--ok-s);border-radius:12px;padding:13px;margin-top:4px}
.graderes .grh{font-size:12px;font-weight:800;color:#146844;margin-bottom:8px}
.graderes table{width:100%;border-collapse:collapse;font-size:12.5px}
.graderes td{padding:6px 4px;border-bottom:1px solid rgba(20,104,68,.12)}

.pg-hd .pgsub{font-size:12.5px;color:var(--ink3);font-weight:600}

.ob-sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.ob-save{margin:4px 0 30px}
.ob-sec h4{font-size:15px;font-weight:900;margin-bottom:4px}
.ob-sec .d{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.schbar{display:flex;gap:9px}
.schbar input{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:var(--bg)}
.schbar input:focus{outline:0;border-color:var(--brand-d);background:#fff}
.sbtn{background:var(--brand);color:#fff;border-radius:12px;padding:12px 22px;font-weight:800;font-size:14px;border:0;cursor:pointer;font-family:inherit;line-height:1.2}

/* ===== 특강 페이지 — 신청 = 시간표 배정 (겹침 상태 미리 표시) ===== */
.sp-why.ok{background:var(--lime-s);border-color:#DCEFA8;color:var(--lime-ink)}
.sp-slot{display:inline-block;margin-top:7px;font-size:11px;font-weight:900;border-radius:999px;padding:4px 11px}
.sp-slot.free{background:#F0F9F4;color:#1E7A45;border:1px solid #C6E8D4}
.sp-slot.warn{background:#FEF3F3;color:#C23B3B;border:1px solid #F3D6D6}
.sp-slot.done{background:var(--lime-s);color:var(--lime-ink);border:1px solid #DCEFA8}
.sp-card.added{background:#FAFCF5;border-color:#DCEFA8}
.sp-join.done{background:var(--lime-s);color:var(--lime-ink);cursor:default}

/* ===== 오답 유형 선택 칩 ===== */
.wy-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;margin-top:9px}
.wy-chip{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:9px 11px;text-align:left;font-family:inherit;cursor:pointer;transition:.12s}
.wy-chip:hover{border-color:var(--brand);background:var(--brand-s,#EAF7F0)}
.wy-chip.on{border-color:var(--brand);background:var(--brand-s,#EAF7F0);box-shadow:0 0 0 3px rgba(46,158,91,.14)}
.wy-ic{font-size:15px;margin-right:5px}
.wy-t{font-size:12.5px;font-weight:900;color:var(--ink)}
.wy-d{display:block;font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:2px;line-height:1.35}
.sw-fix{margin-top:10px;background:var(--brand-s,#EAF7F0);border:1px solid #BFE6CE;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:800;color:var(--brand-ink,#14532D)}
.sw-hint{margin-top:9px;font-size:11.5px;font-weight:800;color:var(--ink3);text-align:center}
/* 복습센터 — 유형 표시 */
.rv-wk{font-size:11px;font-weight:900;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-right:6px}
.rv-fix{display:block;font-size:11px;font-weight:800;color:var(--brand);margin-top:5px}
.rv-chg{margin-top:7px;border:1px dashed var(--line);background:none;border-radius:9px;padding:5px 10px;font-size:10.5px;font-weight:800;color:var(--ink3);font-family:inherit;cursor:pointer}
.rv-needwhy{background:#FFF7F7;border:1px solid #F3D6D6;border-radius:13px;padding:11px 12px;margin-top:8px}
.rv-needwhy b{font-size:12px;font-weight:900;color:#C23B3B;display:block}
.rv-needwhy&gt;span{font-size:11px;font-weight:700;color:var(--ink3);line-height:1.5;display:block;margin-top:3px}
.rv-go.off{background:var(--line2);color:var(--faint)}
/* 복습센터 — 유형 분포 */
.wy-stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.wy-sh{font-size:12.5px;font-weight:900;margin-bottom:9px}
.wy-bars{display:flex;flex-wrap:wrap;gap:6px}
.wy-bar{display:flex;align-items:center;gap:5px;background:var(--line2);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;color:var(--ink2)}
.wy-bar.top{background:#FDEBEB;color:#C23B3B}
.wy-bv{font-weight:900}
.wy-none{font-size:11.5px;font-weight:800;color:var(--faint)}
.wy-rx{margin-top:10px;background:#F7F9FC;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;color:var(--ink2);line-height:1.6}
.wy-rx span{color:var(--brand)}
.wy-rx em{font-style:normal;color:#C23B3B;margin-left:4px}
/* ===== 오답 유형 분석 패널 (리포트·어드민 공용) ===== */
.wk-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}
.wk-h{font-size:14px;font-weight:900;letter-spacing:-.02em;margin-bottom:11px}
.wk-h span{display:block;font-size:11px;font-weight:700;color:var(--ink3);margin-top:2px}
.wk-list{display:flex;flex-direction:column;gap:6px}
.wk-row{display:flex;align-items:center;gap:8px}
.wk-ic{font-size:14px;flex:none;width:19px;text-align:center}
.wk-t{flex:none;width:112px;font-size:12px;font-weight:800;color:var(--ink2)}
.wk-track{flex:1;min-width:40px;height:9px;background:var(--line2);border-radius:999px;overflow:hidden}
.wk-track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#7B61F2,#A78BFA)}
.wk-row:first-child .wk-track i{background:linear-gradient(90deg,#D64545,#F0663B)}
.wk-n{flex:none;width:44px;text-align:right;font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}
.wk-n em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink3);margin-left:1px}
.wk-d{flex:none;width:36px;text-align:right;font-size:11px;font-weight:900;color:var(--faint)}
.wk-d.good{color:#2FA84F}.wk-d.bad{color:#D64545}
.wk-read{margin-top:12px;background:#F7F9FC;border:1px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.7}
.wk-read b{font-weight:900;color:var(--ink)}
.wk-note{margin-top:9px;font-size:11px;font-weight:700;color:var(--ink3);line-height:1.6}
@media(max-width:560px){.wk-t{width:82px;font-size:11px}}

/* ===== 도전 문제 (킬러문항 · 풀이 서술) ===== */
.ch-hero{background:linear-gradient(135deg,#3A2B5E,#6B4FA0);border-radius:18px;padding:17px;color:#fff;text-align:center;margin-bottom:12px}
.ch-hi{font-size:38px;line-height:1.1}
.ch-hn{font-size:18px;font-weight:900;margin-top:3px;letter-spacing:-.02em}
.ch-hd{font-size:11.5px;font-weight:800;color:rgba(255,255,255,.68);margin-top:3px}
.ch-ht{font-size:11.5px;font-weight:900;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 13px;display:inline-block;margin-top:9px}
.ch-warn{background:#FFF8E8;border:1px solid #F0DFB4;border-radius:14px;padding:11px 13px;font-size:12px;font-weight:800;color:#8A6209;line-height:1.6;margin-bottom:12px}
.ch-card{border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:9px;background:var(--card);cursor:pointer;transition:.14s}
.ch-card:hover{border-color:#8B5CF6;box-shadow:0 8px 20px -12px rgba(107,79,160,.5)}
.ch-card.done{border-color:#BFE6CE;background:#F6FCF8}
.ch-ct{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.ch-sub{font-size:10.5px;font-weight:900;background:#EFE9FB;color:#6B4FA0;border-radius:999px;padding:3px 9px}
.ch-star{font-size:12px;font-weight:900;color:#E8A33C;letter-spacing:1px}
.ch-star.big{font-size:15px}
.ch-pass{margin-left:auto;font-size:10.5px;font-weight:900;background:var(--brand);color:#fff;border-radius:999px;padding:3px 9px}
.ch-again{margin-left:auto;font-size:10.5px;font-weight:900;background:var(--sun-s,#FFF4DF);color:#8A5A00;border-radius:999px;padding:3px 9px}
.ch-new{margin-left:auto;font-size:10.5px;font-weight:900;background:var(--line2);color:var(--ink3);border-radius:999px;padding:3px 9px}
.ch-cu{font-size:14.5px;font-weight:900;letter-spacing:-.02em}
.ch-cm{display:flex;gap:12px;margin-top:6px;font-size:11px;font-weight:800;color:var(--ink3);flex-wrap:wrap}
.ch-qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.ch-pt{margin-left:auto;font-size:11.5px;font-weight:900;color:var(--lime-ink);background:var(--lime-s);border-radius:999px;padding:4px 11px}
.ch-q{font-size:16px;font-weight:800;line-height:1.75;background:#FAFBFD;border:1px solid var(--line);border-radius:16px;padding:16px;letter-spacing:-.01em}
.ch-q b{color:#6B4FA0}
.ch-poem{margin-top:10px;padding:12px 14px;background:#fff;border-left:3px solid #8B5CF6;border-radius:0 10px 10px 0;font-size:14px;font-weight:700;color:var(--ink2);line-height:2}
.ch-guide{margin-top:11px;background:#F4F1FC;border:1px solid #DED5F5;border-radius:15px;padding:13px 15px}
.ch-guide b{font-size:12.5px;font-weight:900;color:#5B3F94;display:block;margin-bottom:7px}
.ch-guide ol{margin:0;padding-left:19px}
.ch-guide li{font-size:12.5px;font-weight:800;color:var(--ink2);line-height:1.9}
.ch-guide li em{font-style:normal;font-size:10.5px;font-weight:900;color:#6B4FA0;background:#fff;border-radius:999px;padding:1px 7px;margin-left:4px}
.ch-guide&gt;span{display:block;font-size:11px;font-weight:800;color:#7E6AA8;margin-top:8px;line-height:1.55}
.ch-ta{width:100%;min-height:200px;margin-top:12px;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:14px;font-weight:600;line-height:1.85;font-family:inherit;resize:vertical;outline:none;letter-spacing:-.01em}
.ch-ta:focus{border-color:#8B5CF6}
.ch-res{border-radius:18px;padding:18px;text-align:center;margin-bottom:13px}
.ch-res.ok{background:linear-gradient(135deg,#1E7A45,#2FA84F);color:#fff}
.ch-res.ng{background:linear-gradient(135deg,#8A6209,#C08A1E);color:#fff}
.ch-rs{font-size:46px;font-weight:900;letter-spacing:-.04em;line-height:1}
.ch-rs span{font-size:17px;margin-left:3px}
.ch-rl{font-size:13px;font-weight:900;margin-top:6px}
.ch-rub,.ch-mine,.ch-model{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;background:var(--card)}
.ch-rh{font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:9px}
.ch-step{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;background:#FBFBFD;border:1px solid var(--line);margin-bottom:5px}
.ch-step.hit{background:#F3FBF6;border-color:#C6E8D4}
.ch-sc{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#F0D9D9;color:#C23B3B;flex:none}
.ch-step.hit .ch-sc{background:var(--brand);color:#fff}
.ch-st{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:var(--ink2)}
.ch-sp{flex:none;font-size:11.5px;font-weight:900;color:var(--ink3)}
.ch-step.hit .ch-sp{color:var(--brand)}
.ch-minet{font-size:13px;font-weight:600;line-height:1.8;color:var(--ink2);background:#FAFBFD;border-radius:12px;padding:12px;white-space:pre-wrap}
.ch-review{background:#EFF4FE;border:1px solid #D3E0F8;border-radius:14px;padding:11px 13px;font-size:12px;font-weight:800;color:#2B4A82;line-height:1.65;margin-bottom:11px}
.ch-model{font-size:13.5px;font-weight:700;line-height:1.9;color:var(--ink2)}
.ch-model b{color:#6B4FA0}
.ch-hall{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#FCFBFF}
.ch-hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ch-hrow:last-child{border:0}
.ch-hrow .hi2{font-size:19px;flex:none}
.ch-hrow b{display:block;font-size:13px;font-weight:900}
.ch-hrow span{font-size:11px;font-weight:700;color:var(--ink3)}
.ch-hrow .hw{margin-left:auto;flex:none;font-size:10.5px;font-weight:900;color:var(--ink3)}
.ch-note{margin-top:13px;background:var(--line2);border-radius:14px;padding:12px 14px;font-size:11.5px;font-weight:800;color:var(--ink2);line-height:1.7}
.ch-note b{color:var(--ink)}

/* ===== 보상 상점 ===== */
.sh-top{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#232651,#343873);border-radius:17px;padding:14px 16px;color:#fff;margin-bottom:13px}
.sh-coin{font-size:30px;flex:none}
.sh-tb{flex:1;min-width:0}
.sh-tb b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em}
.sh-tb span{font-size:11px;font-weight:800;color:rgba(255,255,255,.6)}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:560px){.sh-grid{grid-template-columns:1fr}}
.sh-it{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:7px}
.sh-it.owned{border-color:#BFE6CE;background:#F5FBF7}
.sh-ih{display:flex;align-items:center;gap:9px}
.sh-ii{width:38px;height:38px;border-radius:12px;background:var(--line2);display:grid;place-items:center;font-size:19px;flex:none}
.sh-in{flex:1;min-width:0}
.sh-in b{display:block;font-size:13px;font-weight:900;letter-spacing:-.02em}
.sh-in span{font-size:10.5px;font-weight:700;color:var(--ink3);line-height:1.4;display:block}
.sh-buy{width:100%;border:0;border-radius:11px;padding:9px;font-size:12px;font-weight:900;font-family:inherit;background:var(--lime);color:var(--lime-ink);cursor:pointer}
.sh-buy.off{background:var(--line2);color:var(--faint);cursor:not-allowed}
.sh-buy.own{background:var(--brand-s);color:var(--brand)}
.sh-have{font-size:10px;font-weight:900;background:var(--brand);color:#fff;border-radius:999px;padding:2px 7px;flex:none}
.sh-note{margin-top:12px;border:1px dashed var(--line);border-radius:14px;padding:11px 13px;font-size:11.5px;font-weight:800;color:var(--ink2);line-height:1.6}
.sh-tabs{display:flex;gap:6px;margin-bottom:11px}
.sh-tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:12.5px;font-weight:900;color:var(--ink3);font-family:inherit;cursor:pointer}
.sh-tab.on{background:#232651;border-color:#232651;color:#fff}
.sh-ship{font-size:10px;font-weight:900;color:var(--sky);background:var(--s-liveb,#E8F1FD);border-radius:999px;padding:2px 7px;display:inline-block;margin-top:2px}
.sh-stock{font-size:10px;font-weight:800;color:var(--ink3)}
.sh-stock b{color:#E23B3B}
.sh-ord{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-bottom:5px;background:var(--card)}
.sh-ord .oi{width:30px;height:30px;border-radius:10px;background:var(--line2);display:grid;place-items:center;font-size:15px;flex:none}
.sh-ord .ob{flex:1;min-width:0}
.sh-ord .ob b{display:block;font-size:12.5px;font-weight:900}
.sh-ord .ob span{font-size:10.5px;font-weight:700;color:var(--ink3)}
.sh-ord .os{flex:none;font-size:10px;font-weight:900;border-radius:999px;padding:3px 9px;background:var(--sun-s);color:var(--sun-ink)}
.sh-ord .os.done{background:var(--brand-s);color:var(--brand)}
/* 피드백 과정 스테퍼 */
.fbp{display:flex;align-items:flex-start;margin-bottom:12px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.fbp::-webkit-scrollbar{display:none}
.fbp-s{flex:none;width:62px;text-align:center}
.fbp-d{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 auto;border-radius:8px;background:var(--line2);color:var(--ink3);font-size:11px;font-weight:900}
.fbp-s.on .fbp-d{background:var(--brand);color:#fff}
.fbp-t{display:block;font-size:10px;font-weight:800;color:var(--ink3);margin-top:5px;line-height:1.25}
.fbp-s.on .fbp-t{color:var(--ink)}
.fbp-l{flex:none;width:16px;height:2.5px;background:var(--line2);border-radius:999px;margin-top:11px}
.fbp-l.on{background:var(--brand)}
/* ===== 선생님 피드백 카드 ===== */
.fb-list{display:flex;flex-direction:column;gap:9px}
.fb-card{background:#F4F7FF;border:1px solid #DCE4F7;border-radius:13px;padding:13px 14px}
.fb-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.fb-av{flex:none;width:28px;height:28px;border-radius:9px;background:var(--brand);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.fb-who{flex:1;min-width:0}
.fb-who b{font-size:12.5px;font-weight:900;color:var(--ink);display:block}
.fb-who span{font-size:10.5px;font-weight:700;color:var(--ink3)}
.fb-tg{flex:none;font-size:10.5px;font-weight:800;background:#fff;color:var(--ink2);padding:3px 9px;border-radius:999px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-tx{font-size:13px;color:var(--ink);line-height:1.65;font-weight:600}
.fb-tx b{font-weight:900}
.fb-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.fb-tag{font-size:10.5px;font-weight:800;background:var(--ok-s,#E6F6EA);color:#2FA84F;padding:3px 9px;border-radius:999px}
.fb-tag.warn{background:#FFF0DC;color:#B57B18}
.fb-act{display:flex;gap:7px;margin-top:11px}
.fb-act button{flex:1;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.fb-act button.sub{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.fb-empty{background:var(--bg);border-radius:12px;padding:14px;font-size:12.5px;color:var(--ink3);line-height:1.6}
.fb-empty b{color:var(--ink2)}
.fb-wait{margin-top:9px;background:#FFF6E6;border-radius:11px;padding:11px 13px;font-size:12px;color:#8A6310;font-weight:700}
.fb-wait b{color:#6B4D0C}
/* ===== 복습 센터 ===== */
.wordsheet.rv{max-width:520px}
.rvbody{align-items:stretch;text-align:left;padding:16px 20px 26px}
.rv-tabs{display:flex;gap:8px;margin-bottom:10px}
.rv-tab{flex:1;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:11px;font-size:13px;font-weight:800;color:var(--ink2);cursor:pointer;font-family:inherit}
.rv-tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.rv-tab b{margin-left:3px}
.rv-pers{display:flex;gap:6px;margin-bottom:14px}
.rv-per{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:6px 13px;font-size:12px;font-weight:800;color:var(--ink3);cursor:pointer;font-family:inherit}
.rv-per.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rv-cycle{background:var(--brand-s);border-radius:13px;padding:14px;margin-bottom:16px;font-size:12px;line-height:1.6}
.rv-cycle&gt;b{font-size:13px;color:var(--brand);display:block;margin-bottom:8px}
.rv-cyc-row{display:flex;gap:9px;align-items:flex-start;color:var(--ink2);margin-bottom:5px}
.rv-cyc-t{flex:none;font-size:10.5px;font-weight:900;background:var(--brand);color:#fff;padding:2px 8px;border-radius:999px;margin-top:1px}
.rv-cyc-row b{color:var(--ink)}
.rv-cyc-note{font-size:11px;color:var(--ink3);margin-top:7px;padding-top:7px;border-top:1px dashed rgba(58,61,143,.2)}
.rv-group{margin-bottom:18px}
.rv-gh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.rv-gh b{font-size:14px;font-weight:900;color:var(--ink)}
.rv-gh span{font-size:11.5px;font-weight:800;color:var(--ink3)}
.rv-go{margin-left:auto;border:0;background:var(--brand);color:#fff;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.rv-item{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rv-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rv-u{font-size:11px;font-weight:900;background:var(--card);color:var(--ink2);padding:3px 9px;border-radius:999px}
.rv-cnt{font-size:11px;font-weight:900;color:#C23A3A;background:#FBE4E4;padding:3px 8px;border-radius:999px}
.rv-dt{margin-left:auto;font-size:11px;font-weight:700;color:var(--faint)}
.rv-q{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.5}
.rv-why{font-size:12px;color:var(--ink3);margin-top:5px;font-weight:700}
.rv-again{font-size:11.5px;font-weight:800;color:#9A6310;background:#FFF3E0;border-radius:9px;padding:8px 11px;margin-top:8px;line-height:1.5}
.rv-item.w{padding:11px 14px}

/* 상품 구조 */
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:18px}
.pr-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
.pr-card.base{background:linear-gradient(145deg,var(--brand),var(--brand-d));color:#fff;border:0}
.pr-card .prt{font-size:12px;font-weight:900;opacity:.8}
.pr-card .prp{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:5px 0 10px}
.pr-card .prp em{font-style:normal;font-size:12px;font-weight:700;opacity:.7}
.pr-card ul{list-style:none;font-size:11.5px;line-height:1.9;font-weight:600}
.pr-card.base ul{color:rgba(255,255,255,.9)}
.pr-card:not(.base) ul{color:var(--ink2)}
.pr-card .prb{position:absolute;top:16px;right:16px;font-size:9.5px;font-weight:900;background:var(--lime);color:var(--lime-ink);padding:3px 9px;border-radius:999px}
.pr-note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-size:12.5px;color:var(--ink2);line-height:1.8}
.pr-note b{color:var(--brand)}

/* ===== AI 어시스턴트 (학생 챗봇) ===== */
.fab{position:fixed;right:26px;bottom:26px;z-index:94;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fabbtn{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#3A3D8F,#6B4FD0);box-shadow:0 10px 30px -6px rgba(58,61,143,.55);border:0;cursor:pointer;display:grid;place-items:center;position:relative;transition:.18s}
.fabbtn:hover{transform:scale(1.05)}
.fabbtn svg{width:27px;height:27px;stroke:#fff;fill:none;stroke-width:2}
.fabbtn .fbdg{position:absolute;top:-2px;right:-2px;background:var(--lime);color:#20233F;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;border:2px solid var(--bg)}
.fabtip{position:absolute;right:70px;bottom:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:12px 12px 2px 12px;white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.3);opacity:0;transform:translateX(8px);pointer-events:none;transition:.2s}
.fab:hover .fabtip{opacity:1;transform:translateX(0)}
.aiwin{position:fixed;right:26px;bottom:26px;z-index:95;width:375px;max-width:calc(100vw - 40px);height:560px;max-height:calc(100vh - 52px);background:var(--card);border-radius:20px;box-shadow:0 24px 60px -12px rgba(25,30,46,.45);display:none;flex-direction:column;overflow:hidden;animation:winup .22s ease}
.aiwin.show{display:flex}
@keyframes winup{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.aiwhd{background:linear-gradient(120deg,#2A2D6B,#3A3D8F);color:#fff;padding:15px 18px;display:flex;align-items:center;gap:11px}
.aiwhd .aiic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.aiwhd .aiic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.aiwhd b{font-size:14.5px;font-weight:900}.aiwhd .d{font-size:11px;opacity:.85}
.aiwhd .wx{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:900}
.chatw{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-weight:600}
.msg.a{align-self:flex-start}
.msg.a .ab{background:var(--bg);border-radius:14px 14px 14px 4px;padding:11px 13px;color:var(--ink2)}
.msg.a .ab b{color:var(--ink);font-weight:800}
.rec{border:1.5px solid var(--brand);border-radius:14px;overflow:hidden;margin-top:9px;background:#fff}
.rec .rh2{background:var(--brand-s);padding:9px 12px;font-size:12px;font-weight:900;color:var(--brand)}
.rec .ri{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2)}
.rec .ri .rtag{font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:5px;white-space:nowrap;flex:none}
.rec .ri .rn{flex:1;min-width:0}.rec .ri .rn b{font-size:12px;font-weight:800;display:block}.rec .ri .rn .rm{font-size:10px;color:var(--ink3)}
.rec .rwhy{font-size:11px;color:var(--ink3);padding:9px 12px;background:#FAFBFF;border-top:1px solid var(--line2);line-height:1.45}
.rec .rwhy b{color:var(--s-exam)}
.rec .slotq{padding:10px 12px;border-top:1px solid var(--line2);background:var(--lime-s)}
.rec .slotq .sqt{font-size:11px;font-weight:900;color:var(--lime-ink);margin-bottom:7px}
.rec .slotq .chips{gap:6px}
.rec .slotq .chip2{font-size:11px;padding:7px 12px}
.chipsrow{display:flex;gap:7px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid var(--line)}
.qchip{font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--ink2);cursor:pointer;border:1px solid var(--line)}
.qchip:hover{background:var(--brand-s);color:var(--brand);border-color:var(--brand-d)}
.inbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.inbar input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13px;font-family:inherit;outline:none;min-width:0}
.inbar input:focus{border-color:var(--brand-d)}
.inbar button{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:0 16px;font-weight:900;cursor:pointer}

.aimtabs .on{background:var(--brand);border-color:var(--brand);color:#fff}

.m-now .ld{width:9px;height:9px;border-radius:50%;background:var(--s-live);position:relative;flex:none}
.m-now .ld::after{content:&quot;&quot;;position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--s-live);opacity:.5;animation:rip 1.8s infinite}
.m-now .nb2{flex:1;min-width:0}

.m-now .nb2 .s{font-size:10.5px;opacity:.8}

/* 오늘 할 일 */
.m-td{list-style:none}
.m-td li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.m-td li:first-child{border-top:0}
.m-td .dot{width:9px;height:9px;border-radius:3px;flex:none}
.m-td .tb{flex:1;min-width:0}
.m-td .tb b{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-td .tb .ts{font-size:10px;color:var(--ink3)}
.m-td li.ext .tb b{color:var(--ink3);font-weight:600}
.m-td .lvb{font-size:9px;font-weight:900;color:#fff;background:var(--s-live);border-radius:999px;padding:1px 6px;flex:none}
.m-td .stb{font-size:12px;font-weight:900;color:#fff;background:var(--brand);border:0;border-radius:9px;padding:7px 14px;flex:none;white-space:nowrap}
.m-td .stb.live{background:var(--s-live)}
.m-td li{cursor:pointer}
.m-td .cb{width:24px;height:24px;border-radius:9px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center}
.m-td .cb.lock{border:0;background:none}
.m-td .cb.lock svg{width:15px;height:15px;stroke:var(--faint);fill:none;opacity:1}

.m-td .cb[disabled] svg{opacity:1;stroke:#fff}
.m-td .cb svg{width:12px;height:12px;stroke:#fff;stroke-width:3.5;opacity:0}
.m-td li.done .cb{background:var(--ok);border-color:var(--ok)}
.m-td li.done .cb svg{opacity:1}
.m-td li.done .tb b{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--ink3)}
/* 퀵버튼 */
.m-quick{display:flex;gap:8px;margin-bottom:11px}
.m-quick button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:11.5px;font-weight:800;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:5px}
.m-quick button .qi{font-size:17px}
/* 특강 레일 */
.m-tk{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
.m-tk::-webkit-scrollbar{display:none}
.m-tkb{flex:0 0 200px;border-radius:14px;padding:13px 14px;color:#fff;cursor:pointer}
.m-tkb .c1{font-size:9.5px;font-weight:900;opacity:.9}
.m-tkb b{font-size:13px;font-weight:900;display:block;margin-top:4px;line-height:1.3}
.m-tkb .w{font-size:10px;font-weight:800;opacity:.9;margin-top:7px}

.m-days::-webkit-scrollbar{display:none}
.m-days button{flex:1;min-width:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;font-size:11px;font-weight:800;color:var(--ink2)}
.m-days button .dd{display:block;font-size:9.5px;color:var(--faint);font-weight:700}
.m-days button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.m-days button.on .dd{color:rgba(255,255,255,.7)}
.m-pl{display:flex;flex-direction:column;gap:8px}
.m-blk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.m-blk .bar2{width:4px;align-self:stretch;border-radius:999px;flex:none}
.m-blk .bb{flex:1;min-width:0}
.m-blk .bb b{font-size:13px;font-weight:800;display:block}
.m-blk .bb .bs{font-size:10px;color:var(--ink3)}
.m-blk .tag2{font-size:9px;font-weight:900;border-radius:5px;padding:2px 6px;flex:none}
.m-blk.done{opacity:.55}
.m-blk.od{border-color:#F2B8B8;background:#FFF7F7}
.m-schrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.m-schip{font-size:10.5px;font-weight:800;color:#fff;border-radius:8px;padding:6px 10px}
/* 더보기 */
.m-menu{display:flex;flex-direction:column;gap:8px}
.m-mi{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer}
.m-demodiv{font-size:11px;font-weight:800;color:var(--ink3);background:var(--bg);border-radius:10px;padding:9px 13px;margin:14px 0 2px;text-align:center}

.m-mi .ar{margin-left:auto;color:var(--faint);font-weight:900}
.m-mi .mic{width:32px;height:32px;border-radius:10px;background:var(--brand-s);display:grid;place-items:center;font-size:15px;flex:none}

.m-tab{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:none;padding:7px 8px calc(9px + env(safe-area-inset-bottom))}

var CHAL={

   solvers:14,tries:187,
   steps:[

    {t:&#x27;각 직선의 x절편을 구함 (−2, 0), (10, 0)&#x27;,re:/x\s*절편|y\s*=\s*0|-2|10/,p:25},
    {t:&#x27;밑변 길이 12를 구함&#x27;,re:/12|밑변/,p:20},
    {t:&#x27;넓이 = ½ × 12 × 8 = 48&#x27;,re:/48/,p:25}

function trendLine(vals,unit,color){
 var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
 var rng=(max-min)||1, W=100, H=38;
 var pts=vals.map(function(v,i){var x=i/(vals.length-1)*W;var y=H-((v-min)/rng)*(H-8)-4;return [x,y];});
 var line=pts.map(function(p,i){return (i?&#x27;L&#x27;:&#x27;M&#x27;)+p[0].toFixed(1)+&#x27; &#x27;+p[1].toFixed(1);}).join(&#x27; &#x27;);
 var area=&#x27;M0 &#x27;+H+&#x27; &#x27;+pts.map(function(p){return &#x27;L&#x27;+p[0].toFixed(1)+&#x27; &#x27;+p[1].toFixed(1);}).join(&#x27; &#x27;)+&#x27; L&#x27;+W+&#x27; &#x27;+H+&#x27; Z&#x27;;
 var dots=pts.map(function(p,i){return &#x27;&lt;circle cx=&quot;&#x27;+p[0].toFixed(1)+&#x27;&quot; cy=&quot;&#x27;+p[1].toFixed(1)+&#x27;&quot; r=&quot;&#x27;+(i===pts.length-1?2.6:1.6)+&#x27;&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27;;}).join(&#x27;&#x27;);
 return &#x27;&lt;svg class=&quot;tl-svg&quot; viewBox=&quot;0 0 100 38&quot; preserveAspectRatio=&quot;none&quot;&gt;&lt;path d=&quot;&#x27;+area+&#x27;&quot; fill=&quot;&#x27;+color+&#x27;&quot; opacity=&quot;0.1&quot;/&gt;&lt;path d=&quot;&#x27;+line+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&#x27;+dots+&#x27;&lt;/svg&gt;&#x27;;
}

function engageScore(w){
 var attend = w.attend.reduce(function(a,c){return a+c;},0)/5;           /* 출석률 */
 var todo   = w.todo.total? w.todo.done/w.todo.total : 0;                /* 완료율 */
 var act    = Math.min(1,(w.vocab.learned/w.vocab.total*0.5)+(w.wrong.solved/Math.max(1,w.wrong.total)*0.5)); /* 학습활동 */
 return Math.round((attend*0.4 + todo*0.4 + act*0.2)*100);
}

/* NEIS 성적표 테이블 렌더 */
function neisTable(){
 var n=NEIS;
 var body=n.rows.map(function(r){
   if(r.head)return &#x27;&lt;tr class=&quot;nh&quot;&gt;&lt;td&gt;&#x27;+r.gyo+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+r.subj+&#x27;&lt;/td&gt;&lt;td&gt;원점수/과목평균(표준편차)&lt;/td&gt;&lt;td&gt;성취도(수강자수)&lt;/td&gt;&lt;td&gt;표준점수&lt;/td&gt;&lt;/tr&gt;&#x27;;
   var t=tScore(r.raw,r.avg,r.sd);
   var prev=n.prevRaw[r.subj];
   var dv=prev!=null?(r.raw-prev):null;
   var delta=dv!=null?&#x27;&lt;span class=&quot;&#x27;+(dv&gt;=0?&#x27;up&#x27;:&#x27;dn&#x27;)+&#x27;&quot;&gt;&#x27;+(dv&gt;=0?&#x27;▲&#x27;:&#x27;▼&#x27;)+Math.abs(dv)+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;;
   return &#x27;&lt;tr&#x27;+(r.weak?&#x27; class=&quot;wk&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;td&gt;&#x27;+r.gyo+&#x27;&lt;/td&gt;&lt;td&gt;&lt;b&gt;&#x27;+r.subj+&#x27;&lt;/b&gt;&lt;/td&gt;&#x27;+
     &#x27;&lt;td&gt;&#x27;+r.raw+&#x27; / &#x27;+r.avg+&#x27;&lt;span class=&quot;nsd&quot;&gt;(&#x27;+r.sd+&#x27;)&lt;/span&gt; &#x27;+delta+&#x27;&lt;/td&gt;&#x27;+
     &#x27;&lt;td&gt;&lt;span class=&quot;nach a-&#x27;+r.ach+&#x27;&quot;&gt;&#x27;+r.ach+&#x27;&lt;/span&gt; (&#x27;+r.n+&#x27;)&lt;/td&gt;&#x27;+
     &#x27;&lt;td class=&quot;nts&quot;&gt;&#x27;+t+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
 }).join(&#x27;&#x27;);
 return &#x27;&lt;div class=&quot;neis&quot;&gt;&lt;div class=&quot;neis-hd&quot;&gt;&lt;b&gt;6. 교과학습발달상황&lt;/b&gt;&lt;span&gt;&#x27;+n.school+&#x27; · &#x27;+n.grade+&#x27;학년 &#x27;+n.term+&#x27;학기 · &#x27;+n.name+&#x27; (&#x27;+n.classInfo+&#x27;)&lt;/span&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;neis-wrap&quot;&gt;&lt;table class=&quot;neis-t&quot;&gt;&#x27;+body+&#x27;&lt;/table&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;neis-ft&quot;&gt;※ 성취도 A(90↑) B(80↑) C(70↑) D(60↑) E / 표준점수 = 50+10×(원점수−평균)÷표준편차 · NEIS 교과학습발달상황 양식&lt;/div&gt;&lt;/div&gt;&#x27;;
}

function examHistoryTabs(){

function examSheet(){
 var e=EXAM_HISTORY[curExamIdx];
 if(e.free){ /* 자유학기 — P */
   return &#x27;&lt;div class=&quot;eh-sheet&quot;&gt;&lt;div class=&quot;eh-sh&quot;&gt;&lt;b&gt;&#x27;+e.key+&#x27; 성적표&lt;/b&gt;&lt;span&gt;중&#x27;+e.grade+&#x27; · 자유학기&lt;/span&gt;&lt;/div&gt;&#x27;+
     &#x27;&lt;div class=&quot;eh-free&quot;&gt;🟢 &#x27;+e.note+&#x27;&lt;div class=&quot;eh-freed&quot;&gt;자유학기제는 지필평가(원점수·석차)가 없어요. 과정 중심 평가로 &lt;b&gt;이수(P)&lt;/b&gt;만 기록돼요.&lt;/div&gt;&lt;/div&gt;&#x27;+
     &#x27;&lt;div class=&quot;eh-rows&quot;&gt;&#x27;+e.rows.map(function(r){return &#x27;&lt;div class=&quot;eh-row free&quot;&gt;&lt;span class=&quot;eh-sub&quot;&gt;&#x27;+r[0]+&#x27;&lt;/span&gt;&lt;span class=&quot;eh-p&quot;&gt;P · 이수&lt;/span&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
 }
 /* 지필평가 — 원점수/과목평균(표준편차)/성취도/표준점수 */
 var prevE=null; for(var k=curExamIdx-1;k&gt;=0;k--){if(!EXAM_HISTORY[k].free){prevE=EXAM_HISTORY[k];break;}}
 var head=&#x27;&lt;div class=&quot;eh-row head&quot;&gt;&lt;span&gt;과목&lt;/span&gt;&lt;span&gt;원점수/평균(편차)&lt;/span&gt;&lt;span&gt;성취도&lt;/span&gt;&lt;span&gt;표준점수&lt;/span&gt;&lt;/div&gt;&#x27;;
 var body=e.rows.map(function(r){
   var raw=r[1],avg=r[2],sd=r[3];
   var t=tScore(raw,avg,sd), ach=achGrade(raw);
   var dv=null; if(prevE){var pr=prevE.rows.filter(function(x){return x[0]===r[0];})[0];if(pr&amp;&amp;typeof pr[1]===&#x27;number&#x27;)dv=raw-pr[1];}
   var delta=dv!=null?&#x27;&lt;em class=&quot;&#x27;+(dv&gt;=0?&#x27;u&#x27;:&#x27;d&#x27;)+&#x27;&quot;&gt;&#x27;+(dv&gt;=0?&#x27;▲&#x27;:&#x27;▼&#x27;)+Math.abs(dv)+&#x27;&lt;/em&gt;&#x27;:&#x27;&#x27;;
   var weak=raw&lt;avg;
   return &#x27;&lt;div class=&quot;eh-row&#x27;+(weak?&#x27; weak&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;span class=&quot;eh-sub&quot;&gt;&#x27;+r[0]+&#x27;&lt;/span&gt;&#x27;+
     &#x27;&lt;span class=&quot;eh-raw&quot;&gt;&lt;b&gt;&#x27;+raw+&#x27;&lt;/b&gt; / &#x27;+avg+&#x27;&lt;i&gt;(&#x27;+sd+&#x27;)&lt;/i&gt; &#x27;+delta+&#x27;&lt;/span&gt;&#x27;+
     &#x27;&lt;span&gt;&lt;span class=&quot;eh-ach a-&#x27;+ach+&#x27;&quot;&gt;&#x27;+ach+&#x27;&lt;/span&gt;&lt;/span&gt;&#x27;+
     &#x27;&lt;span class=&quot;eh-ts&quot;&gt;&#x27;+t+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
 }).join(&#x27;&#x27;);
 return &#x27;&lt;div class=&quot;eh-sheet&quot;&gt;&lt;div class=&quot;eh-sh&quot;&gt;&lt;b&gt;&#x27;+e.key+&#x27; 성적표&lt;/b&gt;&lt;span&gt;중&#x27;+e.grade+&#x27; · 평균 &#x27;+e.avg+&#x27;점 · NEIS 양식&lt;/span&gt;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;eh-rows&quot;&gt;&#x27;+head+body+&#x27;&lt;/div&gt;&#x27;+
   &#x27;&lt;div class=&quot;eh-ft&quot;&gt;※ 원점수/과목평균(표준편차) · 성취도 A~E · 표준점수=50+10×(원점수−평균)÷편차. ▲▼는 지난 지필 대비.&lt;/div&gt;&lt;/div&gt;&#x27;;
}

/* ===== 할 일 → 실제 화면 라우팅 (모든 종류가 실제로 열림) ===== */
function todoSubj(title){ /* 제목에서 과목 추출 */
 if(/수학|쎈|함수|방정식|도형/.test(title))return &#x27;수학&#x27;;
 if(/영어|영독해|영문법|Reading|단어|영단어/.test(title))return &#x27;영어&#x27;;
 if(/국어|문해력|문법|독해/.test(title))return &#x27;국어&#x27;;
 if(/과학|물리|화학/.test(title))return &#x27;과학&#x27;;
 if(/사회|경제|역사/.test(title))return &#x27;사회&#x27;;
 return &#x27;수학&#x27;;
}
/* 과목별 담당 강사·교재 — 블록 상세가 과목에 맞게 나오도록 */
var SUBJMETA={
 &#x27;수학&#x27;:{t:&#x27;박현우 쌤&#x27;,book:&#x27;개념원리 중2-2&#x27;},
 &#x27;영어&#x27;:{t:&#x27;제니 쌤&#x27;,book:&#x27;동아(윤) 중2&#x27;},
 &#x27;국어&#x27;:{t:&#x27;이수진 쌤&#x27;,book:&#x27;비상 중2-2&#x27;},
 &#x27;과학&#x27;:{t:&#x27;한도윤 쌤&#x27;,book:&#x27;비상 중2 과학&#x27;},
 &#x27;사회&#x27;:{t:&#x27;정민아 쌤&#x27;,book:&#x27;미래엔 중2 사회&#x27;}
};
function subjMeta(title){return SUBJMETA[todoSubj(title)]||SUBJMETA[&#x27;수학&#x27;];}
/* 지금 연 학습이 어느 투두였는지 기억 → 학습을 끝내면 그 투두를 자동 완료 */
var curTodoIdx=-1;
function setCurTodo(i){curTodoIdx=i;}
function completeTodo(){
 if(curTodoIdx&lt;0)return;
 var b=BLK[curTodoIdx];
 var st=b[6]=b[6]||{};
 if(!st.done){
   st.done=1;
   /* XP 획득 — 레벨업 체크 */
   var gain=xpOf(b[5]);
   var beforeTier=curTier();
   GAME.xp+=gain; GAME.weekXp+=gain;
   var lvUp=false;
   while(GAME.xp&gt;=GAME.need){GAME.xp-=GAME.need;GAME.level++;GAME.need=Math.round(GAME.need*1.15);lvUp=true;}
   var evolved=(curTier()!==beforeTier);
   buildGrid&amp;&amp;buildGrid();buildTodo&amp;&amp;buildTodo();
   xpToast(gain,lvUp,evolved);
 }
 curTodoIdx=-1;
}
/* XP 획득 토스트 (레벨업이면 강조) */
function xpToast(gain,lvUp,evolved){
 var d=document.getElementById(&#x27;xpPop&#x27;);
 if(!d){d=document.createElement(&#x27;div&#x27;);d.id=&#x27;xpPop&#x27;;d.className=&#x27;xppop&#x27;;document.body.appendChild(d);}
 var t=curTier();
 d.innerHTML=evolved
  ? &#x27;&lt;div class=&quot;xp-evo&quot;&gt;&#x27;+t.ic+&#x27;&lt;/div&gt;&lt;div class=&quot;xp-lv&quot;&gt;진화! &#x27;+t.n+&#x27;&lt;/div&gt;&lt;div class=&quot;xp-lv2&quot;&gt;Lv.&#x27;+GAME.level+&#x27; 달성 — &#x27;+t.d+&#x27;&lt;/div&gt;&#x27;
  : lvUp
  ? &#x27;&lt;div class=&quot;xp-lv&quot;&gt;🎉 LEVEL UP!&lt;/div&gt;&lt;div class=&quot;xp-lv2&quot;&gt;Lv.&#x27;+GAME.level+&#x27; 달성 · +&#x27;+gain+&#x27; XP&lt;/div&gt;&#x27;
  : &#x27;&lt;div class=&quot;xp-g&quot;&gt;+&#x27;+gain+&#x27; XP&lt;/div&gt;&lt;div class=&quot;xp-s&quot;&gt;잘했어! 다음 미션 가자&lt;/div&gt;&#x27;;
 d.classList.remove(&#x27;show&#x27;);void d.offsetWidth;d.classList.add(&#x27;show&#x27;);
 clearTimeout(window._xpT);window._xpT=setTimeout(function(){d.classList.remove(&#x27;show&#x27;);},evolved?2800:2000);
}
/* 종이 교재 판별 — 쎈·RPM·개념원리 등이나 &quot;p.00&quot; 페이지 표기 = 아이가 책으로 직접 풂 (앱 채점 불가) */
function isPaper(title){
 return /쎈|RPM|알피엠|개념원리|일품|마플|블랙라벨|자이스토리|교과서|익힘|워크북|워크시트|p\.?\s?\d/.test(title);
}
function todoOpen(b,i){
 var t=b[3], sub=todoSubj(t);
 switch(b[5]){
   case &#x27;word&#x27;:  return &#x27;setCurTodo(&#x27;+i+&#x27;);openWord()&#x27;;
   case &#x27;check&#x27;: return &quot;setCurTodo(&quot;+i+&quot;);openCheck(&#x27;&quot;+sub+&quot;&#x27;)&quot;;
   case &#x27;prob&#x27;:  return isPaper(t)
     ? &quot;setCurTodo(&quot;+i+&quot;);openPaper(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;)&quot;       /* 종이 교재 → 다 풀었어요 + 메모 */
     : &quot;setCurTodo(&quot;+i+&quot;);openSolve(&#x27;&quot;+sub+&quot;&#x27;,&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;)&quot;; /* 앱 문제은행 → 풀기 */
   case &#x27;live&#x27;:  return (b[6]&amp;&amp;b[6].live)? &#x27;openDlg(&#x27;+i+&#x27;)&#x27; : &quot;setCurTodo(&quot;+i+&quot;);openLec(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;,&#x27;live&#x27;)&quot;;
   case &#x27;lec&#x27;:   return &quot;setCurTodo(&quot;+i+&quot;);openLec(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;,&#x27;lec&#x27;)&quot;;
   case &#x27;exam&#x27;:  return &quot;setCurTodo(&quot;+i+&quot;);openExam(&#x27;&quot;+t.replace(/&#x27;/g,&#x27;&#x27;)+&quot;&#x27;)&quot;;
   default:      return &#x27;openDlg(&#x27;+i+&#x27;)&#x27;;
 }

    var chkBtn;

    else if(paper &amp;&amp; !st.done){chkBtn=&#x27;&lt;button class=&quot;cb&quot; onclick=&quot;event.stopPropagation();setCurTodo(&#x27;+x.i+&#x27;);openPaper(\&#x27;&#x27;+b[3].replace(/&#x27;/g,&#x27;&#x27;)+&#x27;\&#x27;)&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M4 12l5 5L20 6&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;&#x27;;}
    else{chkBtn=&#x27;&lt;button class=&quot;cb&quot; onclick=&quot;event.stopPropagation();tgl(&#x27;+x.i+&#x27;)&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M4 12l5 5L20 6&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;&#x27;;}
    return &#x27;&lt;li class=&quot;&#x27;+(st.done?&#x27;done &#x27;:&#x27;&#x27;)+(st.ext?&#x27;ext&#x27;:&#x27;&#x27;)+&#x27;&quot; onclick=&quot;&#x27;+open+&#x27;&quot;&gt;&#x27;+
      &#x27;&lt;span class=&quot;dot&quot; style=&quot;background:var(&#x27;+sk[1]+&#x27;)&quot;&gt;&lt;/span&gt;&#x27;+
      &#x27;&lt;div class=&quot;tb&quot;&gt;&lt;b&gt;&#x27;+b[3]+&#x27;&lt;/b&gt;&lt;div class=&quot;ts&quot;&gt;&#x27;+b[4]+&#x27; · &#x27;+sk[0]+(st.ai?&#x27; · AI 담음&#x27;:&#x27;&#x27;)+(autoLearn&amp;&amp;!st.done?&#x27; · 학습 완료 시 체크&#x27;:&#x27;&#x27;)+(paper&amp;&amp;!st.done?&#x27; · 책으로 직접 풀기&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;+

  }).join(&#x27;&#x27;);
  document.getElementById(&#x27;mToday&#x27;).innerHTML=h;
  document.getElementById(&#x27;mTdCnt&#x27;).textContent=done+&#x27;/&#x27;+tot+&#x27; 완료&#x27;;
  var pct=tot?Math.round(done/tot*100):0;
  document.getElementById(&#x27;mProg&#x27;).style.width=pct+&#x27;%&#x27;;
  document.getElementById(&#x27;mProgTxt&#x27;).textContent=tot+&#x27;개 중 &#x27;+done+&#x27;개 완료&#x27;;
  document.getElementById(&#x27;mHeroTxt&#x27;).textContent=pct&gt;=100?&#x27;오늘 공부 끝! 🎉&#x27;:(pct&gt;=50?&#x27;절반 넘었어, 가보자 ✊&#x27;:&#x27;오늘 할 일 가보자 ✊&#x27;);
  /* 요일 칩 */
  document.getElementById(&#x27;mDays&#x27;).innerHTML=DAYS.map(function(d,i){
    return &#x27;&lt;button class=&quot;&#x27;+(i===mDay?&#x27;on&#x27;:&#x27;&#x27;)+&#x27;&quot; onclick=&quot;mSetDay(&#x27;+i+&#x27;)&quot;&gt;&#x27;+d[0]+&#x27;&lt;span class=&quot;dd&quot;&gt;&#x27;+d[1]+(i===TODAY?&#x27;·오늘&#x27;:&#x27;&#x27;)+&#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;}).join(&#x27;&#x27;);
  /* 선택 요일 학교일정 */
  document.getElementById(&#x27;mSch&#x27;).innerHTML=(SCH[mDay]||[]).map(function(c,j){
    return &#x27;&lt;span class=&quot;m-schip&quot; style=&quot;background:var(&#x27;+(c.k===&#x27;perf&#x27;?&#x27;--s-prob&#x27;:&#x27;--s-exam&#x27;)+&#x27;)&quot; onclick=&quot;openSch(&#x27;+mDay+&#x27;,&#x27;+j+&#x27;)&quot;&gt;&#x27;+c.t+&#x27;&lt;/span&gt;&#x27;;}).join(&#x27;&#x27;);
  /* 선택 요일 블록 */
  var dayItems=BLK.map(function(b,i){return{b:b,i:i};}).filter(function(x){return x.b[0]===mDay;})
    .sort(function(a,z){return a.b[1]-z.b[1];});
  document.getElementById(&#x27;mPlanList&#x27;).innerHTML=dayItems.length?dayItems.map(function(x){
    var b=x.b,sk=SUB[b[5]],st=b[6]||{},over=isOverdue(b);
    var tag=st.live?&#x27;&lt;span class=&quot;tag2&quot; style=&quot;background:var(--s-live);color:#fff&quot;&gt;LIVE&lt;/span&gt;&#x27;
      :(over?&#x27;&lt;span class=&quot;tag2&quot; style=&quot;background:#E23B3B;color:#fff&quot;&gt;미완료&lt;/span&gt;&#x27;
      :(st.ai?&#x27;&lt;span class=&quot;tag2&quot; style=&quot;background:#7B61F2;color:#fff&quot;&gt;AI&lt;/span&gt;&#x27;
      :(b[5]===&#x27;live&#x27;?&#x27;&lt;span class=&quot;tag2&quot; style=&quot;background:var(--s-livet);color:var(--s-live)&quot;&gt;자동편성&lt;/span&gt;&#x27;:&#x27;&#x27;)));
    return &#x27;&lt;div class=&quot;m-blk&#x27;+(st.done?&#x27; done&#x27;:&#x27;&#x27;)+(over?&#x27; od&#x27;:&#x27;&#x27;)+&#x27;&quot; onclick=&quot;openDlg(&#x27;+x.i+&#x27;)&quot;&gt;&#x27;+
      &#x27;&lt;span class=&quot;bar2&quot; style=&quot;background:var(&#x27;+sk[1]+&#x27;)&quot;&gt;&lt;/span&gt;&#x27;+
      &#x27;&lt;div class=&quot;bb&quot;&gt;&lt;b&gt;&#x27;+b[3]+&#x27;&lt;/b&gt;&lt;div class=&quot;bs&quot;&gt;&#x27;+b[4]+&#x27; · &#x27;+sk[0]+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;+tag+&#x27;&lt;/div&gt;&#x27;;
  }).join(&#x27;&#x27;):&#x27;&lt;div style=&quot;text-align:center;color:var(--faint);font-size:12px;font-weight:700;padding:26px 0&quot;&gt;이 날은 비어 있어요 — 튜터에게 물어서 담아봐&lt;/div&gt;&#x27;;

    return &#x27;&lt;div class=&quot;m-tkb&quot; style=&quot;background:&#x27;+t.g+&#x27;&quot; onclick=&quot;teukApply(&#x27;+i+&#x27;)&quot;&gt;&lt;div class=&quot;c1&quot;&gt;&#x27;+t.cat+&#x27;&lt;/div&gt;&lt;b&gt;&#x27;+t.tit+&#x27;&lt;/b&gt;&lt;div class=&quot;w&quot;&gt;🗓 &#x27;+t.when+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;);}
  /* 더보기 메뉴 */
  var mn=document.getElementById(&#x27;mMenu&#x27;);
  if(mn&amp;&amp;!mn.childElementCount){
    /* 학생이 실제로 쓰는 메뉴 */
    var M=[[&#x27;👤&#x27;,&#x27;내 정보·학교·레벨&#x27;,&#x27;onboard&#x27;],[&#x27;📈&#x27;,&#x27;성적·성장&#x27;,&#x27;grades&#x27;],[&#x27;📣&#x27;,&#x27;개념특강&#x27;,&#x27;live&#x27;],[&#x27;🎬&#x27;,&#x27;다시보기&#x27;,&#x27;replay&#x27;],[&#x27;✏️&#x27;,&#x27;문제풀이&#x27;,&#x27;prob&#x27;],[&#x27;⭐&#x27;,&#x27;특강&#x27;,&#x27;special&#x27;]];

/* ===== 모바일 게임바 — PC 게임바와 같은 GAME 데이터를 좁은 화면용으로 ===== */
function renderGameBarM(){
  var el=document.getElementById(&#x27;mGameBar&#x27;); if(!el||typeof GAME===&#x27;undefined&#x27;)return;
  var ms=todayMissions();
  var done=ms.filter(function(x){return (x.b[6]||{}).done;}).length, tot=ms.length;
  var restXp=ms.reduce(function(a,x){return a+((x.b[6]||{}).done?0:xpOf(x.b[5]));},0);
  var pct=Math.round(GAME.xp/GAME.need*100);

    var st=x.b[6]||{};

      &#x27;&lt;div class=&quot;d&quot;&gt;&#x27;+(n.p&gt;=100?&#x27;🏁&#x27;:n.p&gt;0?n.p:&#x27;🔒&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;n&quot;&gt;&#x27;+n.u+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;

        &#x27;&lt;div class=&quot;mg-nm&quot;&gt;Lv.&#x27;+GAME.level+&#x27; &lt;em&gt;&#x27;+t.n+&#x27;&lt;/em&gt;&lt;/div&gt;&#x27;+
        &#x27;&lt;div class=&quot;mg-bar&quot;&gt;&lt;i style=&quot;width:&#x27;+pct+&#x27;%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&#x27;+

      &#x27;&lt;div class=&quot;mg-fire&quot;&gt;&lt;div class=&quot;f&quot;&gt;🔥&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&#x27;+GAME.streak+&#x27;&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;연속&lt;/div&gt;&lt;/div&gt;&#x27;+
    &#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;mg-mh&quot;&gt;🎯 오늘의 미션&lt;span class=&quot;c&quot;&gt;&#x27;+done+&#x27;/&#x27;+tot+&#x27;&lt;/span&gt;&#x27;+

    &#x27;&lt;/div&gt;&#x27;+
    &#x27;&lt;div class=&quot;mg-btns&quot;&gt;&#x27;+
      &#x27;&lt;button onclick=&quot;openLeague()&quot;&gt;&#x27;+LEAGUE.tier.ic+&#x27; 주간 리그&lt;b&gt;20명 중 &#x27;+myLeagueRank()+&#x27;위&lt;/b&gt;&lt;/button&gt;&#x27;+

    &#x27;&lt;/div&gt;&#x27;+

      &#x27;&lt;span class=&quot;r&quot;&gt;&#x27;+Object.keys(GAME.conquest).map(function(s){

      &#x27;&lt;div class=&quot;mg-path&quot;&gt;&#x27;+nodes+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;+
  &#x27;&lt;/div&gt;&#x27;;
}

body{font-family:Pretendard,&quot;Noto Sans KR&quot;,system-ui,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.01em;line-height:1.5;min-height:100vh;padding:24px 18px 50px}
button{font:inherit;cursor:pointer}

.top{max-width:1180px;margin:0 auto 18px;text-align:center}
.top h1{font-size:21px;font-weight:900;letter-spacing:-.02em}
.top p{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:4px}
.legend{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--ink2)}
.lg i{width:9px;height:9px;border-radius:3px}

.btns{max-width:1180px;margin:0 auto 20px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.sim{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 15px;transition:.14s;min-width:168px;text-align:left}
.sim:hover{border-color:var(--brand-d);transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(58,61,143,.3)}
.sim b{font-size:12.5px;font-weight:900}
.sim .s{font-size:10px;font-weight:800;border-radius:5px;padding:1px 7px}
.sim .s.a{background:var(--ok-s);color:var(--ok)}
.sim .s.c{background:var(--coach-s);color:var(--coach)}
.sim .s.h{background:var(--hide-s);color:var(--hide)}
.sim .s.d{background:#EEF0FB;color:#5A5FC7}
.sim.dg{border-color:#5A5FC7;background:#F5F6FE}
.sim.dg:hover{border-color:#5A5FC7}

.wrap{max-width:1180px;margin:0 auto;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.col .who{font-size:13px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:7px}
.col .who .av{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}

.phone{width:375px;max-width:92vw;background:#111826;border-radius:42px;padding:11px;box-shadow:0 26px 60px -18px rgba(17,24,38,.45)}
.scr{border-radius:33px;overflow:hidden;position:relative;height:720px;display:flex;flex-direction:column}
.scr.stu{background:#F4F6FB}
.scr.par{background:var(--kbg)}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;font-size:12px;font-weight:800}
.scr.par .status{color:#1A2733}
.status .notch{width:104px;height:22px;background:#111826;border-radius:999px;position:absolute;left:50%;transform:translateX(-50%);top:8px}
.list{flex:1;overflow-y:auto;padding:6px 12px 20px;-ms-overflow-style:none;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}

/* 학생 폰 — 알림 센터 */
.sh{display:flex;align-items:center;gap:9px;padding:8px 6px 10px}
.sh .mk{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.sh .mk svg{width:20px;height:20px}
.sh b{font-size:16px;font-weight:900}
.sh .cnt{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ink3)}
.sec{font-size:11px;font-weight:900;color:var(--ink3);margin:10px 6px 7px;letter-spacing:.02em}
.ncard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;animation:drop .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.ncard .nic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:10.5px;font-weight:900;color:#fff}
.ncard.push .nic{background:var(--push)}
.ncard.good .nic{background:var(--ok)}
.ncard.rmd .nic{background:#8C5BC2}
.ncard .nb{flex:1;min-width:0}
.ncard .nt{font-size:12.5px;font-weight:900;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ncard .nm{font-size:11.5px;color:var(--ink2);line-height:1.45;margin-top:2px}
.ncard .nx{font-size:9.5px;color:var(--faint);font-weight:800;margin-top:4px}
.rid{font-size:8.5px;font-weight:900;border-radius:4px;padding:1px 5px;background:var(--brand-s);color:var(--brand)}
.empty{text-align:center;color:var(--faint);font-size:11.5px;font-weight:700;padding:30px 10px;line-height:1.7}

/* 학부모 폰 — 카톡 */
.kh{display:flex;align-items:center;gap:9px;padding:9px 6px 10px;color:#13202C}
.kh .back{font-size:17px;font-weight:900}
.kh .kav{width:34px;height:34px;border-radius:13px;background:var(--brand);display:grid;place-items:center}
.kh .kav svg{width:21px;height:21px}
.kh b{font-size:15px;font-weight:900}
.kh .kch{font-size:9.5px;font-weight:900;background:var(--kakao);color:var(--kakao-ink);border-radius:5px;padding:1px 6px;margin-left:2px}
.kday{text-align:center;margin:4px auto 10px;background:rgba(0,0,0,.14);color:#fff;font-size:10px;font-weight:700;padding:3px 11px;border-radius:999px;width:fit-content}
.krow{display:flex;gap:7px;margin-bottom:11px;align-items:flex-end;animation:drop .35s cubic-bezier(.2,.9,.3,1.15)}
.krow .kav2{width:32px;height:32px;border-radius:12px;background:var(--brand);flex:none;display:grid;place-items:center;align-self:flex-start}
.krow .kav2 svg{width:20px;height:20px}
.krow .kb{max-width:74%}
.krow .kn{font-size:10px;color:#2A3B4A;font-weight:700;margin-bottom:3px}
.kbub{background:#fff;border-radius:4px 14px 14px 14px;padding:11px 12px;font-size:12px;line-height:1.5;color:#13202C;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.kbub .kt{font-weight:900;display:block;margin-bottom:3px;color:var(--brand)}
.kbub .kbtn{display:block;text-align:center;margin-top:9px;padding:9px;background:var(--brand-s);color:var(--brand);border-radius:8px;font-weight:800;font-size:11.5px}
.kbub .rid{margin-left:4px}
.ktm{font-size:9px;color:#36475A;opacity:.8;font-weight:700;white-space:nowrap}
/* 상태 연출 */
.kpend .kbub{background:var(--coach-s);border:1.5px dashed #E4C08A;color:#7A5410}
.kpend .kbub .kt{color:var(--coach)}
.kghost .kbub{background:rgba(255,255,255,.55);border:1.5px dashed rgba(90,99,119,.5);color:#5A6377}
.kghost .kbub .kt{color:#5A6377}
.krep .kbub{outline:2px solid var(--ok)}
/* 주간 리포트 모달 */
.nrovl{position:fixed;inset:0;background:rgba(20,22,40,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.nrovl.show{display:flex}
.nrsheet{background:var(--card,#fff);width:100%;max-width:460px;max-height:90vh;border-radius:20px;overflow-y:auto;position:relative;animation:nrup .25s ease}
@keyframes nrup{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.nrx{position:absolute;top:14px;right:14px;z-index:2;border:0;background:rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer}
.nr-hd{background:linear-gradient(135deg,#3A3D8F,#5457B5);color:#fff;padding:24px 24px 20px}
.nr-kick{font-size:11px;font-weight:800;opacity:.85}
.nr-hd h2{font-size:20px;font-weight:900;margin:10px 0 8px;color:#fff}
.nr-sub{font-size:12.5px;opacity:.9}
.nr-sec{padding:18px 24px;border-bottom:1px solid var(--line,#E7EAF0)}
.nr-sec.next{background:var(--brand-s,#EEF0FB)}
.nr-st{font-size:12.5px;font-weight:900;color:var(--ink,#1C2033);margin-bottom:12px}
.nr-facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.nrf{background:var(--bg,#F7F8FA);border-radius:12px;padding:12px 8px;text-align:center}
.nrf-v{font-size:16px;font-weight:900;color:var(--brand,#3A3D8F)}
.nrf-l{font-size:10.5px;color:var(--ink3,#8C96AD);font-weight:700;margin-top:3px}
.nrm{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nrm-u{flex:0 0 92px;font-size:12.5px;font-weight:800;color:var(--ink,#1C2033)}
.nrm-u em{font-size:10px;color:var(--ink3,#8C96AD);font-style:normal;margin-left:4px}
.nrm-bar{flex:1;height:8px;background:var(--line2,#EEF1F6);border-radius:999px;overflow:hidden}
.nrm-bar i{display:block;height:100%;border-radius:999px}
.nrm-v{flex:0 0 62px;text-align:right;font-size:12.5px;font-weight:900;color:var(--ink,#1C2033)}
.nrm-v b{font-size:10px;margin-left:2px}
.nr-note{font-size:11px;color:var(--ink3,#8C96AD);margin-top:10px;line-height:1.5}
.nr-p{font-size:13.5px;color:var(--ink2,#55607A);line-height:1.7}.nr-p b{color:var(--ink,#1C2033);font-weight:800}
.nr-foot{font-size:11px;color:var(--ink3,#8C96AD);line-height:1.6;padding:16px 24px;background:var(--bg,#F7F8FA)}
