/* === 학습 이해도 대시보드 === */
.mst-sum{display:flex;gap:10px;margin:0 0 16px}
.mss{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:.12s}
.mss:hover{border-color:var(--brand)}
.mss.on{border-color:var(--brand);background:var(--brand-s)}
.mss b{font-size:22px;font-weight:900;color:var(--ink);display:block}
.mss span{font-size:11px;font-weight:800;color:var(--ink3)}
.mss.risk b{color:#D64545}.mss.warn b{color:#B5731A}.mss.ok b{color:#1F9D64}
.mst-list{display:flex;flex-direction:column;gap:11px}
.mcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px 16px 22px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:.12s;flex-wrap:wrap}
.mcard:hover{box-shadow:0 8px 24px -14px rgba(25,30,46,.3)}
.mcard.risk{border-color:#F2C4C4}.mcard.warn{border-color:#F0D9AE}
.mc-dot{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:15px 0 0 15px}
.mc-dot.risk{background:#D64545}.mc-dot.warn{background:#E0A94B}.mc-dot.ok{background:#1F9D64}
.mc-av{width:42px;height:42px;border-radius:12px;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-size:15px;font-weight:900;flex:none}
.mc-mid{flex:1;min-width:0}
.mc-n{font-size:15px;font-weight:900;color:var(--ink)}
.mc-g{font-size:11.5px;font-weight:700;color:var(--ink3)}
.mc-concept{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.mcc{font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 8px}
.mcc.u{background:var(--ok-s);color:#1F9D64}.mcc.d{background:#FDECEC;color:#D64545}
.mc-sigs{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.msig{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:7px;line-height:1.35}
.msig.up{background:var(--ok-s);color:#157A4C}
.msig.down{background:#FDECEC;color:#C13838}
.msig.risk{background:#FDE6E6;color:#B82E2E;font-weight:800}
.msig.warn{background:#FFF3E0;color:#9A6310}
.mc-right{text-align:center;flex:none}
.mc-eng{font-size:24px;font-weight:900;line-height:1}
.mc-eng.risk{color:#D64545}.mc-eng.warn{color:#B5731A}.mc-eng.ok{color:#1F9D64}
.mc-el{font-size:10px;color:var(--ink3);font-weight:700;margin-top:2px}
.mc-trace{display:none;flex-basis:100%;margin-top:4px;background:var(--bg);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.mc-trace.show{display:block}
.mc-trace .mtr-h{font-size:11px;font-weight:900;color:var(--ink);margin-bottom:6px}
.mc-trace .mtr-stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mc-trace .mtr-stats span{font-size:11px;font-weight:800;background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:4px 10px;color:var(--ink2)}
.mc-trace .mtr-act{display:flex;gap:8px;margin-top:12px}
.mc-trace .mtr-act button{font-size:12.5px;font-weight:800;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit}
.mc-trace .mtr-act button.sub{background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.scard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;display:flex;gap:16px;align-items:flex-start;cursor:pointer;transition:.12s}
.scard:hover{border-color:var(--brand-d);box-shadow:0 6px 18px -10px rgba(58,61,143,.3)}
.scard .sav{width:44px;height:44px;border-radius:12px;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:16px;flex:none}
.scard.risk .sav{background:var(--s-examt);color:var(--s-exam)}
.scard .smid{flex:1;min-width:0}
.scard .sname{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;flex-wrap:wrap}
.scard .sgrade{font-size:11.5px;font-weight:700;color:var(--ink3)}
.scard .sflag{font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px}
.scard .sflag.risk{background:var(--s-examt);color:var(--s-exam)}
.scard .sflag.ok{background:var(--ok-s);color:var(--ok)}
.adbadge{font-size:9.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:#EEE9FC;color:#7B61F2}
.adbadge.hw{background:#E8F1FE;color:#2E7CF0}
.adbadge.co{background:#FFF3E3;color:#C97A1E}
.scard .scall{font-size:11.5px;font-weight:800;color:#C97A1E;background:#FFF3E3;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px}
.scard .stodo{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.scard .trow{display:flex;align-items:center;gap:8px;font-size:12px}
.scard .trow .tlbl{font-size:10px;font-weight:900;color:var(--faint);width:36px;flex:none}
.scard .trow .titem{color:var(--ink2)}
.scard .trow .titem .done{color:var(--faint);text-decoration:line-through}
.scard .trow .mini{font-size:10px;color:var(--faint)}
.scard .sright{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.scard .sbtn{font-size:11.5px;font-weight:900;padding:8px 13px;border-radius:9px;border:0;cursor:pointer;white-space:nowrap}
.scard .sbtn.pri{background:var(--brand);color:#fff}
.plan{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.planhd{padding:15px 22px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.planhd b{font-size:14.5px;font-weight:900}.planhd .range{font-size:12px;color:var(--ink3)}
.planhd .sp{flex:1}
.examchip{display:flex;align-items:center;gap:7px;background:var(--s-examt);color:var(--s-exam);font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:999px}
.upbtn{background:var(--ink);color:#fff;border:0;font-size:12px;font-weight:800;padding:8px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}
.upbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.plgrid{flex:1;overflow:auto;padding:18px 22px}
.pgtbl{width:100%;border-collapse:collapse}
.pgtbl th{font-size:11.5px;font-weight:800;color:var(--ink3);padding:0 0 10px;text-align:center}
.pgtbl th.today{color:var(--brand)}
.pgtbl td{vertical-align:top;width:14.28%;padding:4px}
.daycol{min-height:320px;background:var(--card);border:1.5px dashed transparent;border-radius:12px;padding:8px;transition:.12s}
.daycol.drop{border-color:var(--brand-d);background:var(--brand-s)}
.daycol.todaycol{background:#FBFBFF;outline:1px solid var(--line)}
.pblk{border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:11.5px;cursor:grab;position:relative}
.pblk .pt{font-weight:800;line-height:1.25}.pblk .ps{font-size:9.5px;opacity:.75;margin-top:2px}
.pblk .px{position:absolute;top:5px;right:6px;cursor:pointer;color:rgba(0,0,0,.3);font-size:12px;font-weight:900;display:none}
.pblk:hover .px{display:block}
.emptyday{font-size:11px;color:var(--faint);text-align:center;padding:14px 0;font-weight:600}
.fab{position:fixed;right:26px;bottom:26px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fabbtn{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3A3D8F,#6B4FD0);box-shadow:0 10px 30px -6px rgba(58,61,143,.55);border:0;cursor:pointer;display:grid;place-items:center;position:relative;transition:.18s}
.fabbtn:hover{transform:scale(1.05)}
.fabbtn svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
.fabbtn .fbdg{position:absolute;top:-2px;right:-2px;background:var(--lime);color:#20233F;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;border:2px solid var(--bg)}
.fabtip{position:absolute;right:72px;bottom:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:12px 12px 2px 12px;white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.3);opacity:0;transform:translateX(8px);pointer-events:none;transition:.2s}
.fab:hover .fabtip{opacity:1;transform:translateX(0)}
.aiwin{position:fixed;right:26px;bottom:26px;z-index:95;width:380px;max-width:calc(100vw - 40px);height:560px;max-height:calc(100vh - 52px);background:var(--card);border-radius:20px;box-shadow:0 24px 60px -12px rgba(25,30,46,.45);display:none;flex-direction:column;overflow:hidden;animation:winup .22s ease}
.aiwin.show{display:flex}
@keyframes winup{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.aiwhd{background:linear-gradient(120deg,#2A2D6B,#3A3D8F);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:11px}
.aiwhd .aiic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.aiwhd .aiic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.aiwhd b{font-size:14.5px;font-weight:900}.aiwhd .d{font-size:11px;opacity:.85}
.aiwhd .wx{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:900}
.aictx{background:var(--brand-s);padding:9px 18px;font-size:11.5px;color:var(--brand);font-weight:800;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.aictx .cav{width:20px;height:20px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-weight:600}
.msg.a{align-self:flex-start}
.msg.a .ab{background:var(--bg);border-radius:14px 14px 14px 4px;padding:11px 13px;color:var(--ink2)}
.msg.a .ab b{color:var(--ink);font-weight:800}
.rec{border:1.5px solid var(--brand);border-radius:14px;overflow:hidden;margin-top:9px;background:#fff}
.rec .rh{background:var(--brand-s);padding:9px 12px;font-size:12px;font-weight:900;color:var(--brand)}
.rec .ri{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2);cursor:grab}
.rec .ri .rtag{font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:5px;white-space:nowrap;flex:none}
.rec .ri .rn{flex:1;min-width:0}.rec .ri .rn b{font-size:12px;font-weight:800;display:block}.rec .ri .rn .rm{font-size:10px;color:var(--ink3)}
.rec .rwhy{font-size:11px;color:var(--ink3);padding:9px 12px;background:#FAFBFF;border-top:1px solid var(--line2);line-height:1.45}
.rec .rwhy b{color:var(--s-exam)}
.rec .rbtn{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--line2)}
.rec .rbtn button{flex:1;border:0;font-size:12px;font-weight:900;padding:9px;border-radius:9px;cursor:pointer}
.rec .rbtn .pri{background:var(--brand);color:#fff}.rec .rbtn .sub{background:var(--bg);color:var(--ink2)}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:11px 16px;border-top:1px solid var(--line)}
.qchip{font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--bg);color:var(--ink2);cursor:pointer;border:1px solid var(--line)}
.qchip:hover{background:var(--brand-s);color:var(--brand);border-color:var(--brand-d)}
.inbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.inbar input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13px;font-family:inherit;outline:none;min-width:0}
.inbar input:focus{border-color:var(--brand-d)}
.inbar button{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:0 16px;font-weight:900;cursor:pointer}
.ovl{position:fixed;inset:0;background:rgba(25,30,46,.5);display:none;place-items:center;z-index:100;padding:20px}
.ovl.show{display:grid}
.dlg{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:24px;position:relative;max-height:90vh;overflow-y:auto}
.dlg h3{font-size:17px;font-weight:900;margin-bottom:5px}.dlg .dsub{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.dlg .x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--faint);font-size:18px;font-weight:900;background:none;border:0}
.uprow{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;margin-bottom:12px}
.uprow:hover{border-color:var(--brand-d);color:var(--brand);background:var(--brand-s)}
.exfield{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.exfield label{font-size:11.5px;font-weight:800;color:var(--ink3)}
.exfield textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;min-height:70px;resize:vertical}
.dbtn{width:100%;background:var(--brand);color:#fff;border:0;font-size:14px;font-weight:900;padding:13px;border-radius:11px;cursor:pointer}
.katalk{background:#A3C3DB;border-radius:14px;padding:16px 14px 18px;margin:6px 0 16px;max-height:340px;overflow-y:auto}
.ktday{text-align:center;margin:0 auto 12px;background:rgba(0,0,0,.14);color:#fff;font-size:10.5px;font-weight:700;padding:3px 11px;border-radius:999px;width:fit-content}
.ktrow{display:flex;gap:7px;margin-bottom:12px;align-items:flex-start}
.ktav{width:34px;height:34px;border-radius:12px;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden}
.ktav svg{width:26px;height:26px}
.ktbody{max-width:76%}
.ktname{font-size:10.5px;color:#4A5568;font-weight:700;margin-bottom:3px}
.ktbub{background:#fff;border-radius:3px 14px 14px 14px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:#1A202C;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ktbub .kttit{font-weight:900;display:block;margin-bottom:4px;color:var(--brand)}
.ktbub .ktbtn{display:block;text-align:center;margin-top:9px;padding:9px;background:var(--brand-s);color:var(--brand);border-radius:8px;font-weight:800;font-size:12px}
.kttime{font-size:9.5px;color:#4A5568;align-self:flex-end;margin-left:3px;opacity:.75}
.ktsend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-bottom:12px;font-weight:700}
.ktsend .ch{display:inline-flex;align-items:center;gap:4px;background:var(--kakao);color:var(--kakao-ink);padding:3px 9px;border-radius:999px;font-weight:900;font-size:10.5px}
.decide{display:flex;gap:8px;margin-top:4px}
.decide button{flex:1;border:0;font-size:12.5px;font-weight:900;padding:11px;border-radius:10px;cursor:pointer}
.decide .send{background:var(--ok);color:#fff}
.decide .edit{background:var(--brand-s);color:var(--brand)}
.decide .hide{background:var(--bg);color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:200;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.24s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dtdash{background:var(--card);border-bottom:1px solid var(--line);padding:18px 22px}
/* 학생 학습 현황 */
.ls-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ls-eng{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:900;flex:none;color:#fff}
.ls-eng.ok{background:#1F9D64}.ls-eng.warn{background:#E0A94B}.ls-eng.risk{background:#D64545}
.ls-h1{font-size:16px;font-weight:900;color:var(--ink)}.ls-h2{font-size:12px;color:var(--ink3);margin-top:2px}
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px}
@media(max-width:860px){.ls-grid{grid-template-columns:1fr}}
.ls-row .ls-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.ls-l{font-size:12.5px;font-weight:800;color:var(--ink2)}
.ls-v{font-size:12px;font-weight:900}
.ls-bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}
.ls-bar i{display:block;height:100%;border-radius:999px}
.ls-concept{margin-top:16px;background:var(--bg);border-radius:12px;padding:14px 16px}
.ls-ct{font-size:11.5px;font-weight:900;color:var(--ink3);margin-bottom:10px}
.ls-unit{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ls-unit:last-child{margin-bottom:0}
.lu-n{flex:0 0 80px;font-size:12px;font-weight:800;color:var(--ink2)}
.lu-bar{flex:1;height:7px;background:#E6E8F0;border-radius:999px;overflow:hidden}
.lu-bar i{display:block;height:100%;border-radius:999px}
.lu-v{flex:0 0 64px;text-align:right;font-size:12px;font-weight:900;color:var(--ink)}
.lu-v em{font-size:10px;margin-left:2px;font-style:normal}.lu-v em.u{color:#1F9D64}.lu-v em.d{color:#D64545}
.ls-sigs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.ls-sig{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:7px}
.ls-sig.up{background:var(--ok-s);color:#157A4C}.ls-sig.down{background:#FDECEC;color:#C13838}
.ls-sig.risk{background:#FDE6E6;color:#B82E2E;font-weight:800}.ls-sig.warn{background:#FFF3E0;color:#9A6310}
.ls-warn{font-size:12px;color:#9A6310;background:#FFF3E0;border-radius:10px;padding:11px 14px;margin-top:12px;line-height:1.55}
/* ===== 담임 심화: 추이·문제점·개선점·리포트 ===== */
.dd-sec{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.dd-h{font-size:13px;font-weight:900;color:var(--ink);margin-bottom:11px}
.dd-trend{display:flex;gap:10px}
.dd-tcard{flex:1;background:var(--bg);border-radius:12px;padding:12px}
.dd-tl{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.dd-tl em{font-style:normal;font-weight:900;margin-left:3px}
.dd-tl em.u{color:#1F9D64}.dd-tl em.d{color:#D64545}
.dd-tn{font-size:11px;font-weight:800;color:var(--ink3);text-align:right;margin-top:4px}
.dd-prob{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink);line-height:1.5;padding:7px 0;border-top:1px solid var(--line2)}
.dd-prob:first-of-type{border-top:0}
.dd-tag{flex:none;font-size:10.5px;font-weight:900;color:#C23A3A;background:#FBE4E4;padding:3px 9px;border-radius:999px}
.dd-act{font-size:12.5px;color:var(--ink);line-height:1.55;background:var(--brand-s);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-weight:700}
.dd-rptrow{display:flex;gap:9px}
.dd-rbtn{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px;font-size:12.5px;font-weight:800;color:var(--ink2);cursor:pointer;font-family:inherit}
.dd-rbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.dd-rptnote{font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:9px;text-align:center}
.dtstat{display:flex;flex-direction:column}
.dtstat .dv{font-size:22px;font-weight:900;color:var(--brand);letter-spacing:-.02em}
.dtstat .dl{font-size:11px;color:var(--ink3);font-weight:700;margin-top:1px}
.dtstat.warn .dv{color:var(--s-exam)}
.dtbar{flex:1;min-width:180px}
.dtbar .dblbl{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink3);margin-bottom:5px}
.dtbar .dbtrack{height:9px;border-radius:999px;background:var(--line);overflow:hidden}

.dtrecent{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.fc h2{font-size:17.5px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:5px}
.fc h2 .no{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.fc .fd{font-size:13.5px;color:var(--ink3);margin-bottom:15px;line-height:1.65}
.fc .fd b{color:var(--ink2)}

/* 흐름 행 */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.node{font-size:13.5px;font-weight:800;padding:11px 15px;border-radius:12px;background:var(--brand-s);color:var(--brand);white-space:nowrap}
.node small{display:block;font-size:9.5px;font-weight:700;opacity:.75;white-space:normal;line-height:1.3}
.node.start{background:var(--ink);color:#fff}
.node.ok{background:var(--ok-s);color:var(--ok)}
.node.coach{background:var(--coach-s);color:var(--coach)}
.node.hide{background:var(--hide-s);color:var(--hide)}
.node.red{background:var(--red-s);color:var(--red)}
.node.vio{background:var(--vio-s);color:var(--vio)}
.node.sky{background:var(--sky-s);color:var(--sky)}
.node.lime{background:var(--lime);color:var(--lime-ink)}
.node.x{background:#fff;border:1.5px dashed var(--faint);color:var(--faint);text-decoration:line-through}
.ar{color:var(--faint);font-weight:900;font-size:13px;flex:none}
.ar.lbl{font-size:9.5px;font-weight:800;background:var(--bg);border-radius:6px;padding:3px 7px;color:var(--ink3);text-decoration:none}
.loopback{font-size:10.5px;font-weight:800;color:var(--vio);background:var(--vio-s);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;margin-top:2px}

/* 분기 */
.branch{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px 10px;padding-left:14px;border-left:2px dashed var(--line)}
.bline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bcase{font-size:9.5px;font-weight:900;border-radius:6px;padding:3px 8px;white-space:nowrap}
.bcase.g{background:var(--ok-s);color:var(--ok)}
.bcase.c{background:var(--coach-s);color:var(--coach)}
.bcase.h{background:var(--hide-s);color:var(--hide)}
.bcase.r{background:var(--red-s);color:var(--red)}
.note{margin-top:12px;background:var(--bg);border-radius:12px;padding:11px 14px;font-size:11.5px;color:var(--ink2);line-height:1.6}
.note b{color:var(--brand)}
.note.warn b{color:var(--red)}

/* 아키텍처 설명서 */
.arch{display:flex;flex-direction:column;gap:0;margin-top:4px}
.layer{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.layer+.layer{margin-top:0}
.ldown{text-align:center;color:var(--faint);font-weight:900;font-size:15px;line-height:1.9}
.lt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;margin-bottom:9px}
.lt .lic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;flex:none}
.lrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:800;border-radius:8px;padding:6px 10px;white-space:nowrap}
.pill small{display:block;font-size:8.5px;font-weight:700;opacity:.75;white-space:normal;line-height:1.25}
.layer.sec{background:linear-gradient(120deg,#20233F,#2A2D6B);border:0;color:#fff}
.layer.sec .lt{color:#fff}
.layer.sec .pill{background:rgba(255,255,255,.12);color:#fff}
.layer.sec .pill.key{background:var(--lime);color:#2A3A08}
.layer.db{background:var(--brand-s);border-color:#D8DCF5}
.layer.db .pill{background:#fff;color:var(--brand);border:1px solid #D8DCF5}
.dbg{margin-bottom:8px}
.dbg:last-child{margin-bottom:0}
.dbg .dbgt{font-size:10px;font-weight:900;color:var(--ink3);margin-bottom:5px}
.rlsnote{margin-top:10px;border-top:1px dashed #C9CEF0;padding-top:9px;font-size:10.5px;color:var(--ink2);line-height:1.6}
.rlsnote b{color:var(--brand)}
@media(max-width:640px){
 .flow{gap:6px}
 .node{font-size:11px;padding:8px 10px}
 .fc{padding:16px}
 .branch{margin-left:4px;padding-left:10px;flex-direction:column;gap:7px}
}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;hd&quot;&gt;&lt;h1&gt;🧭 서비스 흐름도&lt;/h1&gt;&lt;p&gt;A가 일어나면 B가 된다 — 전 구간 자동, 사람은 예외에만 개입&lt;/p&gt;&lt;/div&gt;

  &lt;!-- 0. 전체 구조 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;0&lt;/span&gt;전체 구조 설명서 — 뭐가 들어와서, 어떤 보안을 거쳐, 어디에 쌓이고, 어디로 나가나&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;모든 데이터는 &lt;b&gt;Supabase 한 곳&lt;/b&gt;에 쌓이고, 들어오고 나가는 길목마다 보안 게이트가 있다. 구글시트·외부 우회 없음 — &lt;b&gt;쌓이는 것 자체가 자산.&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;arch&quot;&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:var(--sky-s)&quot;&gt;📥&lt;/span&gt;들어오는 것 (인입 소스)&lt;/div&gt;
        &lt;div class=&quot;lrow&quot;&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;메타 리드 webhook&lt;small&gt;캠페인·UTM 태깅 → leads&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--ok-s);color:var(--ok)&quot;&gt;수행평가 허브&lt;small&gt;5,926개교 일정 → school_events&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--coach-s);color:var(--coach)&quot;&gt;업로드 + AI 파싱&lt;small&gt;알림장·시험범위·성적표·기출&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--vio-s);color:var(--vio)&quot;&gt;BODA 입퇴장 webhook&lt;small&gt;user_id 기준 출석&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;플레이어 이벤트&lt;small&gt;VOD 진도율 자체 기록&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--red-s);color:var(--red)&quot;&gt;KIS 결제 webhook&lt;small&gt;빌링키 성공/실패&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--hide-s);color:var(--hide)&quot;&gt;앱 행동&lt;small&gt;완료 체크·챗봇 담기·문의&lt;/small&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer sec&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:rgba(255,255,255,.18)&quot;&gt;🔐&lt;/span&gt;보안 게이트 — 모든 길은 여기를 지난다&lt;/div&gt;
        &lt;div class=&quot;lrow&quot;&gt;
          &lt;span class=&quot;pill key&quot;&gt;인증 JWT&lt;small&gt;모든 요청 토큰 검증&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;API·Edge Function&lt;small&gt;내부=외부 동일 API (갈라파고스 방지)&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;service role 키 서버 전용&lt;small&gt;클라이언트에 비밀키 없음&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;rate limit + audit log&lt;small&gt;누가 뭘 호출했는지 전부 기록&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;어드민 IP 허용&lt;small&gt;허가된 IP에서만&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;webhook 서명 검증&lt;small&gt;메타·KIS·BODA 위조 차단&lt;/small&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer db&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:#fff&quot;&gt;🗄&lt;/span&gt;Supabase DB — 역할별로 보이는 범위가 다르다 (RLS)&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;사람·조직&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;organizations (트리)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;profiles (역할)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;students (담임 연결)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;subscriptions (빌링키·애드온)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;학교·학사&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;schools&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;school_events (수행·시험)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;exam_scopes (시험범위)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;학습 (코칭 루프의 원료)&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;units (단원 사전 ★좌표계)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;plan_items (플래너)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;lectures / lecture_views&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;problems / attempts&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;student_levels&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;grade_records&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;운영&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;notifications (auto/coach/hide)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;inquiry_threads / messages (문의)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;leads (유입 자산)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;rlsnote&quot;&gt;&lt;b&gt;RLS 접근 범위&lt;/b&gt; — 학생: 자기 것만 · 학부모: 자녀 + hide 제외 알림 · 매니저: 담당 학생만 · &lt;b&gt;sales: leads만&lt;/b&gt; · 센터장: 자기 센터 트리 · 마스터: 전체(단, 집계 뷰/RPC 경유 + IP 게이트). 대시보드는 화면 하나에 범위만 축소.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:var(--ok-s)&quot;&gt;📤&lt;/span&gt;나가는 것 (출구)&lt;/div&gt;
        &lt;div class=&quot;lrow&quot;&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;학생 웹푸시 (FCM)&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--coach-s);color:var(--coach)&quot;&gt;학부모 알림톡&lt;small&gt;auto 즉시 / coach 담임 검수 후&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--ok-s);color:var(--ok)&quot;&gt;AI 리포트&lt;small&gt;팩트+해석+다음 액션 (주간·시험·결제 D-3)&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--brand-s);color:var(--brand)&quot;&gt;대시보드&lt;small&gt;집계 뷰/RPC만 · Realtime&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--vio-s);color:var(--vio)&quot;&gt;외부 API&lt;small&gt;아이스캔 등 — 법인별 DB 분리, API 크로스만&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--hide-s);color:var(--hide)&quot;&gt;구글시트 내보내기&lt;small&gt;보고용 only — 원본은 항상 DB&lt;/small&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;fgrid&quot;&gt;
  &lt;!-- 1. 코칭 루프 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;1&lt;/span&gt;코칭 루프 — 제품의 심장&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;데이터 나열이 아니라 &lt;b&gt;&quot;다음에 뭘 할지&quot;를 계속 안내하는 멘토링 루프.&lt;/b&gt; 끝났는데 다음이 없는 상태를 만들지 않는다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;A 완료&lt;small&gt;강의 시청 / 문제 풀이&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;다음 B 자동 안내&lt;small&gt;오답→해설 / 개념→문제&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;푸시 알림&lt;small&gt;학생 웹푸시&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;수행 + 완료 체크&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;&quot;했다&quot; 기록·공유&lt;small&gt;엄마에게 좋은 소식&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;기록 축적 → 리포트&lt;small&gt;주간 자동 발송&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;span class=&quot;loopback&quot;&gt;↺ 리포트가 다시 다음 계획의 근거가 됨 — 무한 루프&lt;/span&gt;
    &lt;div class=&quot;note&quot;&gt;지치면? 피로 신호(미완료 누적·연속 학습·&quot;힘들어&quot; 발화) 감지 시 학습 대신 &lt;b&gt;쉼 콘텐츠&lt;/b&gt; 1개 추천. 멘토링은 밀어붙이기만이 아니니까.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 2. 시험대비 배정 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;2&lt;/span&gt;중등 시험대비 — 범위가 올라오면 공부가 꽂힌다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;수행평가 허브가 시험일을 먼저 알고, 범위만 올리면 &lt;b&gt;단원×레벨×D-day 역산&lt;/b&gt;으로 세트가 나온다. 언제 할지는 아이가 정한다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;수행평가 허브&lt;small&gt;시험일 D-day 자동 인지&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;D-14 &quot;범위 올려주세요&quot;&lt;small&gt;학생·학부모·담임 누구나&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;AI 파싱 → 단원 코드&lt;small&gt;사진·텍스트 OK&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;배정 엔진&lt;small&gt;취약 단원 우선 · 하루 용량 상한&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;아이가 슬롯 확정&lt;small&gt;언제 할지 선택 → 플래너&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;다음 스텝 안내 + 엄마 알림&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;미완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;남은 D-day 안에서 재배치&lt;small&gt;&quot;이번 주에 몰아서 끝내기&quot;&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;일정 변동&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node sky&quot;&gt;수정 제안&lt;small&gt;나만 → 내 일정 수정 / 학교 전체 → 정정 제보·검수 후 반영(SCH-03)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;범위 안 올라옴&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;D-10 담임 알림 → 진도 추정 가배정&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;시험 끝 → 성적 입력 → &lt;b&gt;레벨 보정 + 시험 리포트(RPT-02)&lt;/b&gt; 자동. 개념특강(라이브)은 이 흐름과 무관 — 학년별 정해진 타임에 자동 편성, 듣든 안 듣든 자유.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 3. 알림 분기 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;3&lt;/span&gt;알림 분기 — 좋은 소식은 바로, 나쁜 소식은 담임 경유&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;모든 이벤트는 룰 엔진을 거쳐 &lt;b&gt;auto / coach / hide&lt;/b&gt; 셋 중 하나로 갈라진다. 엄마에게 나쁜 소식이 날것으로 꽂히는 일이 없다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;이벤트 발생&lt;small&gt;출석·완료·미이행·성적·일정&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;룰 엔진&lt;small&gt;rule_id + 구독 플래그 + 행동태그&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;auto&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;즉시 발송&lt;small&gt;학생 웹푸시 + 학부모 알림톡&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar lbl&quot;&gt;출석·완료·일정·리포트&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;coach&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;담임 콘솔에 카드&lt;small&gt;[발송/문구 수정/비공개]&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;검수 후 학부모 발송&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase h&quot;&gt;hide&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node hide&quot;&gt;학생에게만&lt;small&gt;사소한 넛지 — 학부모 미발송&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;매니저 홈에는 이 결과가 행동 기준으로 떨어진다: &lt;b&gt;📞 통화할 것 · 💬 응답할 것 · ✅ 처리할 것 · 👀 확인만&lt;/b&gt; — &quot;포스트잇에 붙이지 않아도 되는 세상.&quot;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 4. 문의 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;4&lt;/span&gt;문의 — 전화 인바운드 없음, 남기면 담임에게 간다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 통합 카톡 하나로 응대 → 누락·오배정. 마이튜터는 &lt;b&gt;수신 단일 창구(인앱) + 담임 자동 라우팅 + 에스컬레이션&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node x&quot;&gt;전화 문의&lt;/span&gt;
      &lt;span class=&quot;ar lbl&quot;&gt;채널 자체가 없음&lt;/span&gt;
      &lt;span class=&quot;node start&quot;&gt;학부모, 앱에서 문의 남김&lt;small&gt;&quot;전화 연락 원해요&quot; 체크 가능&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;담임에게 자동 배정&lt;small&gt;학생당 스레드 1개 · 히스토리 영구&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;답변&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;알림톡 &quot;답변 도착&quot; + 앱 링크&lt;small&gt;카톡은 벨만 울림&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;콜백 요청&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;📞 통화할 것에 통화 약속 적재&lt;small&gt;우리가 거는 전화만 존재&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;24h 무응답&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;센터장 에스컬레이션 + 🔴 최상단 고정&lt;small&gt;누락 구조적 차단&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;카카오 채널로 문의가 와도 자동응답으로 앱 창구에 깔때기. 전 대화가 DB에 남아 &lt;b&gt;담임 교체 시 통째 인수인계&lt;/b&gt; + 대시보드에 응답속도 집계.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 5. 온라인 온보딩 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;5&lt;/span&gt;온라인 온보딩 — 방문 없이, 보여주고, 자유 가입&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 수업을 안 보여주고 방문 결제(346만 선결제·수수료 30만) → 기대 불일치·민원. 마이튜터는 &lt;b&gt;가입 전에 화면을 그대로 공개&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;초대링크 발송&lt;small&gt;카톡 — 예약·미팅·가입 통합&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;온라인 미팅&lt;small&gt;페인포인트 청취 + 화면 시연&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;자유 가입&lt;small&gt;월 20만 · 기간 선택 · 락인 없음&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;온보딩&lt;small&gt;학교 검색 → 허브 연동&lt;br&gt;레벨 진단 (교과서는 선택)&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;플래너 자동 완성&lt;small&gt;학사일정·수행·시험 D-day + 개념특강&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;리드·상담·페인포인트는 전부 DB로 — 전환 퍼널이 대시보드에 집계. 영업 난이도가 낮아져 &lt;b&gt;수수료 30만 → 소액&lt;/b&gt;, 이게 월 20만에서 마진이 나오는 근거.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 6. 라이브 입장 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;6&lt;/span&gt;개념특강 입장 — 이름은 서버가 박는다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 아이들이 대화명을 바꿔 다른 학생 사칭. 마이튜터는 &lt;b&gt;입장 경로가 앱 버튼 하나&lt;/b&gt;고, 이름은 토큰에 바인딩된다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;앱 &quot;본방 입장&quot; 버튼&lt;small&gt;유일한 입장 경로&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;서명 토큰 발급&lt;small&gt;user_id + 표시명 &quot;김민준(반포중2)&quot;&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;BODA 입장&lt;small&gt;이름 입력창 없음 · 변경 불가&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;입퇴장 webhook&lt;small&gt;user_id 기준&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;출석 자동 체크&lt;small&gt;GOOD-01 엄마 알림&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;2회 연속 미입장&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;CHK-01 담임 검수 → 학부모 안내&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;녹화 종료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;VOD 자동 업로드&lt;small&gt;다시보기 — 진도율은 자체 기록&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note warn&quot;&gt;&lt;b&gt;BODA 계약 조건 4가지&lt;/b&gt;: ① 토큰 입장(이름 바인딩) ② 이름 변경 비활성 ③ 입퇴장 webhook ④ 녹화 수령 API — ①③ 미지원 시 API형 화상(LiveKit 등) 재검토.&lt;/div&gt;
  &lt;/div&gt;


  &lt;!-- 7. 구독·결제 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;7&lt;/span&gt;구독·결제 — &quot;잘하고 있다&quot;가 갱신 영업이다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;홈페이지에서 카드 등록 → &lt;b&gt;빌링키 발급 → 월 자동결제&lt;/b&gt; (넷플릭스식, 거부감 없음). 갱신 안내는 결제 요청이 아니라 &lt;b&gt;성과 리포트가 먼저&lt;/b&gt; 간다. 결제는 웹 — 인앱결제 수수료 회피.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;가입 시 카드 등록&lt;small&gt;홈페이지(웹) · KIS 빌링키&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;D-3 안내&lt;small&gt;&quot;이번 달 잘하고 있어요&quot; 리포트 + 결제 예고&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;자동결제 성공&lt;small&gt;영수증·다음 결제일 알림톡&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;실패 1회&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;자동 재시도 + 카드 변경 링크&lt;small&gt;사람 개입 없음&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;실패 2회&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;담임 확인 후 연락&lt;small&gt;독촉이 아니라 도움 톤 (coach)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;기간은 소비자 선택(월/3/6/12) · 위약금 락인 없음 · 해지는 웹 셀프서비스. &lt;b&gt;리텐션은 락인이 아니라 리포트(성과)가 만든다.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
<script>
var cur=1, dev='pc';
var isTouch=matchMedia('(max-width:760px)').matches;
function apply(){
  var devOk=!isTouch && (cur===0||cur===1||cur===3||cur===4);
  for(var j=0;j<5;j++){
    var f=document.getElementById('f'+j);
    f.classList.toggle('on', j===cur);
    f.classList.toggle('mobf', j===cur && devOk && dev==='mob');
    document.getElementById('b'+j).classList.toggle('on', j===cur);
  }
  document.getElementById('dev').classList.toggle('off', !devOk);
  document.getElementById('d0').classList.toggle('on', dev==='mob');
  document.getElementById('d1').classList.toggle('on', dev==='pc');
  document.body.classList.toggle('mob', devOk && dev==='mob');
}
function sw(i){cur=i;apply();}
function dv(m){dev=m;apply();}
window.addEventListener('resize',function(){var s=matchMedia('(max-width:760px)').matches;if(s!==isTouch){isTouch=s;apply();}});
apply();
</script>
</body></html>
