.sy-lead{background:var(--brand-s);border-radius:16px;padding:18px 20px;margin-bottom:20px;font-size:13px;color:var(--ink2);line-height:1.65}

.sy-card .syt{font-size:13.5px;font-weight:900}

.dv-lead{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}

.dv-dot{width:9px;height:9px;border-radius:3px;flex:none}
.dv-grp{margin-bottom:22px}
.dv-gh{font-size:14px;font-weight:900;margin:4px 0 4px;color:var(--ink)}
.dv-gn{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-bottom:11px}

.dv-ch.par{background:#E9F6EF;color:#1F9D64}
.dv-ch.mgr{background:#FFF1E6;color:#C97A1E}
.dv-sd{display:inline-block;font-size:10px;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap}
.dv-sd.auto{background:#E9F6EF;color:#1F9D64}
.dv-sd.coach{background:#FFECEC;color:#E23B3B}
.dv-ad{display:inline-block;font-size:10px;font-weight:900;padding:3px 9px;border-radius:999px;background:#EEE9FC;color:#7B61F2;white-space:nowrap}

.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:18px}

.fab{position:fixed;right:26px;bottom:26px;z-index:94;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fabbtn{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#3A3D8F,#6B4FD0);box-shadow:0 10px 30px -6px rgba(58,61,143,.55);border:0;cursor:pointer;display:grid;place-items:center;position:relative;transition:.18s}
.fabbtn:hover{transform:scale(1.05)}
.fabbtn svg{width:27px;height:27px;stroke:#fff;fill:none;stroke-width:2}
.fabbtn .fbdg{position:absolute;top:-2px;right:-2px;background:var(--lime);color:#20233F;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;border:2px solid var(--bg)}

.fab:hover .fabtip{opacity:1;transform:translateX(0)}
.aiwin{position:fixed;right:26px;bottom:26px;z-index:95;width:375px;max-width:calc(100vw - 40px);height:560px;max-height:calc(100vh - 52px);background:var(--card);border-radius:20px;box-shadow:0 24px 60px -12px rgba(25,30,46,.45);display:none;flex-direction:column;overflow:hidden;animation:winup .22s ease}

.aiwhd .wx{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:900}

.rec .ri{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2)}
.rec .ri .rtag{font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:5px;white-space:nowrap;flex:none}

&lt;title&gt;알림·푸시 시뮬레이터&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root{color-scheme:light;
 --brand:#3A3D8F;--brand-d:#5558C8;--brand-s:#ECEDF9;--lime:#B6E34A;
 --ink:#191E2E;--ink2:#454E65;--ink3:#7A8398;--faint:#AAB2C2;
 --line:#E7EAF1;--line2:#F1F3F8;--bg:#Eef1f7;--card:#fff;
 --push:#2E7CF0;--ok:#1F9D64;--ok-s:#E5F4EC;--red:#E23B3B;--red-s:#FDECEC;
 --coach:#C97A1E;--coach-s:#FFF3E3;--hide:#5A6377;--hide-s:#EEF0F6;
 --kakao:#FEE500;--kakao-ink:#3C1E1E;--kbg:#A3C3DB;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,&quot;Noto Sans KR&quot;,system-ui,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.01em;line-height:1.5;min-height:100vh;padding:24px 18px 50px}
button{font:inherit;cursor:pointer}

.top{max-width:1180px;margin:0 auto 18px;text-align:center}
.top h1{font-size:21px;font-weight:900;letter-spacing:-.02em}
.top p{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:4px}
.legend{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--ink2)}
.lg i{width:9px;height:9px;border-radius:3px}

.btns{max-width:1180px;margin:0 auto 20px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.sim{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 15px;transition:.14s;min-width:168px;text-align:left}
.sim:hover{border-color:var(--brand-d);transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(58,61,143,.3)}
.sim b{font-size:12.5px;font-weight:900}
.sim .s{font-size:10px;font-weight:800;border-radius:5px;padding:1px 7px}
.sim .s.a{background:var(--ok-s);color:var(--ok)}
.sim .s.c{background:var(--coach-s);color:var(--coach)}
.sim .s.h{background:var(--hide-s);color:var(--hide)}

.wrap{max-width:1180px;margin:0 auto;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.col .who{font-size:13px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:7px}
.col .who .av{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}

.phone{width:375px;max-width:92vw;background:#111826;border-radius:42px;padding:11px;box-shadow:0 26px 60px -18px rgba(17,24,38,.45)}
.scr{border-radius:33px;overflow:hidden;position:relative;height:720px;display:flex;flex-direction:column}
.scr.stu{background:#F4F6FB}
.scr.par{background:var(--kbg)}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;font-size:12px;font-weight:800}
.scr.par .status{color:#1A2733}
.status .notch{width:104px;height:22px;background:#111826;border-radius:999px;position:absolute;left:50%;transform:translateX(-50%);top:8px}
.list{flex:1;overflow-y:auto;padding:6px 12px 20px;-ms-overflow-style:none;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}

/* 학생 폰 — 알림 센터 */
.sh{display:flex;align-items:center;gap:9px;padding:8px 6px 10px}
.sh .mk{width:32px;height:32px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.sh .mk svg{width:20px;height:20px}
.sh b{font-size:16px;font-weight:900}
.sh .cnt{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ink3)}
.sec{font-size:11px;font-weight:900;color:var(--ink3);margin:10px 6px 7px;letter-spacing:.02em}
.ncard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;animation:drop .35s cubic-bezier(.2,.9,.3,1.15)}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.ncard .nic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:10.5px;font-weight:900;color:#fff}
.ncard.push .nic{background:var(--push)}
.ncard.good .nic{background:var(--ok)}
.ncard.rmd .nic{background:#8C5BC2}
.ncard .nb{flex:1;min-width:0}
.ncard .nt{font-size:12.5px;font-weight:900;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ncard .nm{font-size:11.5px;color:var(--ink2);line-height:1.45;margin-top:2px}
.ncard .nx{font-size:9.5px;color:var(--faint);font-weight:800;margin-top:4px}
.rid{font-size:8.5px;font-weight:900;border-radius:4px;padding:1px 5px;background:var(--brand-s);color:var(--brand)}
.empty{text-align:center;color:var(--faint);font-size:11.5px;font-weight:700;padding:30px 10px;line-height:1.7}

/* 학부모 폰 — 카톡 */
.kh{display:flex;align-items:center;gap:9px;padding:9px 6px 10px;color:#13202C}
.kh .back{font-size:17px;font-weight:900}
.kh .kav{width:34px;height:34px;border-radius:13px;background:var(--brand);display:grid;place-items:center}
.kh .kav svg{width:21px;height:21px}
.kh b{font-size:15px;font-weight:900}
.kh .kch{font-size:9.5px;font-weight:900;background:var(--kakao);color:var(--kakao-ink);border-radius:5px;padding:1px 6px;margin-left:2px}
.kday{text-align:center;margin:4px auto 10px;background:rgba(0,0,0,.14);color:#fff;font-size:10px;font-weight:700;padding:3px 11px;border-radius:999px;width:fit-content}
.krow{display:flex;gap:7px;margin-bottom:11px;align-items:flex-end;animation:drop .35s cubic-bezier(.2,.9,.3,1.15)}
.krow .kav2{width:32px;height:32px;border-radius:12px;background:var(--brand);flex:none;display:grid;place-items:center;align-self:flex-start}
.krow .kav2 svg{width:20px;height:20px}
.krow .kb{max-width:74%}
.krow .kn{font-size:10px;color:#2A3B4A;font-weight:700;margin-bottom:3px}
.kbub{background:#fff;border-radius:4px 14px 14px 14px;padding:11px 12px;font-size:12px;line-height:1.5;color:#13202C;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.kbub .kt{font-weight:900;display:block;margin-bottom:3px;color:var(--brand)}
.kbub .kbtn{display:block;text-align:center;margin-top:9px;padding:9px;background:var(--brand-s);color:var(--brand);border-radius:8px;font-weight:800;font-size:11.5px}
.kbub .rid{margin-left:4px}
.ktm{font-size:9px;color:#36475A;opacity:.8;font-weight:700;white-space:nowrap}
/* 상태 연출 */
.kpend .kbub{background:var(--coach-s);border:1.5px dashed #E4C08A;color:#7A5410}
.kpend .kbub .kt{color:var(--coach)}
.kghost .kbub{background:rgba(255,255,255,.55);border:1.5px dashed rgba(90,99,119,.5);color:#5A6377}
.kghost .kbub .kt{color:#5A6377}
.krep .kbub{outline:2px solid var(--ok)}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;top&quot;&gt;
 &lt;h1&gt;📱 알림·푸시 시뮬레이터&lt;/h1&gt;
 &lt;p&gt;버튼을 누르면 룰 엔진이 판정해 두 폰으로 발송돼요 — 학생 웹푸시 · 학부모 카카오 알림톡&lt;/p&gt;
 &lt;div class=&quot;legend&quot;&gt;
   &lt;span class=&quot;lg&quot;&gt;&lt;i style=&quot;background:var(--ok)&quot;&gt;&lt;/i&gt;자동 — 즉시 발송&lt;/span&gt;
   &lt;span class=&quot;lg&quot;&gt;&lt;i style=&quot;background:var(--coach)&quot;&gt;&lt;/i&gt;매니저 확인(coach) — 검수 후 학부모 발송&lt;/span&gt;
   &lt;span class=&quot;lg&quot;&gt;&lt;i style=&quot;background:var(--hide)&quot;&gt;&lt;/i&gt;비공개(hide) — 학생에게만&lt;/span&gt;
 &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;btns&quot;&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;g1&#x27;)&quot;&gt;&lt;b&gt;개념특강 입장 (출석)&lt;/b&gt;&lt;span class=&quot;s a&quot;&gt;GOOD-01 · 자동&lt;/span&gt;&lt;/button&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;g2&#x27;)&quot;&gt;&lt;b&gt;오늘 할 일 전부 완료&lt;/b&gt;&lt;span class=&quot;s a&quot;&gt;GOOD-02 · 자동&lt;/span&gt;&lt;/button&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;g5&#x27;)&quot;&gt;&lt;b&gt;튜터와 스스로 계획 담음&lt;/b&gt;&lt;span class=&quot;s a&quot;&gt;GOOD-05 · 자동&lt;/span&gt;&lt;/button&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;s1&#x27;)&quot;&gt;&lt;b&gt;수행평가 D-3&lt;/b&gt;&lt;span class=&quot;s a&quot;&gt;SCH-01 · 자동&lt;/span&gt;&lt;/button&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;r2&#x27;)&quot;&gt;&lt;b&gt;할 일 하나 남음 (저녁)&lt;/b&gt;&lt;span class=&quot;s h&quot;&gt;RMD-02 · 학생만&lt;/span&gt;&lt;/button&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;c1&#x27;)&quot;&gt;&lt;b&gt;특강 2회 연속 미입장&lt;/b&gt;&lt;span class=&quot;s c&quot;&gt;CHK-01 · 매니저 확인&lt;/span&gt;&lt;/button&gt;
 &lt;button class=&quot;sim&quot; onclick=&quot;go(&#x27;rp&#x27;)&quot;&gt;&lt;b&gt;일요일 주간 리포트&lt;/b&gt;&lt;span class=&quot;s a&quot;&gt;RPT-01 · 자동&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;

&lt;div class=&quot;wrap&quot;&gt;
 &lt;div class=&quot;col&quot;&gt;
  &lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;av&quot; style=&quot;background:var(--push)&quot;&gt;민&lt;/span&gt;학생 폰 — 민준 (웹푸시 알림센터)&lt;/div&gt;
  &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;scr stu&quot;&gt;
    &lt;div class=&quot;status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;notch&quot;&gt;&lt;/span&gt;&lt;span&gt;📶 🔋&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;list&quot;&gt;
      &lt;div class=&quot;sh&quot;&gt;&lt;span class=&quot;mk&quot;&gt;&lt;svg viewBox=&quot;0 0 52 52&quot;&gt;&lt;path d=&quot;M14 15h24a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H24l-7 6v-6h-3a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3z&quot; fill=&quot;#fff&quot;/&gt;&lt;path d=&quot;M20 25l4 4 9-9&quot; stroke=&quot;#3A3D8F&quot; stroke-width=&quot;3.2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;b&gt;마이플래너 알림&lt;/b&gt;&lt;span class=&quot;cnt&quot; id=&quot;scnt&quot;&gt;0건&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sec&quot;&gt;오늘&lt;/div&gt;
      &lt;div id=&quot;slist&quot;&gt;&lt;div class=&quot;empty&quot;&gt;위에서 상황 버튼을 누르면&lt;br&gt;여기로 푸시가 꽂혀요&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/div&gt;
 &lt;/div&gt;

 &lt;div class=&quot;col&quot;&gt;
  &lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;av&quot; style=&quot;background:#E5B800&quot;&gt;맘&lt;/span&gt;학부모 폰 — 어머님 (카카오 알림톡)&lt;/div&gt;
  &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;scr par&quot;&gt;
    &lt;div class=&quot;status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;notch&quot;&gt;&lt;/span&gt;&lt;span&gt;📶 🔋&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;list&quot;&gt;
      &lt;div class=&quot;kh&quot;&gt;&lt;span class=&quot;back&quot;&gt;‹&lt;/span&gt;&lt;span class=&quot;kav&quot;&gt;&lt;svg viewBox=&quot;0 0 52 52&quot;&gt;&lt;path d=&quot;M14 15h24a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H24l-7 6v-6h-3a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3z&quot; fill=&quot;#fff&quot;/&gt;&lt;path d=&quot;M20 25l4 4 9-9&quot; stroke=&quot;#3A3D8F&quot; stroke-width=&quot;3.2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;b&gt;마이플래너&lt;/b&gt;&lt;span class=&quot;kch&quot;&gt;알림톡&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;kday&quot;&gt;오늘&lt;/div&gt;
      &lt;div id=&quot;plist&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;&lt;/div&gt;
 &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
var RULES={
 g1:{rid:&#x27;GOOD-01&#x27;,stu:{cls:&#x27;good&#x27;,t:&#x27;입장 완료 ✓&#x27;,m:&#x27;개념특강(영어 독해)에 입장했어요. 출석 자동 체크!&#x27;},
     par:{t:&#x27;수업 입장 안내&#x27;,m:&#x27;민준 학생이 21:00 개념특강에 입장했어요. 출석 체크됐습니다.&#x27;},mode:&#x27;auto&#x27;},
 g2:{rid:&#x27;GOOD-02&#x27;,stu:{cls:&#x27;good&#x27;,t:&#x27;오늘 공부 끝! 🎉&#x27;,m:&#x27;오늘 할 일을 모두 마쳤어요. 5일 연속 달성!&#x27;},
     par:{t:&#x27;학습 완료 안내 🎉&#x27;,m:&#x27;민준 학생이 오늘 학습을 모두 마쳤어요. 5일 연속 달성 중이에요.&#x27;},mode:&#x27;auto&#x27;},
 g5:{rid:&#x27;GOOD-05&#x27;,stu:{cls:&#x27;good&#x27;,t:&#x27;플래너에 담겼어요&#x27;,m:&#x27;고른 시간에 시작 알림을 보낼게요.&#x27;},
     par:{t:&#x27;스스로 계획 소식 👏&#x27;,m:&#x27;민준이가 튜터(AI)와 상의해 시험 공부를 스스로 플래너에 담았어요.&#x27;},mode:&#x27;auto&#x27;},
 s1:{rid:&#x27;SCH-01&#x27;,stu:{cls:&#x27;push&#x27;,t:&#x27;수행평가 D-3&#x27;,m:&#x27;국어 말하기 수행평가가 3일 뒤예요. 준비 계획을 함께 세웠어요.&#x27;},
     par:{t:&#x27;수행평가 안내&#x27;,m:&#x27;국어 말하기 수행평가(배점 20점)가 3일 뒤입니다. 준비 계획이 시간표에 들어갔어요.&#x27;},mode:&#x27;auto&#x27;},
 r2:{rid:&#x27;RMD-02&#x27;,stu:{cls:&#x27;rmd&#x27;,t:&#x27;하나 남았어요!&#x27;,m:&#x27;영단어 20개만 하면 오늘 할 일 끝이에요.&#x27;},
     par:null,mode:&#x27;hide&#x27;},
 c1:{rid:&#x27;CHK-01&#x27;,stu:null,
     par:{t:&#x27;학습 점검 안내&#x27;,m:&#x27;민준이가 영어 특강을 2회 놓쳐, 주말 다시보기로 보완하도록 안내했어요. 함께 챙겨주시면 좋아요 🙂&#x27;},mode:&#x27;coach&#x27;},
 rp:{rid:&#x27;RPT-01&#x27;,stu:null,
     par:{t:&#x27;주간 학습 리포트 📊&#x27;,m:&#x27;이번 주: 특강 출석 4/5 · 숙제 11/12 · 연속 학습 5일. 수학은 집중 관리 중이에요.&#x27;,btn:&#x27;리포트 전체 보기&#x27;},mode:&#x27;auto&#x27;}
};
function tm(){var d=new Date();return (d.getHours()%12||12)+&#x27;:&#x27;+String(d.getMinutes()).padStart(2,&#x27;0&#x27;);}
var scnt=0;
function stuPush(r){
 var L=document.getElementById(&#x27;slist&#x27;);
 var e=L.querySelector(&#x27;.empty&#x27;);if(e)e.remove();
 var el=document.createElement(&#x27;div&#x27;);el.className=&#x27;ncard &#x27;+(r.cls||&#x27;push&#x27;);
 el.innerHTML=&#x27;&lt;div class=&quot;nic&quot;&gt;&#x27;+(r.cls===&#x27;good&#x27;?&#x27;굿&#x27;:r.cls===&#x27;rmd&#x27;?&#x27;챙김&#x27;:&#x27;푸시&#x27;)+&#x27;&lt;/div&gt;&#x27;+
  &#x27;&lt;div class=&quot;nb&quot;&gt;&lt;div class=&quot;nt&quot;&gt;&#x27;+r.t+&#x27; &lt;span class=&quot;rid&quot;&gt;&#x27;+r.rid+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;nm&quot;&gt;&#x27;+r.m+&#x27;&lt;/div&gt;&lt;div class=&quot;nx&quot;&gt;웹푸시 · &#x27;+tm()+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
 L.insertBefore(el,L.firstChild);
 scnt++;document.getElementById(&#x27;scnt&#x27;).textContent=scnt+&#x27;건&#x27;;
}
function parKakao(r,opt){
 var L=document.getElementById(&#x27;plist&#x27;);
 var el=document.createElement(&#x27;div&#x27;);el.className=&#x27;krow&#x27;+(opt&amp;&amp;opt.cls?&#x27; &#x27;+opt.cls:&#x27;&#x27;);
 var btn=r.btn?&#x27;&lt;span class=&quot;kbtn&quot;&gt;&#x27;+r.btn+&#x27;&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;kbtn&quot;&gt;앱에서 자세히 보기&lt;/span&gt;&#x27;;
 el.innerHTML=&#x27;&lt;span class=&quot;kav2&quot;&gt;&lt;svg viewBox=&quot;0 0 52 52&quot;&gt;&lt;path d=&quot;M14 15h24a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H24l-7 6v-6h-3a3 3 0 0 1-3-3V18a3 3 0 0 1 3-3z&quot; fill=&quot;#fff&quot;/&gt;&lt;path d=&quot;M20 25l4 4 9-9&quot; stroke=&quot;#3A3D8F&quot; stroke-width=&quot;3.2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&#x27;+
  &#x27;&lt;div class=&quot;kb&quot;&gt;&lt;div class=&quot;kn&quot;&gt;마이플래너&#x27;+(opt&amp;&amp;opt.kn?(&#x27; · &#x27;+opt.kn):&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;kbub&quot;&gt;&lt;span class=&quot;kt&quot;&gt;&#x27;+r.t+&#x27; &lt;span class=&quot;rid&quot;&gt;&#x27;+r.rid+&#x27;&lt;/span&gt;&lt;/span&gt;&#x27;+r.m+(opt&amp;&amp;opt.nobtn?&#x27;&#x27;:btn)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;+
  &#x27;&lt;span class=&quot;ktm&quot;&gt;&#x27;+tm()+&#x27;&lt;/span&gt;&#x27;;
 L.appendChild(el);
 L.parentNode.scrollTop=L.parentNode.scrollHeight;
 return el;
}
function go(k){

.ktbub{background:#fff;border-radius:3px 14px 14px 14px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:#1A202C;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ktbub .kttit{font-weight:900;display:block;margin-bottom:4px;color:var(--brand)}
.ktbub .ktbtn{display:block;text-align:center;margin-top:9px;padding:9px;background:var(--brand-s);color:var(--brand);border-radius:8px;font-weight:800;font-size:12px}
.kttime{font-size:9.5px;color:#4A5568;align-self:flex-end;margin-left:3px;opacity:.75}
.ktsend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-bottom:12px;font-weight:700}
.ktsend .ch{display:inline-flex;align-items:center;gap:4px;background:var(--kakao);color:var(--kakao-ink);padding:3px 9px;border-radius:999px;font-weight:900;font-size:10.5px}
.decide{display:flex;gap:8px;margin-top:4px}
.decide button{flex:1;border:0;font-size:12.5px;font-weight:900;padding:11px;border-radius:10px;cursor:pointer}
.decide .send{background:var(--ok);color:#fff}
.decide .edit{background:var(--brand-s);color:var(--brand)}
.decide .hide{background:var(--bg);color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:200;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.24s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dtdash{background:var(--card);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.dtstat{display:flex;flex-direction:column}
.dtstat .dv{font-size:22px;font-weight:900;color:var(--brand);letter-spacing:-.02em}
.dtstat .dl{font-size:11px;color:var(--ink3);font-weight:700;margin-top:1px}
.dtstat.warn .dv{color:var(--s-exam)}
.dtbar{flex:1;min-width:180px}
.dtbar .dblbl{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink3);margin-bottom:5px}
.dtbar .dbtrack{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.dtbar .dbtrack i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-d))}
.dtrecent{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dtrecent .rl{font-size:11px;font-weight:800;color:var(--ink3)}
.dtrecent .rtag{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--brand-s);color:var(--brand)}
/* 리드·온보딩 */
.funnel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.fstep{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;position:relative}
.fstep .fv{font-size:24px;font-weight:900;color:var(--brand)}
.fstep .fl{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:1px}
.fstep::after{content:&quot;→&quot;;position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--faint);font-weight:900;z-index:1}
.fstep:last-child::after{display:none}
.fstep.gain .fv{color:var(--ok)}
.leadlist{display:flex;flex-direction:column;gap:10px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;display:flex;gap:14px;align-items:flex-start}
.lead .lav{width:40px;height:40px;border-radius:11px;background:var(--brand-s);color:var(--brand);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.lead .lmid{flex:1;min-width:0}
.lead .ln{font-size:14px;font-weight:900;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.lead .lsrc{font-size:10px;font-weight:800;color:var(--ink3);background:var(--bg);border-radius:5px;padding:2px 7px}
.lead .lst{font-size:10px;font-weight:900;border-radius:999px;padding:2px 9px}
.lead .lst.s1{background:#E8F1FE;color:#2E7CF0}
.lead .lst.s2{background:#FFF3E3;color:#C97A1E}
.lead .lst.s3{background:#EEE9FC;color:#7B61F2}
.lead .lst.s4{background:var(--ok-s);color:var(--ok)}
.lead .lp{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.lead .lp b{color:var(--s-exam)}
.lead .lbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.lead .lb2{font-size:11.5px;font-weight:900;padding:8px 13px;border-radius:9px;border:0;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.lead .lb2.g{background:var(--ok)}
.lead .lb2.s{background:var(--bg);color:var(--ink2)}
.leadnote{margin-top:16px;background:var(--brand-s);border-radius:14px;padding:14px 17px;font-size:12px;color:var(--ink2);line-height:1.65}
.leadnote b{color:var(--brand)}
@media(max-width:820px){.dashhdr .dh-pills{width:100%}}

.layer.sec .lt{color:#fff}
.layer.sec .pill{background:rgba(255,255,255,.12);color:#fff}
.layer.sec .pill.key{background:var(--lime);color:#2A3A08}
.layer.db{background:var(--brand-s);border-color:#D8DCF5}
.layer.db .pill{background:#fff;color:var(--brand);border:1px solid #D8DCF5}
.dbg{margin-bottom:8px}
.dbg:last-child{margin-bottom:0}
.dbg .dbgt{font-size:10px;font-weight:900;color:var(--ink3);margin-bottom:5px}
.rlsnote{margin-top:10px;border-top:1px dashed #C9CEF0;padding-top:9px;font-size:10.5px;color:var(--ink2);line-height:1.6}
.rlsnote b{color:var(--brand)}
@media(max-width:640px){
 .flow{gap:6px}
 .node{font-size:11px;padding:8px 10px}
 .fc{padding:16px}
 .branch{margin-left:4px;padding-left:10px;flex-direction:column;gap:7px}
}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;hd&quot;&gt;&lt;h1&gt;🧭 서비스 흐름도&lt;/h1&gt;&lt;p&gt;A가 일어나면 B가 된다 — 전 구간 자동, 사람은 예외에만 개입&lt;/p&gt;&lt;/div&gt;

  &lt;!-- 0. 전체 구조 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;0&lt;/span&gt;전체 구조 설명서 — 뭐가 들어와서, 어떤 보안을 거쳐, 어디에 쌓이고, 어디로 나가나&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;모든 데이터는 &lt;b&gt;Supabase 한 곳&lt;/b&gt;에 쌓이고, 들어오고 나가는 길목마다 보안 게이트가 있다. 구글시트·외부 우회 없음 — &lt;b&gt;쌓이는 것 자체가 자산.&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;arch&quot;&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:var(--sky-s)&quot;&gt;📥&lt;/span&gt;들어오는 것 (인입 소스)&lt;/div&gt;
        &lt;div class=&quot;lrow&quot;&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;메타 리드 webhook&lt;small&gt;캠페인·UTM 태깅 → leads&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--ok-s);color:var(--ok)&quot;&gt;수행평가 허브&lt;small&gt;5,926개교 일정 → school_events&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--coach-s);color:var(--coach)&quot;&gt;업로드 + AI 파싱&lt;small&gt;알림장·시험범위·성적표·기출&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--vio-s);color:var(--vio)&quot;&gt;BODA 입퇴장 webhook&lt;small&gt;user_id 기준 출석&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;플레이어 이벤트&lt;small&gt;VOD 진도율 자체 기록&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--red-s);color:var(--red)&quot;&gt;KIS 결제 webhook&lt;small&gt;빌링키 성공/실패&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--hide-s);color:var(--hide)&quot;&gt;앱 행동&lt;small&gt;완료 체크·챗봇 담기·문의&lt;/small&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer sec&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:rgba(255,255,255,.18)&quot;&gt;🔐&lt;/span&gt;보안 게이트 — 모든 길은 여기를 지난다&lt;/div&gt;
        &lt;div class=&quot;lrow&quot;&gt;
          &lt;span class=&quot;pill key&quot;&gt;인증 JWT&lt;small&gt;모든 요청 토큰 검증&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;API·Edge Function&lt;small&gt;내부=외부 동일 API (갈라파고스 방지)&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;service role 키 서버 전용&lt;small&gt;클라이언트에 비밀키 없음&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;rate limit + audit log&lt;small&gt;누가 뭘 호출했는지 전부 기록&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;어드민 IP 허용&lt;small&gt;허가된 IP에서만&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot;&gt;webhook 서명 검증&lt;small&gt;메타·KIS·BODA 위조 차단&lt;/small&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer db&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:#fff&quot;&gt;🗄&lt;/span&gt;Supabase DB — 역할별로 보이는 범위가 다르다 (RLS)&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;사람·조직&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;organizations (트리)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;profiles (역할)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;students (담임 연결)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;subscriptions (빌링키·애드온)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;학교·학사&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;schools&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;school_events (수행·시험)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;exam_scopes (시험범위)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;학습 (코칭 루프의 원료)&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;units (단원 사전 ★좌표계)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;plan_items (플래너)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;lectures / lecture_views&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;problems / attempts&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;student_levels&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;grade_records&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;dbg&quot;&gt;&lt;div class=&quot;dbgt&quot;&gt;운영&lt;/div&gt;&lt;div class=&quot;lrow&quot;&gt;&lt;span class=&quot;pill&quot;&gt;notifications (auto/coach/hide)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;inquiry_threads / messages (문의)&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;leads (유입 자산)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;rlsnote&quot;&gt;&lt;b&gt;RLS 접근 범위&lt;/b&gt; — 학생: 자기 것만 · 학부모: 자녀 + hide 제외 알림 · 매니저: 담당 학생만 · &lt;b&gt;sales: leads만&lt;/b&gt; · 센터장: 자기 센터 트리 · 마스터: 전체(단, 집계 뷰/RPC 경유 + IP 게이트). 대시보드는 화면 하나에 범위만 축소.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ldown&quot;&gt;↓&lt;/div&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;lt&quot;&gt;&lt;span class=&quot;lic&quot; style=&quot;background:var(--ok-s)&quot;&gt;📤&lt;/span&gt;나가는 것 (출구)&lt;/div&gt;
        &lt;div class=&quot;lrow&quot;&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--sky-s);color:var(--sky)&quot;&gt;학생 웹푸시 (FCM)&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--coach-s);color:var(--coach)&quot;&gt;학부모 알림톡&lt;small&gt;auto 즉시 / coach 담임 검수 후&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--ok-s);color:var(--ok)&quot;&gt;AI 리포트&lt;small&gt;팩트+해석+다음 액션 (주간·시험·결제 D-3)&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--brand-s);color:var(--brand)&quot;&gt;대시보드&lt;small&gt;집계 뷰/RPC만 · Realtime&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--vio-s);color:var(--vio)&quot;&gt;외부 API&lt;small&gt;아이스캔 등 — 법인별 DB 분리, API 크로스만&lt;/small&gt;&lt;/span&gt;
          &lt;span class=&quot;pill&quot; style=&quot;background:var(--hide-s);color:var(--hide)&quot;&gt;구글시트 내보내기&lt;small&gt;보고용 only — 원본은 항상 DB&lt;/small&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1. 코칭 루프 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;1&lt;/span&gt;코칭 루프 — 제품의 심장&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;데이터 나열이 아니라 &lt;b&gt;&quot;다음에 뭘 할지&quot;를 계속 안내하는 멘토링 루프.&lt;/b&gt; 끝났는데 다음이 없는 상태를 만들지 않는다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;A 완료&lt;small&gt;강의 시청 / 문제 풀이&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;다음 B 자동 안내&lt;small&gt;오답→해설 / 개념→문제&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;푸시 알림&lt;small&gt;학생 웹푸시&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;수행 + 완료 체크&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;&quot;했다&quot; 기록·공유&lt;small&gt;엄마에게 좋은 소식&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;기록 축적 → 리포트&lt;small&gt;주간 자동 발송&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;span class=&quot;loopback&quot;&gt;↺ 리포트가 다시 다음 계획의 근거가 됨 — 무한 루프&lt;/span&gt;
    &lt;div class=&quot;note&quot;&gt;지치면? 피로 신호(미완료 누적·연속 학습·&quot;힘들어&quot; 발화) 감지 시 학습 대신 &lt;b&gt;쉼 콘텐츠&lt;/b&gt; 1개 추천. 멘토링은 밀어붙이기만이 아니니까.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 2. 시험대비 배정 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;2&lt;/span&gt;중등 시험대비 — 범위가 올라오면 공부가 꽂힌다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;수행평가 허브가 시험일을 먼저 알고, 범위만 올리면 &lt;b&gt;단원×출판사×레벨×D-day 역산&lt;/b&gt;으로 세트가 나온다. 언제 할지는 아이가 정한다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;수행평가 허브&lt;small&gt;시험일 D-day 자동 인지&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;D-14 &quot;범위 올려주세요&quot;&lt;small&gt;학생·학부모·담임 누구나&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;AI 파싱 → 단원 코드&lt;small&gt;사진·텍스트 OK&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;배정 엔진&lt;small&gt;취약 단원 우선 · 하루 용량 상한&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;아이가 슬롯 확정&lt;small&gt;언제 할지 선택 → 플래너&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;다음 스텝 안내 + 엄마 알림&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;미완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;남은 D-day 안에서 재배치&lt;small&gt;&quot;이번 주에 몰아서 끝내기&quot;&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;일정 변동&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node sky&quot;&gt;수정 제안&lt;small&gt;나만 → 내 일정 수정 / 학교 전체 → 정정 제보·검수 후 반영(SCH-03)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;범위 안 올라옴&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;D-10 담임 알림 → 진도 추정 가배정&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;시험 끝 → 성적 입력 → &lt;b&gt;레벨 보정 + 시험 리포트(RPT-02)&lt;/b&gt; 자동. 개념특강(라이브)은 이 흐름과 무관 — 학년별 정해진 타임에 자동 편성, 듣든 안 듣든 자유.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 3. 알림 분기 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;3&lt;/span&gt;알림 분기 — 좋은 소식은 바로, 나쁜 소식은 담임 경유&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;모든 이벤트는 룰 엔진을 거쳐 &lt;b&gt;auto / coach / hide&lt;/b&gt; 셋 중 하나로 갈라진다. 엄마에게 나쁜 소식이 날것으로 꽂히는 일이 없다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;이벤트 발생&lt;small&gt;출석·완료·미이행·성적·일정&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;룰 엔진&lt;small&gt;rule_id + 구독 플래그 + 행동태그&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;auto&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;즉시 발송&lt;small&gt;학생 웹푸시 + 학부모 알림톡&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar lbl&quot;&gt;출석·완료·일정·리포트&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;coach&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;담임 콘솔에 카드&lt;small&gt;[발송/문구 수정/비공개]&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;검수 후 학부모 발송&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase h&quot;&gt;hide&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node hide&quot;&gt;학생에게만&lt;small&gt;사소한 넛지 — 학부모 미발송&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;매니저 홈에는 이 결과가 행동 기준으로 떨어진다: &lt;b&gt;📞 통화할 것 · 💬 응답할 것 · ✅ 처리할 것 · 👀 확인만&lt;/b&gt; — &quot;포스트잇에 붙이지 않아도 되는 세상.&quot;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 4. 문의 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;4&lt;/span&gt;문의 — 전화 인바운드 없음, 남기면 담임에게 간다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 통합 카톡 하나로 응대 → 누락·오배정. 마이튜터는 &lt;b&gt;수신 단일 창구(인앱) + 담임 자동 라우팅 + 에스컬레이션&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node x&quot;&gt;전화 문의&lt;/span&gt;
      &lt;span class=&quot;ar lbl&quot;&gt;채널 자체가 없음&lt;/span&gt;
      &lt;span class=&quot;node start&quot;&gt;학부모, 앱에서 문의 남김&lt;small&gt;&quot;전화 연락 원해요&quot; 체크 가능&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;담임에게 자동 배정&lt;small&gt;학생당 스레드 1개 · 히스토리 영구&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;답변&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node ok&quot;&gt;알림톡 &quot;답변 도착&quot; + 앱 링크&lt;small&gt;카톡은 벨만 울림&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;콜백 요청&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;📞 통화할 것에 통화 약속 적재&lt;small&gt;우리가 거는 전화만 존재&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;24h 무응답&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;센터장 에스컬레이션 + 🔴 최상단 고정&lt;small&gt;누락 구조적 차단&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;카카오 채널로 문의가 와도 자동응답으로 앱 창구에 깔때기. 전 대화가 DB에 남아 &lt;b&gt;담임 교체 시 통째 인수인계&lt;/b&gt; + 대시보드에 응답속도 집계.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 5. 온라인 온보딩 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;5&lt;/span&gt;온라인 온보딩 — 방문 없이, 보여주고, 자유 가입&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 수업을 안 보여주고 방문 결제(346만 선결제·수수료 30만) → 기대 불일치·민원. 마이튜터는 &lt;b&gt;가입 전에 화면을 그대로 공개&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;초대링크 발송&lt;small&gt;카톡 — 예약·미팅·가입 통합&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;온라인 미팅&lt;small&gt;페인포인트 청취 + 화면 시연&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;자유 가입&lt;small&gt;월 20만 · 기간 선택 · 락인 없음&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;온보딩&lt;small&gt;학교 검색 → 허브 연동&lt;br&gt;국·영 출판사 → 레벨 진단&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;플래너 자동 완성&lt;small&gt;학사일정·수행·시험 D-day + 개념특강&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;리드·상담·페인포인트는 전부 DB로 — 전환 퍼널이 대시보드에 집계. 영업 난이도가 낮아져 &lt;b&gt;수수료 30만 → 소액&lt;/b&gt;, 이게 월 20만에서 마진이 나오는 근거.&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 6. 라이브 입장 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;6&lt;/span&gt;개념특강 입장 — 이름은 서버가 박는다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;아라온 실패 교훈: 아이들이 대화명을 바꿔 다른 학생 사칭. 마이튜터는 &lt;b&gt;입장 경로가 앱 버튼 하나&lt;/b&gt;고, 이름은 토큰에 바인딩된다.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;앱 &quot;본방 입장&quot; 버튼&lt;small&gt;유일한 입장 경로&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node vio&quot;&gt;서명 토큰 발급&lt;small&gt;user_id + 표시명 &quot;김민준(반포중2)&quot;&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node&quot;&gt;BODA 입장&lt;small&gt;이름 입력창 없음 · 변경 불가&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node sky&quot;&gt;입퇴장 webhook&lt;small&gt;user_id 기준&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;출석 자동 체크&lt;small&gt;GOOD-01 엄마 알림&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;2회 연속 미입장&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;CHK-01 담임 검수 → 학부모 안내&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase g&quot;&gt;녹화 종료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node&quot;&gt;VOD 자동 업로드&lt;small&gt;다시보기 — 진도율은 자체 기록&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note warn&quot;&gt;&lt;b&gt;BODA 계약 조건 4가지&lt;/b&gt;: ① 토큰 입장(이름 바인딩) ② 이름 변경 비활성 ③ 입퇴장 webhook ④ 녹화 수령 API — ①③ 미지원 시 API형 화상(LiveKit 등) 재검토.&lt;/div&gt;
  &lt;/div&gt;


  &lt;!-- 7. 구독·결제 --&gt;
  &lt;div class=&quot;fc&quot;&gt;
    &lt;h2&gt;&lt;span class=&quot;no&quot;&gt;7&lt;/span&gt;구독·결제 — &quot;잘하고 있다&quot;가 갱신 영업이다&lt;/h2&gt;
    &lt;div class=&quot;fd&quot;&gt;홈페이지에서 카드 등록 → &lt;b&gt;빌링키 발급 → 월 자동결제&lt;/b&gt; (넷플릭스식, 거부감 없음). 갱신 안내는 결제 요청이 아니라 &lt;b&gt;성과 리포트가 먼저&lt;/b&gt; 간다. 결제는 웹 — 인앱결제 수수료 회피.&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;span class=&quot;node start&quot;&gt;가입 시 카드 등록&lt;small&gt;홈페이지(웹) · KIS 빌링키&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node lime&quot;&gt;D-3 안내&lt;small&gt;&quot;이번 달 잘하고 있어요&quot; 리포트 + 결제 예고&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;node ok&quot;&gt;자동결제 성공&lt;small&gt;영수증·다음 결제일 알림톡&lt;/small&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;branch&quot;&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase r&quot;&gt;실패 1회&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node red&quot;&gt;자동 재시도 + 카드 변경 링크&lt;small&gt;사람 개입 없음&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bline&quot;&gt;&lt;span class=&quot;bcase c&quot;&gt;실패 2회&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;node coach&quot;&gt;담임 확인 후 연락&lt;small&gt;독촉이 아니라 도움 톤 (coach)&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;기간은 소비자 선택(월/3/6/12) · 위약금 락인 없음 · 해지는 웹 셀프서비스. &lt;b&gt;리텐션은 락인이 아니라 리포트(성과)가 만든다.&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
<script>
var cur=1, dev='pc';
var isTouch=matchMedia('(max-width:760px)').matches;
function apply(){
  var devOk=!isTouch && (cur===0||cur===1||cur===3||cur===4);
  for(var j=0;j<5;j++){
    var f=document.getElementById('f'+j);
    f.classList.toggle('on', j===cur);
    f.classList.toggle('mobf', j===cur && devOk && dev==='mob');
    document.getElementById('b'+j).classList.toggle('on', j===cur);
  }
  document.getElementById('dev').classList.toggle('off', !devOk);
  document.getElementById('d0').classList.toggle('on', dev==='mob');
  document.getElementById('d1').classList.toggle('on', dev==='pc');
  document.body.classList.toggle('mob', devOk && dev==='mob');
}
function sw(i){cur=i;apply();}
function dv(m){dev=m;apply();}
window.addEventListener('resize',function(){var s=matchMedia('(max-width:760px)').matches;if(s!==isTouch){isTouch=s;apply();}});
apply();
</script>
</body></html>
