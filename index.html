/* ===== 셸: 좌 네비 + 메인 ===== */
.shell{display:flex;min-height:100vh}

/* ===== 모달 ===== */
.ovl{position:fixed;inset:0;background:rgba(25,30,46,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:200;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px -6px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.24s}

/* ===== 반응형 (패드·노트북·모바일) ===== */
